name: Deploy poc-lab to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token set required by the official Pages deploy actions.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; a newer push supersedes an older run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm before setup-node so `cache: pnpm` can find the binary.
      # action-setup reads the version from the packageManager field (pnpm@9.9.0).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm validate

      - run: pnpm build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
