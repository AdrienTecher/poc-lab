 dont:{en:"Against area damage. Two brawlers in one hitbox is one Barley bottle hitting both, every time, forever.",fr:"Contre les dégâts de zone. Deux brawlers dans une hitbox, c'est une bouteille de Bartaba qui touche les deux, à chaque fois, pour toujours."}},

{id:"portal",parts:["gray","elprimo"],diff:2,modes:["gemgrab","brawlball","heist","hotzone"],
 n:{en:"Portal the tank in",fr:"Téléporte le tank"},
 why:{en:"The enemy's whole defence is built on the assumption that you have to walk.",fr:"Toute la défense adverse repose sur l'idée que tu dois marcher."},
 mech:{en:"Gray places two portals. Anyone on your team can step into one and come out the other. El Primo skips the entire approach and appears next to the marksman who thought a wall protected her.",fr:"Gray place deux portails. N'importe quel allié peut entrer dans l'un et sortir de l'autre. El Costo saute toute l'approche et apparaît à côté de la sniper qui se croyait protégée par un mur."},
 win:{en:"Tanks lose the walk, not the fight. Delete the walk and the matchup inverts — the marksman is now the one in trouble.",fr:"Les tanks perdent la marche, pas le combat. Supprime la marche et le duel s'inverse — c'est la sniper qui a un problème."},
 run:{en:"Place the exit somewhere the enemy isn't looking, not somewhere convenient. Tell your team the portal is up — most Gray Supers die of nobody using them.",fr:"Place la sortie là où l'ennemi ne regarde pas, pas là où c'est pratique. Préviens ton équipe que le portail est ouvert — la plupart des Supers de Gray meurent parce que personne ne s'en sert."},
 dont:{en:"Near your own safe or gem carrier. Portals work both directions. You built the enemy a door into your house.",fr:"Près de ton coffre ou de ton porteur de gemmes. Les portails marchent dans les deux sens. Tu viens de construire une porte chez toi."}},

{id:"peel",parts:["buster","mandy"],diff:1,modes:["knockout","bounty","heist"],
 n:{en:"The bodyguard",fr:"Le garde du corps"},
 why:{en:"Mandy's damage requires her to stand still. Someone has to make standing still survivable.",fr:"Les dégâts de Mandy exigent qu'elle reste immobile. Quelqu'un doit rendre l'immobilité survivable."},
 mech:{en:"Mandy stands and charges her beam across half the map. When a diver comes, Buster's Super pulls Mandy behind him and his shield blocks the shots she was about to eat.",fr:"Mandy se plante et charge son rayon sur la moitié de la carte. Quand un plongeur arrive, le Super de Buster tire Mandy derrière lui et son bouclier bloque les tirs qu'elle allait prendre."},
 win:{en:"The best marksman in the world is worth zero if she's dead at 30 seconds. Buster converts her fragility into a non-issue and lets her play the whole round.",fr:"La meilleure sniper du monde vaut zéro si elle est morte à 30 secondes. Buster transforme sa fragilité en non-problème et la laisse jouer toute la manche."},
 run:{en:"Buster stands in FRONT of her and slightly to the side, in the diver's lane. His Super is a rescue button — hold it for the dive, don't spend it pushing.",fr:"Buster se place DEVANT elle et légèrement de côté, dans le couloir du plongeur. Son Super est un bouton de sauvetage — garde-le pour le plongeon, ne le dépense pas pour avancer."},
 dont:{en:"When the damage is coming from a thrower. Buster blocks bullets, not bottles arcing over him.",fr:"Quand les dégâts viennent d'un lanceur. Buster bloque les balles, pas les bouteilles qui lui passent au-dessus."}},

{id:"cocoon",parts:["charlie","griff"],diff:1,modes:["knockout","gemgrab","bounty"],
 n:{en:"Cocoon and cash in",fr:"Cocon et encaisse"},
 why:{en:"Charlie removes one enemy from the game for three seconds. Three seconds is enough to end a round.",fr:"Charlie retire un ennemi du jeu pendant trois secondes. Trois secondes suffisent à finir une manche."},
 mech:{en:"Charlie's Super wraps an enemy in a cocoon — they cannot move, shoot, or use anything. Griff walks up and unloads all three rows of coins point-blank into a target that cannot leave.",fr:"Le Super de Charlie enferme un ennemi dans un cocon — il ne peut ni bouger, ni tirer, ni rien utiliser. Griff s'approche et vide ses trois rangées de pièces à bout portant dans une cible qui ne peut pas partir."},
 win:{en:"It's briefly 3v2, AND you get to choose who's missing. Take the one who was carrying — the marksman, the healer, the one with a full Super bar.",fr:"C'est brièvement un 3v2, ET tu choisis qui manque. Prends celui qui portait l'équipe — le sniper, le soigneur, celui qui a une barre de Super pleine."},
 run:{en:"Cocoon someone your team can actually walk to. The follow-up starts moving before the cocoon lands, not after.",fr:"Encoconne quelqu'un que ton équipe peut vraiment atteindre. Le suiveur commence à bouger avant que le cocon touche, pas après."},
 dont:{en:"On a diver who was losing. You just made him invulnerable and gave him a free reset. Cocoon the threat, not the corpse.",fr:"Sur un plongeur qui perdait. Tu viens de le rendre invulnérable et de lui offrir un reset gratuit. Encoconne la menace, pas le cadavre."}},

{id:"healblock",parts:["crow","colette"],diff:1,modes:["gemgrab","brawlball","hotzone","knockout"],
 n:{en:"Turn the healer off",fr:"Éteins le soigneur"},
 why:{en:"This is a draft, not a combo. It's here because it's the most useful thing to understand about tank comps.",fr:"C'est un draft, pas un combo. Il est là parce que c'est la chose la plus utile à comprendre sur les compos de tanks."},
 mech:{en:"Crow's poison stops the target healing at all. Colette's damage is a percentage of the enemy's maximum health, so the fatter the tank the harder she hits.",fr:"Le poison de Corbac empêche complètement les soins. Les dégâts de Colette sont un pourcentage de la vie max de l'ennemi, donc plus le tank est gros, plus elle frappe fort."},
 win:{en:"A Bull-and-Poco wall has exactly two weaknesses: healing that gets switched off, and health that gets taxed by percentage. This picks both at once. The tank comp doesn't get outplayed — it gets deleted from the draft.",fr:"Un mur Bull-et-Poco a exactement deux faiblesses : des soins qu'on éteint, et de la vie taxée en pourcentage. Ça prend les deux d'un coup. La compo tank ne se fait pas outplay — elle se fait supprimer au draft."},
 run:{en:"Crow poisons the tank, not the healer — the point is to stop the tank benefiting. Colette focuses the biggest health bar on the field, always.",fr:"Corbac empoisonne le tank, pas le soigneur — le but est d'empêcher le tank d'en profiter. Colette focus toujours la plus grosse barre de vie du terrain."},
 dont:{en:"Against squishies. Colette's percentage of a small health bar is a small number, and Crow's damage is genuinely weak. This comp beats fat and loses to thin.",fr:"Contre les fragiles. Le pourcentage de Colette sur une petite barre est un petit chiffre, et les dégâts de Corbac sont vraiment faibles. Cette compo bat le gros et perd contre le maigre."}},

{id:"zonestack",parts:["emz","barley"],diff:0,modes:["hotzone","gemgrab","heist"],
 n:{en:"Two clouds, no room",fr:"Deux nuages, plus de place"},
 why:{en:"One area of denied ground is annoying. Two overlapping ones is a wall made of damage.",fr:"Une zone interdite, c'est agaçant. Deux qui se chevauchent, c'est un mur fait de dégâts."},
 mech:{en:"Emz's cloud lingers and slows. Barley's puddles burn. Put them on the same chokepoint and there is no version of walking through that doesn't cost most of your health.",fr:"Le nuage d'Eliz@ persiste et ralentit. Les flaques de Bartaba brûlent. Mets-les sur le même goulot et il n'existe aucune façon de passer sans y laisser presque toute sa vie."},
 win:{en:"Hot Zone and Gem Grab are about owning a spot, not killing people. This owns a spot without either of you needing to win a single duel.",fr:"La Zone Réservée et la Razzia de Gemmes, c'est posséder un endroit, pas tuer des gens. Ça possède un endroit sans qu'aucun des deux ne gagne un seul duel."},
 run:{en:"Cover the entrance, not the middle. You want the cost paid on the way in, so they arrive at half health or don't arrive.",fr:"Couvre l'entrée, pas le milieu. Tu veux que le prix soit payé à l'entrée, pour qu'ils arrivent à moitié vie ou n'arrivent pas."},
 dont:{en:"On an open map with three entrances. You can't cover them all and you've picked two brawlers who need to.",fr:"Sur une carte ouverte à trois entrées. Tu ne peux pas toutes les couvrir et tu as pris deux brawlers qui en ont besoin."}},

{id:"longheal",parts:["byron","bull"],diff:1,modes:["gemgrab","brawlball","heist"],
 n:{en:"Healing from a safe distance",fr:"Soigner de loin"},
 why:{en:"Poco has to be near the fight. Byron doesn't.",fr:"Poco doit être près du combat. Byron non."},
 mech:{en:"Byron's dart heals over time from very far away. He tops Bull up from a position no assassin wants to walk to, and the same dart poisons an enemy if he aims the other way.",fr:"La fléchette de Byron soigne dans la durée, de très loin. Il remplit Bull depuis un endroit où aucun assassin ne veut aller, et la même fléchette empoisonne un ennemi s'il vise dans l'autre sens."},
 win:{en:"The usual counter to a tank-and-healer comp is to kill the healer. Byron makes that a long walk past your whole team. He also has real range, so he isn't dead weight when there's nothing to heal.",fr:"La réponse habituelle à une compo tank-soigneur, c'est de tuer le soigneur. Byron transforme ça en longue marche devant toute ton équipe. Il a aussi une vraie portée, donc il n'est pas un poids mort quand il n'y a rien à soigner."},
 run:{en:"His heal ticks over time — start it BEFORE Bull is low, not after. A dart thrown at a dying tank arrives too late by design.",fr:"Son soin agit dans la durée — commence-le AVANT que Bull soit bas, pas après. Une fléchette lancée sur un tank mourant arrive trop tard par conception."},
 dont:{en:"Against burst. Byron heals in ticks; Piper deals damage in one lump. Ticks lose that race.",fr:"Contre le burst. Byron soigne par paliers ; Polly frappe en un bloc. Les paliers perdent cette course."}},

{id:"healbear",parts:["nita","poco"],diff:0,modes:["gemgrab","brawlball","showdown","hotzone"],
 n:{en:"Heal the bear",fr:"Soigne l'ours"},
 why:{en:"Almost nobody realises the bear counts as a teammate.",fr:"Presque personne ne réalise que l'ours compte comme un allié."},
 mech:{en:"Poco's Super heals allies — and Nita's bear is an ally. A healed bear stops being a distraction and starts being a third brawler that hunts on its own.",fr:"Le Super de Poco soigne les alliés — et l'ours de Nita est un allié. Un ours soigné cesse d'être une diversion et devient un troisième brawler qui chasse tout seul."},
 win:{en:"The bear normally dies in a few seconds and buys you a moment. Kept alive, it's a permanent extra body on the map that the enemy has to deal with while you do something else.",fr:"L'ours meurt normalement en quelques secondes et t'achète un instant. Maintenu en vie, c'est un corps en plus permanent que l'ennemi doit gérer pendant que tu fais autre chose."},
 run:{en:"Poco aims his wave so it catches Nita AND the bear — it pierces, so line them up. Nita's star power that heals the bear stacks with this.",fr:"Poco vise son onde pour attraper Nita ET l'ours — elle transperce, donc aligne-les. Le pouvoir star de Nita qui soigne l'ours se cumule avec ça."},
 dont:{en:"Against Crow — poison shuts the healing down — or against anything that just walks around the bear. The bear is slow and not very smart.",fr:"Contre Corbac — le poison coupe les soins — ou contre tout ce qui contourne simplement l'ours. L'ours est lent et pas très malin."}},

{id:"mindcontrol",parts:["willow","dynamike"],diff:2,modes:["brawlball","gemgrab","knockout"],
 n:{en:"Borrow an enemy",fr:"Emprunte un ennemi"},
 why:{en:"For three seconds you have four brawlers and they have two.",fr:"Pendant trois secondes, tu as quatre brawlers et ils en ont deux."},
 mech:{en:"Willow's Super lets you drive an enemy. Walk them out of cover, into your Dynamike's dynamite, or into a pit if the map has one. You control the movement — their own team is now shooting at a friend.",fr:"Le Super de Willow te fait piloter un ennemi. Sors-le du couvert, emmène-le dans la dynamite de ton Dynamike, ou dans un trou si la carte en a un. Tu contrôles le déplacement — son équipe tire maintenant sur un ami."},
 win:{en:"Most control effects stop an enemy. This one turns an enemy into a liability for the people next to them.",fr:"La plupart des effets de contrôle arrêtent un ennemi. Celui-ci transforme un ennemi en danger pour ceux qui l'entourent."},
 run:{en:"Decide where you're taking them BEFORE you press it. Three seconds go faster than you think, and the most common Willow mistake is spending them wandering.",fr:"Décide où tu l'emmènes AVANT d'appuyer. Trois secondes passent plus vite que tu crois, et l'erreur la plus fréquente avec Willow, c'est de les passer à errer."},
 dont:{en:"On a brawler who's already out of position. Take the one whose absence breaks their formation — the healer, the goalie, the one holding the zone.",fr:"Sur un brawler déjà mal placé. Prends celui dont l'absence casse leur formation — le soigneur, le gardien, celui qui tient la zone."}},

{id:"isolate",parts:["cordelius","otis"],diff:2,modes:["knockout","bounty","gemgrab"],
 n:{en:"Take their best player out of the game",fr:"Sors leur meilleur joueur du jeu"},
 why:{en:"Two different ways to remove one person. Most teams have exactly one person worth removing.",fr:"Deux façons de retirer une personne. La plupart des équipes n'en ont qu'une qui mérite d'être retirée."},
 mech:{en:"Cordelius drags one enemy into a private dimension — a forced 1v1 where nobody can help either of them. Otis silences one enemy — no attack, no Super, nothing, for a few seconds.",fr:"Cordelius entraîne un ennemi dans une dimension privée — un 1v1 forcé où personne ne peut aider ni l'un ni l'autre. Otis rend un ennemi muet — pas d'attaque, pas de Super, rien, quelques secondes."},
 win:{en:"In Knockout there are no respawns, so the round is decided by whoever loses a player first. These two both answer 'which player' and let you pick.",fr:"En Hors-jeu, pas de réapparition, donc la manche se décide sur qui perd un joueur en premier. Ces deux-là répondent tous les deux à « quel joueur » et te laissent choisir."},
 run:{en:"Cordelius takes the one he BEATS in a duel, not the scariest one. Otis silences the one whose Super is charged and about to swing the round.",fr:"Cordelius prend celui qu'il BAT en duel, pas le plus effrayant. Otis muselle celui dont le Super est chargé et sur le point de tout renverser."},
 dont:{en:"Cordelius on a tank. In there, nobody helps you either — you've booked yourself a private appointment with a Frank.",fr:"Cordelius sur un tank. Là-dedans, personne ne t'aide non plus — tu viens de te réserver un rendez-vous privé avec un Frank."}},

{id:"markfocus",parts:["belle","brock"],diff:0,modes:["bounty","knockout","gemgrab"],
 n:{en:"Mark, then everyone shoots",fr:"Marque, puis tout le monde tire"},
 why:{en:"Focus fire wins fights. Belle just tells you where to point.",fr:"Le feu concentré gagne les combats. Belle te dit juste où viser."},
 mech:{en:"Belle's Super marks an enemy. Everything that hits them from then on hurts more — for the whole team, not just her. Brock's rockets land on a target that's now taking bonus damage from every source.",fr:"Le Super de Belle marque un ennemi. Tout ce qui le touche ensuite fait plus mal — pour toute l'équipe, pas juste elle. Les roquettes de Brock atterrissent sur une cible qui prend maintenant un bonus de tous les côtés."},
 win:{en:"The single most common way to lose a 3v3 is three people damaging three different enemies and killing none of them. A mark is a shared target call that nobody has to type.",fr:"La façon la plus fréquente de perdre un 3v3, c'est trois personnes qui blessent trois ennemis différents et n'en tuent aucun. Une marque, c'est un appel de cible partagé que personne n'a besoin d'écrire."},
 run:{en:"Mark the one you can actually kill this second — not the tank, not the one behind a wall. The mark expires.",fr:"Marque celui que tu peux vraiment tuer maintenant — pas le tank, pas celui derrière un mur. La marque expire."},
 dont:{en:"Marking early to 'set up'. It runs out and you've announced your plan for nothing.",fr:"Marquer tôt pour « préparer ». Ça expire et tu as annoncé ton plan pour rien."}},

{id:"funnel",parts:["emz","mandy"],diff:1,modes:["bounty","knockout","hotzone"],
 n:{en:"Close the doors, open the lane",fr:"Ferme les portes, ouvre le couloir"},
 why:{en:"Mandy's beam is unanswerable — if the enemy is in it. Emz decides where they can be.",fr:"Le rayon de Mandy est sans réponse — si l'ennemi est dedans. Eliz@ décide où il peut être."},
 mech:{en:"Emz's cloud makes two of the three routes cost too much. The one route left happens to be the lane Mandy is charging her beam down.",fr:"Le nuage d'Eliz@ rend deux des trois routes trop chères. La seule route restante est justement le couloir dans lequel Mandy charge son rayon."},
 win:{en:"You're not aiming better. You're reducing the number of places the enemy is allowed to exist until aiming is easy. This is what 'map control' actually means.",fr:"Tu ne vises pas mieux. Tu réduis le nombre d'endroits où l'ennemi a le droit d'exister jusqu'à ce que viser soit facile. C'est ça, le vrai sens de « contrôle de carte »."},
 run:{en:"Emz commits to the SIDE lanes and stays there. Mandy holds the middle and does not move — moving cancels the beam, which is the entire point of her.",fr:"Eliz@ s'engage sur les couloirs LATÉRAUX et y reste. Mandy tient le centre et ne bouge pas — bouger annule le rayon, ce qui est tout l'intérêt d'elle."},
 dont:{en:"Against a diver who ignores lanes. Mico hops the wall, Shade walks through it, and Mandy is standing perfectly still by design.",fr:"Contre un plongeur qui ignore les couloirs. Mico saute le mur, Shade le traverse, et Mandy est parfaitement immobile par conception."}},

{id:"chokehold",parts:["bo","barley"],diff:0,modes:["heist","hotzone","gemgrab"],
 n:{en:"Nobody uses that corridor",fr:"Personne n'emprunte ce couloir"},
 why:{en:"You don't have to win the chokepoint. You have to make it not worth trying.",fr:"Tu n'as pas besoin de gagner le goulot. Tu dois le rendre pas rentable."},
 mech:{en:"Bo's invisible mines sit in the corridor. Barley's puddles burn the ground in front of them. Walking in costs health; walking in fast costs a launch and then health.",fr:"Les mines invisibles de Bo sont dans le couloir. Les flaques de Bartaba brûlent le sol devant. Entrer coûte de la vie ; entrer vite coûte un envol puis de la vie."},
 win:{en:"Two brawlers now control a route without either of them standing in it. They're free to be somewhere else while the corridor defends itself.",fr:"Deux brawlers contrôlent une route sans qu'aucun n'y soit. Ils sont libres d'être ailleurs pendant que le couloir se défend tout seul."},
 run:{en:"Mines go around the corner, where the enemy is already committed and can't back out. Not at the entrance, where they see the animation and stop.",fr:"Les mines se posent après le virage, là où l'ennemi est déjà engagé et ne peut plus reculer. Pas à l'entrée, où il voit l'animation et s'arrête."},
 dont:{en:"When they have a wall-breaker. Colt, Brock, Shelly, Dynamike and Frank will just make a new corridor next to yours.",fr:"Quand ils ont un casseur de murs. Colt, Brock, Shelly, Dynamike et Frank vont simplement créer un nouveau couloir à côté du tien."}},

{id:"breakcharge",parts:["shelly","bull"],diff:1,modes:["brawlball","gemgrab","heist"],
 n:{en:"Break the wall, then charge through it",fr:"Casse le mur, puis charge à travers"},
 why:{en:"A wall is only cover until somebody removes it. Then it's a marked route.",fr:"Un mur n'est un abri que jusqu'à ce que quelqu'un l'enlève. Ensuite, c'est un itinéraire balisé."},
 mech:{en:"Shelly's Super blows a hole in the cover the enemy is hiding behind. Bull charges through the hole into a brawler who had planned their whole position around that wall existing.",fr:"Le Super de Shelly troue le couvert derrière lequel l'ennemi se cache. Bull charge à travers le trou sur un brawler qui avait bâti toute sa position sur l'existence de ce mur."},
 win:{en:"Tanks lose to geometry, not to damage. Change the geometry and the tank wins. This is the cheapest way to make a stalled Brawl Ball map move.",fr:"Les tanks perdent contre la géométrie, pas contre les dégâts. Change la géométrie et le tank gagne. C'est le moyen le moins cher de débloquer une carte de Brawl Ball figée."},
 run:{en:"Break the wall on the side the enemy ISN'T watching. Bull's own Super also breaks walls — chain them and you make a tunnel, not a door.",fr:"Casse le mur du côté que l'ennemi NE regarde PAS. Le Super de Bull casse aussi les murs — enchaîne-les et tu fais un tunnel, pas une porte."},
 dont:{en:"Breaking walls near your own gem carrier or safe. Cover is symmetrical. Every hole you make is a hole they can shoot through too.",fr:"Casser des murs près de ton porteur de gemmes ou de ton coffre. Le couvert est symétrique. Chaque trou que tu fais est un trou par lequel ils peuvent tirer aussi."}},

{id:"stunwall",parts:["buzz","spike"],diff:2,modes:["knockout","gemgrab","bounty"],
 n:{en:"Pin them in the field",fr:"Cloue-les dans le champ"},
 why:{en:"Spike's field is easy to walk out of. Unless you can't walk.",fr:"Le champ de Spike est facile à quitter. Sauf si tu ne peux pas marcher."},
 mech:{en:"Buzz's buoy latches onto a target, drags him to them and stuns them on arrival. Spike drops his slowing field on the spot. The stun ends and they're still slowed, still inside it, still taking damage.",fr:"La bouée de Buzz s'accroche à une cible, l'y attire et l'étourdit à l'arrivée. Spike pose son champ ralentissant dessus. L'étourdissement finit et ils sont toujours ralentis, toujours dedans, toujours en train de prendre des dégâts."},
 win:{en:"Stuns are short and slows are long. Chaining a short hard control into a long soft control means the escape window never actually opens.",fr:"Les étourdissements sont courts et les ralentissements sont longs. Enchaîner un contrôle dur et court dans un contrôle mou et long fait que la fenêtre de fuite ne s'ouvre jamais."},
 run:{en:"Buzz charges his Super faster near enemies and in bushes — get the bar full before you're seen. Spike throws the field where Buzz is going, not where he is.",fr:"Buzz charge son Super plus vite près des ennemis et dans les buissons — remplis la barre avant d'être vu. Spike lance le champ là où Buzz va, pas là où il est."},
 dont:{en:"Buzz diving into two people. The stun hits one; the other one kills him while he's standing in his own combo.",fr:"Buzz qui plonge sur deux personnes. L'étourdissement en touche un ; l'autre le tue pendant qu'il est planté dans son propre combo."}},

{id:"pulldyna",parts:["jacky","dynamike"],diff:1,modes:["hotzone","gemgrab","heist"],
 n:{en:"Hold them still under the dynamite",fr:"Tiens-les sous la dynamite"},
 why:{en:"Dynamike's problem is that dynamite takes a second to land and people have legs.",fr:"Le problème de Dynamike, c'est que la dynamite met une seconde à tomber et que les gens ont des jambes."},
 mech:{en:"Jacky's Super pulls everyone nearby toward her and her drill keeps hitting all of them at once. Dynamike throws into the pile. Nobody in that pile is going anywhere while Jacky is alive.",fr:"Le Super de Jacky attire tout le monde vers elle et son marteau les touche tous en même temps. Dynamike balance dans le tas. Personne dans ce tas ne va nulle part tant que Jacky est en vie."},
 win:{en:"Jacky is the only brawler in the game who genuinely wants to be surrounded. Pair her with someone whose damage also wants people bunched together and her weakness becomes the setup.",fr:"Jacky est la seule brawler du jeu qui veut vraiment être encerclée. Associe-la à quelqu'un dont les dégâts veulent aussi des gens groupés et sa faiblesse devient la mise en place."},
 run:{en:"Dynamike throws where Jacky WILL be after the pull, which is where she already is. She isn't moving; that's the whole plan.",fr:"Dynamike lance là où Jacky SERA après l'aspiration, c'est-à-dire là où elle est déjà. Elle ne bouge pas ; c'est tout le plan."},
 dont:{en:"Dynamike hits your Jacky too. This combo trades her health for their health — check she can afford it before you throw.",fr:"Dynamike touche aussi ta Jacky. Ce combo échange sa vie contre la leur — vérifie qu'elle peut se le permettre avant de lancer."}},

{id:"sprootgoal",parts:["sprout","frank"],diff:1,modes:["brawlball"],
 n:{en:"Wall the goal, then push",fr:"Mure le but, puis pousse"},
 why:{en:"A Sprout wall in the goalmouth is a goalkeeper that can't be shot.",fr:"Un mur de Wally dans la cage, c'est un gardien qu'on ne peut pas tirer."},
 mech:{en:"Sprout grows a wall directly across the enemy's shooting lane to your goal. It blocks the ball. While they're solving that, Frank hammers through their half and the ball comes back the other way.",fr:"Wally fait pousser un mur en travers du couloir de tir adverse vers ton but. Il bloque le ballon. Pendant qu'ils gèrent ça, Frank écrase leur moitié et le ballon repart dans l'autre sens."},
 win:{en:"Brawl Ball is decided by tempo. A wall doesn't kill anyone — it just deletes their shot and gives you the ten seconds you needed.",fr:"Le Brawl Ball se décide au tempo. Un mur ne tue personne — il supprime juste leur tir et t'offre les dix secondes qu'il te fallait."},
 run:{en:"Wall AS the shot is charging, not before. Placed early it's just a wall they walk around — and it blocks your clearance too.",fr:"Le mur PENDANT que le tir se charge, pas avant. Posé trop tôt, c'est juste un mur qu'ils contournent — et il bloque aussi ton dégagement."},
 dont:{en:"Against a wall-breaker. Colt, Brock, Shelly, Dynamike and Frank all delete Sprout's goalkeeper on the way past.",fr:"Contre un casseur de murs. Colt, Brock, Shelly, Dynamike et Frank effacent tous le gardien de Wally au passage."}},

{id:"turretbooster",parts:["8bit","jessie"],diff:0,modes:["heist","hotzone"],
 n:{en:"Buff the turret",fr:"Booste la tourelle"},
 why:{en:"8-Bit's booster works on turrets. Most people never test this.",fr:"Le booster d'A.R.K.A.D. marche sur les tourelles. Presque personne ne le teste."},
 mech:{en:"Jessie's turret sits inside 8-Bit's damage booster. It now shoots harder, forever, without anybody aiming it or standing next to it.",fr:"La tourelle de Jessie est posée dans le booster d'A.R.K.A.D. Elle tire plus fort, en permanence, sans que personne la vise ni reste à côté."},
 win:{en:"Two Supers spent once, producing damage for the rest of the round with no ongoing cost. In Heist, that's a defence that runs itself while your third brawler goes and does something useful.",fr:"Deux Supers dépensés une fois, produisant des dégâts jusqu'à la fin de la manche sans coût continu. En Braquage, c'est une défense autonome pendant que ton troisième brawler va faire quelque chose d'utile."},
 run:{en:"Booster first, turret inside it. Both slightly off to the side of the safe so one thrown bottle can't clear the whole setup.",fr:"Le booster d'abord, la tourelle dedans. Les deux légèrement à côté du coffre pour qu'une seule bouteille ne nettoie pas tout."},
 dont:{en:"Stacking everything in one square. You've built a very expensive pile of things that all die to the same Barley Super.",fr:"Tout empiler sur une case. Tu as construit un tas très cher de choses qui meurent toutes au même Super de Bartaba."}},

{id:"doublepull",parts:["gene","tara","spike"],diff:2,modes:["gemgrab","hotzone","knockout"],
 n:{en:"Two hands and a field",fr:"Deux mains et un champ"},
 why:{en:"The full version. Rare, hard to set up, and it ends rounds.",fr:"La version complète. Rare, difficile à mettre en place, et ça termine des manches."},
 mech:{en:"Gene pulls one isolated enemy into the group. Tara's black hole then catches all three at once instead of two. Spike's field lands on the pile.",fr:"D'jinn aspire un ennemi isolé vers le groupe. Le trou noir de Tara attrape ensuite les trois d'un coup au lieu de deux. Le champ de Spike atterrit sur le tas."},
 win:{en:"Tara's Super is limited by the enemy spreading out. Gene fixes that by fetching the straggler. You've turned a positioning problem into a button press.",fr:"Le Super de Tara est limité par l'écartement des ennemis. D'jinn règle ça en allant chercher le retardataire. Tu as transformé un problème de placement en appui de bouton."},
 run:{en:"Gene pulls the one standing APART, toward the other two. Tara Supers on the group the instant he lands. Spike throws last. Three Supers, one second, in that order — practice it in a friendly match first.",fr:"D'jinn aspire celui qui est À L'ÉCART, vers les deux autres. Tara Super sur le groupe dès qu'il atterrit. Spike lance en dernier. Trois Supers, une seconde, dans cet ordre — entraîne-toi d'abord en match amical."},
 dont:{en:"Ever, without three Supers ready and a team that knows the plan. Half of this combo is worse than none of it — you've spent everything and moved one enemy closer to your squishies.",fr:"Jamais, sans trois Supers prêts et une équipe au courant. La moitié de ce combo est pire que rien — tu as tout dépensé et rapproché un ennemi de tes fragiles."}},

{id:"moshpit",parts:["damian","barley"],diff:2,modes:["gemgrab","hotzone","brawlball"],
 n:{en:"Mosh pit, then the floor is lava",fr:"Le mosh pit, puis le sol devient lave"},
 why:{en:"Damian's Super doesn't kill anyone. It just holds them still while somebody else does.",fr:"Le Super de Damian ne tue personne. Il les maintient immobiles pendant que quelqu'un d'autre s'en charge."},
 mech:{en:"Damian jumps a wall and lands on two enemies. Speakers ring them in and launch them toward the centre. While airborne they cannot move, attack, use a Gadget, or use their Super — but they're immune to direct damage. Barley's fire is already on the landing spot.",fr:"Damian saute un mur et atterrit sur deux ennemis. Les enceintes les encerclent et les projettent vers le centre. En l'air, ils ne peuvent ni bouger, ni attaquer, ni utiliser de Gadget ou de Super — mais ils sont immunisés aux dégâts directs. Le feu de Bartaba est déjà sur la zone d'atterrissage."},
 win:{en:"A wall is not protection against Damian — he jumps it. This turns the enemy's safest square into their worst one. Because they're immune in the air, the value isn't hitting them mid-flight: it's that you know exactly where they'll land, seconds early, and they can't do anything about it.",fr:"Un mur ne protège pas de Damian — il le saute. Ça transforme la case la plus sûre de l'ennemi en la pire. Comme ils sont immunisés en l'air, la valeur n'est pas de les frapper en vol : c'est que tu sais exactement où ils vont atterrir, des secondes à l'avance, et qu'ils n'y peuvent rien."},
 run:{en:"Charge Damian's Super by walking into their poke on purpose — he charges from damage taken. Jump onto TWO enemies, never one. Barley throws the moment Damian leaves the ground, not before. Any ground-holder works: Dynamike, Sprout, Tick, Willow, Spike.",fr:"Charge le Super de Damian en avançant volontairement dans leur poke — il charge avec les dégâts subis. Saute sur DEUX ennemis, jamais un. Bartaba lance au moment où Damian décolle, pas avant. N'importe qui tenant le sol marche : Dynamike, Sprout, Tick, Willow, Spike."},
 dont:{en:"Solo-jumping into three enemies because the Super is ready. Without a teammate to punish the landing you have simply delivered yourself into the middle of their team, and the pit ends before your punches do.",fr:"Sauter seul sur trois ennemis parce que le Super est prêt. Sans allié pour punir l'atterrissage, tu t'es simplement livré au milieu de leur équipe, et la fosse se termine avant tes poings."}},

{id:"shadowfarm",parts:["sirius","frank"],diff:2,modes:["hotzone","heist","gemgrab"],
 n:{en:"Farm the Shadows, then send them in",fr:"Farmer les Ombres, puis les envoyer"},
 why:{en:"Sirius alone is a weak brawler. Sirius with three Shadows is a fourth, fifth and sixth player.",fr:"Sirius seul est un brawler faible. Sirius avec trois Ombres, c'est un quatrième, cinquième et sixième joueur."},
 mech:{en:"Every 4th hit Sirius lands steals that brawler's Shadow. He stores up to three. His Super spawns them as weaker clones of whoever he stole them from — and re-aiming the Super steers them to a spot on the map instead of following him.",fr:"Chaque 4e coup placé par Sirius vole l'Ombre du brawler touché. Il en stocke jusqu'à trois. Son Super les fait apparaître en clones plus faibles de ceux à qui il les a volées — et viser à nouveau les envoie à un endroit de la carte au lieu de le suivre."},
 win:{en:"Shadows can stand on an objective that you can't. In Hot Zone they hold the ring while Sirius stays safe; in Heist they chew the safe and body-block at the same time. You're not adding damage — you're adding bodies, which is the one thing no other brawler can do.",fr:"Les Ombres peuvent tenir un objectif que toi tu ne peux pas tenir. En Zone réservée, elles occupent le cercle pendant que Sirius reste en sécurité ; en Braquage, elles rongent le coffre et bloquent en même temps. Tu n'ajoutes pas des dégâts — tu ajoutes des corps, et c'est la seule chose qu'aucun autre brawler ne sait faire."},
 run:{en:"Hide behind the tank and poke — the Starr Bomb lobs over walls, so you can farm hits safely. Bank THREE Shadows before you summon; one Shadow is a wasted Super. Steal from their tank, not their marksman: you get a copy of the biggest health bar on the map.",fr:"Cache-toi derrière le tank et gratte — la Starr Bomb passe par-dessus les murs, donc tu peux farmer des coups en sécurité. Stocke TROIS Ombres avant d'invoquer ; une seule Ombre, c'est un Super gâché. Vole au tank, pas au tireur d'élite : tu obtiens une copie de la plus grosse barre de vie de la carte."},
 dont:{en:"Summon into splash. Nita, Tara, Emz, Penny and Carl delete all three Shadows with one attack, and they all vanish instantly if Sirius dies — so never summon while you're the one being dived.",fr:"Invoquer dans des dégâts de zone. Nita, Tara, Emz, Penny et Carl effacent les trois Ombres d'un seul coup, et elles disparaissent toutes instantanément si Sirius meurt — donc n'invoque jamais quand c'est toi qu'on plonge."}},

{id:"novacleanup",parts:["damian","starrnova"],diff:2,modes:["brawlball","gemgrab","bounty"],
 n:{en:"Trap it, then cut it",fr:"Piéger, puis trancher"},
 why:{en:"Starr Nova can't open a fight and survive. Damian can't finish one. Together that's a whole assassin.",fr:"Starr Nova ne peut pas ouvrir un combat et survivre. Damian ne peut pas en finir un. Ensemble, ça fait un assassin complet."},
 mech:{en:"Damian's mosh pit locks two enemies in place and strips their ability to act. Starr Nova Supers in during that window, transforms, and swings a wide sword arc. Every sword hit stacks +5% damage, up to +30% — and the stack survives a second Super.",fr:"Le mosh pit de Damian bloque deux ennemis sur place et leur retire toute action. Starr Nova entre avec son Super pendant cette fenêtre, se transforme et balaie un large arc d'épée. Chaque coup d'épée cumule +5 % de dégâts, jusqu'à +30 % — et le cumul survit à un second Super."},
 win:{en:"Her Star Power rewards hitting several bodies, and Damian has just stacked several bodies into one small circle for you. Her whole weakness is that she has ~7 seconds and no escape; the pit means none of those seconds are spent chasing.",fr:"Son Pouvoir Star récompense les coups sur plusieurs corps, et Damian vient justement d'empiler plusieurs corps dans un petit cercle pour toi. Toute sa faiblesse, c'est ses ~7 secondes sans échappatoire ; la fosse fait qu'aucune de ces secondes n'est perdue à poursuivre."},
 run:{en:"Damian jumps first, always. Starr Nova dashes in as they land, not while they're airborne — they're immune in the air and you'd waste half your timer. Count the seconds out loud: leave at five, not seven, or you turn back into the squishy form inside their team.",fr:"Damian saute en premier, toujours. Starr Nova fonce quand ils atterrissent, pas quand ils sont en l'air — ils y sont immunisés et tu gâcherais la moitié de ton chrono. Compte à voix haute : sors à cinq secondes, pas sept, sinon tu redeviens fragile au milieu de leur équipe."},
 dont:{en:"Send Starr Nova first. Without the pit she's diving a full team with the worst healing of any assassin, and she dies before the sword stack is worth anything.",fr:"Envoyer Starr Nova en premier. Sans la fosse, elle plonge sur une équipe entière avec les pires soins de tous les assassins, et elle meurt avant que le cumul d'épée ne vaille quoi que ce soit."}}
];

var MODES = [
{id:"gemgrab",n:{en:"Gem Grab",fr:"Razzia de Gemmes"},
 rew:{en:"Holding the middle. Not kills — the middle.",fr:"Tenir le centre. Pas les kills — le centre."},
 b:{en:"<p>Ten gems and a countdown. The team that holds the centre collects for free; the team that doesn't has to fight for every gem, and gems are lost when you die.</p><p><b>The one rule:</b> the gem carrier does not fight. Ever. Their job is to be boring and alive behind two teammates. If your carrier has 7 gems and is duelling, you have already lost and the scoreboard just hasn't caught up.</p><p><b>Pick:</b> someone who owns the middle (a thrower, a controller), someone who can take space (a tank), someone who punishes from range. Three of the same thing loses to a team with three different things.</p>",
    fr:"<p>Dix gemmes et un décompte. L'équipe qui tient le centre récolte gratuitement ; l'autre doit se battre pour chaque gemme, et on perd ses gemmes en mourant.</p><p><b>La règle unique :</b> le porteur de gemmes ne se bat pas. Jamais. Son boulot est d'être ennuyeux et vivant derrière deux alliés. Si ton porteur a 7 gemmes et duelle, tu as déjà perdu et le score n'a pas encore rattrapé.</p><p><b>Choisis :</b> quelqu'un qui possède le centre (un lanceur, un contrôleur), quelqu'un qui prend l'espace (un tank), quelqu'un qui punit à distance. Trois fois la même chose perd contre une équipe qui a trois choses différentes.</p>"}},

{id:"brawlball",n:{en:"Brawl Ball",fr:"Brawl Ball"},
 rew:{en:"Tempo. Being faster than them for three seconds.",fr:"Le tempo. Être plus rapide qu'eux pendant trois secondes."},
 b:{en:"<p>Football with weapons. Holding the ball slows you down and makes you the only target on the map.</p><p><b>The one rule:</b> don't solo the ball into three people. Pass it. A pass is instant and a walk is not. The most common loss in Brawl Ball is one player dribbling into a wall of enemies while two teammates stand behind them doing nothing.</p><p><b>Pick:</b> a wall-breaker (Colt, Brock, Shelly, Dynamike, Frank) — stalled Brawl Ball maps are stalled because of walls. Something with a speed or knockback Super for the last three seconds. Someone who can defend the goal without being in it.</p>",
    fr:"<p>Du foot avec des armes. Porter le ballon te ralentit et fait de toi la seule cible de la carte.</p><p><b>La règle unique :</b> ne fonce pas seul dans trois personnes. Fais la passe. Une passe est instantanée, une marche non. La défaite la plus fréquente en Brawl Ball, c'est un joueur qui dribble dans un mur d'ennemis pendant que deux alliés attendent derrière.</p><p><b>Choisis :</b> un casseur de murs (Colt, Brock, Shelly, Dynamike, Frank) — une carte figée est figée à cause des murs. Un truc avec un Super de vitesse ou de poussée pour les trois dernières secondes. Quelqu'un qui défend le but sans être dedans.</p>"}},

{id:"heist",n:{en:"Heist",fr:"Braquage"},
 rew:{en:"Damage on something that never dodges.",fr:"Des dégâts sur une chose qui n'esquive jamais."},
 b:{en:"<p>Two safes. Break theirs before they break yours. There is no third objective and no points for kills.</p><p><b>The one rule:</b> know whether you're attacking or defending, and don't do both badly. Heist is a race, and the team that commits first usually wins it. Trading kills in the middle is losing to both teams at once.</p><p><b>Pick:</b> burst damage on a stationary target (Colt, Bull, Darryl, Piper, Bea, Shelly, Bonnie, Dynamike) and something that makes the walk survivable. If defending: turrets, throwers, and anything that costs the attacker time.</p>",
    fr:"<p>Deux coffres. Casse le leur avant qu'ils cassent le tien. Pas de troisième objectif, pas de points pour les kills.</p><p><b>La règle unique :</b> sache si tu attaques ou si tu défends, et ne fais pas les deux mal. Le Braquage est une course, et l'équipe qui s'engage la première la gagne en général. Échanger des kills au milieu, c'est perdre contre les deux équipes à la fois.</p><p><b>Choisis :</b> des dégâts en burst sur cible immobile (Colt, Bull, Darryl, Polly, Béa, Shelly, Bonnie, Dynamike) et quelque chose qui rend la marche survivable. En défense : tourelles, lanceurs, et tout ce qui coûte du temps à l'attaquant.</p>"}},

{id:"bounty",n:{en:"Bounty",fr:"Prime"},
 rew:{en:"Not dying. Your stars are worth more than theirs.",fr:"Ne pas mourir. Tes étoiles valent plus que les leurs."},
 b:{en:"<p>Every kill gives them a star, and your bounty grows each time you kill. Dying with 7 stars on your head hands them the round.</p><p><b>The one rule:</b> the moment you are the highest bounty on the map, you become a support player. Play behind everyone. It feels bad. Do it anyway — that is the entire mode.</p><p><b>Pick:</b> range, range, and something that watches a bush. Bounty maps are open, which is why Piper, Brock, Bea, Belle, Mandy and Angelo live here. Bring one brawler who can punish a diver, or your snipers die at 30 seconds.</p>",
    fr:"<p>Chaque kill leur donne une étoile, et ta prime grandit à chaque kill que tu fais. Mourir avec 7 étoiles sur la tête leur offre la manche.</p><p><b>La règle unique :</b> dès que tu es la plus grosse prime de la carte, tu deviens un joueur de soutien. Joue derrière tout le monde. C'est frustrant. Fais-le quand même — c'est tout le mode.</p><p><b>Choisis :</b> de la portée, de la portée, et quelqu'un qui surveille un buisson. Les cartes de Prime sont ouvertes, c'est pour ça que Polly, Brock, Béa, Belle, Mandy et Angelo y vivent. Prends un brawler qui punit les plongeurs, sinon tes snipers meurent à 30 secondes.</p>"}},

{id:"knockout",n:{en:"Knockout",fr:"Hors-jeu"},
 rew:{en:"Patience. There are no respawns.",fr:"La patience. Il n'y a pas de réapparition."},
 b:{en:"<p>Three lives per round, total. Once you're gone, you're gone until the round ends.</p><p><b>The one rule:</b> never take a fair fight. A 1v1 you win at 20% health is a fight you lost, because now you're the free kill that makes it 3v2. Poison closes in eventually — let them come to you.</p><p><b>Pick:</b> anything that removes one enemy (Cordelius, Otis, Charlie), anything with range, and a healer. Sustain is worth far more here than in any respawn mode, because there's no second chance to trade with.</p>",
    fr:"<p>Trois vies par manche, en tout. Une fois mort, tu es mort jusqu'à la fin de la manche.</p><p><b>La règle unique :</b> ne prends jamais un combat équitable. Un 1v1 gagné à 20 % de vie est un combat perdu, parce que tu es maintenant le kill gratuit qui crée le 3v2. Le poison se resserre de toute façon — laisse-les venir.</p><p><b>Choisis :</b> tout ce qui retire un ennemi (Cordelius, Otis, Charlie), tout ce qui a de la portée, et un soigneur. Le sustain vaut bien plus ici que dans un mode avec réapparition, parce qu'il n'y a pas de seconde chance pour échanger.</p>"}},

{id:"hotzone",n:{en:"Hot Zone",fr:"Zone Réservée"},
 rew:{en:"Standing in a circle. Denying a circle.",fr:"Rester dans un cercle. Interdire un cercle."},
 b:{en:"<p>Hold the zone for points. You don't need to be alive-and-winning — you need to be in the circle.</p><p><b>The one rule:</b> you don't have to be in the zone if they can't be either. Denying the zone scores nothing for anybody, and nothing-for-anybody is a win when you're ahead. Throwers understand this and everyone else forgets it.</p><p><b>Pick:</b> zone denial (Barley, Tick, Sprout, Emz, Spike, Amber, Grom) and someone who can actually sit in the circle and survive — a tank with a healer. Multiple people standing in the same zone earns nothing extra: send them somewhere useful.</p>",
    fr:"<p>Tiens la zone pour marquer. Tu n'as pas besoin d'être vivant-et-gagnant — tu dois être dans le cercle.</p><p><b>La règle unique :</b> tu n'as pas besoin d'être dans la zone s'ils ne peuvent pas y être non plus. Interdire la zone ne marque rien pour personne, et rien-pour-personne est une victoire quand tu mènes. Les lanceurs le savent et tous les autres l'oublient.</p><p><b>Choisis :</b> de l'interdiction de zone (Bartaba, Tick, Wally, Eliz@, Spike, Ambre, Grom) et quelqu'un qui peut vraiment tenir le cercle — un tank avec un soigneur. Être plusieurs dans la même zone ne rapporte rien de plus : envoie-les ailleurs.</p>"}},

{id:"showdown",n:{en:"Showdown",fr:"Survivant"},
 rew:{en:"Third place. Seriously.",fr:"La troisième place. Sérieusement."},
 b:{en:"<p>Ten players, one winner, poison closing in. But you gain trophies from 4th place upward — you do not need to win.</p><p><b>The one rule:</b> let other people fight. Every duel you skip is two brawlers damaging each other for free while you collect power cubes. The player who arrives third to a 1v1 wins the 1v1.</p><p><b>Pick:</b> anything that heals itself, hides, or escapes — Shelly, Edgar, Leon, Bull, Rosa, Crow, Kit, Mortis, Sam, Fang. Throwers and immobile brawlers struggle here because there is no team to protect them.</p>",
    fr:"<p>Dix joueurs, un gagnant, le poison qui se resserre. Mais tu gagnes des trophées dès la 4e place — tu n'as pas besoin de gagner.</p><p><b>La règle unique :</b> laisse les autres se battre. Chaque duel évité, ce sont deux brawlers qui s'abîment gratuitement pendant que tu ramasses des cubes. Celui qui arrive troisième sur un 1v1 gagne le 1v1.</p><p><b>Choisis :</b> tout ce qui se soigne, se cache ou s'échappe — Shelly, Edgar, Léon, Bull, Rosa, Corbac, Kit, Mortis, Sam, Fang. Les lanceurs et les brawlers immobiles galèrent ici, parce qu'il n'y a pas d'équipe pour les protéger.</p>"}}

var KIT = [
{n:{en:"Gadget",fr:"Gadget"},
 b:{en:"<p>A few uses per match, then it's gone. That scarcity is the design: a gadget is <b>a plan you can afford three times</b>, not a button you press when it's off cooldown.</p><p>Pick the gadget that solves the problem you actually have. Facing divers? Take the escape. Facing a wall? Take the mobility. Most brawlers have one gadget that's good in every match and one that's excellent in a specific matchup — the second one wins more games than the first, if you're honest about the matchup.</p><p><b>The habit:</b> before the match starts, say what your gadget is for. If you can't, you picked wrong.</p>",
    fr:"<p>Quelques utilisations par match, puis c'est fini. Cette rareté, c'est le design : un gadget, c'est <b>un plan que tu peux te payer trois fois</b>, pas un bouton qu'on appuie dès qu'il est prêt.</p><p>Prends le gadget qui règle le problème que tu as vraiment. Des plongeurs en face ? Prends la fuite. Un mur ? Prends la mobilité. La plupart des brawlers ont un gadget bon dans tous les matchs et un excellent dans un match précis — le second gagne plus de parties, si tu es honnête sur le match.</p><p><b>Le réflexe :</b> avant le match, dis à quoi sert ton gadget. Si tu ne peux pas, tu as mal choisi.</p>"}},

{n:{en:"Star Power",fr:"Pouvoir Star"},
 b:{en:"<p>Always on, no cost, no decision during the match. Which means the decision is entirely made before it starts.</p><p>The trap is picking the one with the biggest number. Read what the star power actually does to <i>how you play</i>. A star power that heals you in bushes changes where you stand for the whole match. A star power that adds 10% damage changes nothing about your decisions — it just makes your existing decisions slightly better.</p><p><b>The habit:</b> prefer the one that changes your options over the one that changes your numbers.</p>",
    fr:"<p>Toujours actif, gratuit, aucune décision pendant le match. Donc la décision se prend entièrement avant.</p><p>Le piège, c'est de prendre celui avec le plus gros chiffre. Lis ce que le pouvoir star fait vraiment à <i>ta façon de jouer</i>. Un pouvoir qui te soigne dans les buissons change où tu te places pendant tout le match. Un pouvoir qui ajoute 10 % de dégâts ne change aucune de tes décisions — il rend juste tes décisions actuelles un peu meilleures.</p><p><b>Le réflexe :</b> préfère celui qui change tes options à celui qui change tes chiffres.</p>"}},

{n:{en:"Gears",fr:"Équipements"},
 b:{en:"<p>Small percentage upgrades in two slots. They are the least exciting part of the game and one of them is quietly the most important.</p><p><b>Vision</b> lets you see further into bushes. Most fights you lose in this game, you lose because someone was in a bush and you weren't. That is not a damage problem and no amount of damage gear fixes it.</p><p><b>Speed</b> wins the reposition, and the reposition is what decides whether you were in range or not. Everything else — damage, health, shield — makes a fight you were already having slightly better. Vision and Speed decide which fights happen.</p><p><b>The habit:</b> Vision + Speed is the boring correct default for most brawlers. Deviate on purpose, not by accident. Gears change between updates — check what's in your game.</p>",
    fr:"<p>De petites améliorations en pourcentage, sur deux emplacements. C'est la partie la moins excitante du jeu et l'une d'elles est discrètement la plus importante.</p><p><b>Vision</b> te fait voir plus loin dans les buissons. La plupart des combats que tu perds, tu les perds parce que quelqu'un était dans un buisson et pas toi. Ce n'est pas un problème de dégâts et aucun équipement de dégâts ne le règle.</p><p><b>Vitesse</b> gagne le replacement, et le replacement décide si tu étais à portée ou non. Tout le reste — dégâts, vie, bouclier — rend légèrement meilleur un combat que tu avais déjà. Vision et Vitesse décident quels combats ont lieu.</p><p><b>Le réflexe :</b> Vision + Vitesse est le défaut ennuyeux et correct pour la plupart des brawlers. Dévie exprès, pas par accident. Les équipements changent entre les mises à jour — vérifie ce qu'il y a dans ton jeu.</p>"}},

{n:{en:"Hypercharge",fr:"Hypercharge"},
 b:{en:"<p>A supercharged version of your Super that you charge by using your normal Super. It doesn't just make the Super bigger — it usually adds speed, damage reduction, and a new effect on top.</p><p>The real change is to <i>when</i> you play. A brawler with a hypercharge has a window: a few seconds where they beat almost anything. Your job stops being 'use my Super when it's ready' and becomes 'get to the window, then commit'.</p><p><b>The habit:</b> know whether the enemy's hypercharge is up. If their Frank has it, do not group up. Half of playing against hypercharge is just counting.</p>",
    fr:"<p>Une version surchargée de ton Super, que tu charges en utilisant ton Super normal. Ça ne fait pas que grossir le Super — ça ajoute en général de la vitesse, de la réduction de dégâts, et un nouvel effet par-dessus.</p><p>Le vrai changement, c'est <i>quand</i> tu joues. Un brawler avec une hypercharge a une fenêtre : quelques secondes où il bat presque tout. Ton boulot n'est plus « utiliser mon Super quand il est prêt » mais « atteindre la fenêtre, puis s'engager ».</p><p><b>Le réflexe :</b> sache si l'hypercharge adverse est prête. Si leur Frank l'a, ne vous regroupez pas. Jouer contre l'hypercharge, c'est à moitié juste compter.</p>"}}
];

var BASICS = [
{n:{en:"The loop",fr:"La boucle"},loop:true,
 b:{en:"<p>This is the shape of the whole game. It's not exact — a good player breaks it constantly — but if you don't know where you sit in it, you're guessing.</p><p><b>Tanks</b> beat <b>assassins</b>, because an assassin who dives a tank has jumped into a fight they can't leave. <b>Assassins</b> beat <b>marksmen</b>, because a marksman up close is a person holding a rifle by the barrel. <b>Marksmen</b> beat <b>tanks</b>, because a tank has to walk and walking takes time you spend shooting them.</p><p>Around the loop: <b>throwers</b> punish anyone who stands still, and die to anyone who arrives. <b>Supports</b> and <b>controllers</b> don't sit in the loop — they change who wins the matchups that are already happening.</p>",
    fr:"<p>Voilà la forme de tout le jeu. Ce n'est pas exact — un bon joueur la casse en permanence — mais si tu ne sais pas où tu te situes dedans, tu devines.</p><p>Les <b>tanks</b> battent les <b>assassins</b>, parce qu'un assassin qui plonge sur un tank a sauté dans un combat qu'il ne peut pas quitter. Les <b>assassins</b> battent les <b>tireurs d'élite</b>, parce qu'un sniper de près est quelqu'un qui tient un fusil par le canon. Les <b>tireurs d'élite</b> battent les <b>tanks</b>, parce qu'un tank doit marcher et que la marche prend un temps que tu passes à lui tirer dessus.</p><p>Autour de la boucle : les <b>lanceurs</b> punissent tout ce qui reste immobile, et meurent de tout ce qui arrive. Les <b>soutiens</b> et les <b>contrôleurs</b> ne sont pas dans la boucle — ils changent qui gagne les duels qui ont déjà lieu.</p>"}},

{n:{en:"Count their Supers",fr:"Compte leurs Supers"},
 b:{en:"<p>This is the skill that separates good players from everyone else, and it costs nothing but attention.</p><p>Every Super in the game is visible on the enemy's health bar. When the enemy Frank has his Super, you do not stand next to your teammates. When he spends it, you have about fifteen seconds where his entire threat is a slow hammer, and that is your window to do anything you want.</p><p>Most players react to Supers. Better players wait for them to be gone. Same brawlers, same aim, completely different match.</p><p><b>Start with one:</b> pick the scariest enemy and track only theirs. Add more when it's automatic.</p>",
    fr:"<p>C'est la compétence qui sépare les bons joueurs de tous les autres, et elle ne coûte que de l'attention.</p><p>Chaque Super du jeu est visible sur la barre de vie de l'ennemi. Quand le Frank adverse a son Super, tu ne restes pas collé à tes alliés. Quand il le dépense, tu as environ quinze secondes où toute sa menace est un marteau lent, et c'est ta fenêtre pour faire ce que tu veux.</p><p>La plupart des joueurs réagissent aux Supers. Les meilleurs attendent qu'ils soient partis. Mêmes brawlers, même visée, match complètement différent.</p><p><b>Commence par un seul :</b> prends l'ennemi le plus effrayant et suis uniquement le sien. Ajoute les autres quand c'est automatique.</p>"}},

{n:{en:"Bushes are the map",fr:"Les buissons sont la carte"},
 b:{en:"<p>You don't lose fights. You lose the two seconds before the fight, in a bush you didn't check.</p><p>Every bush is either yours or theirs. Yours means you know what's in it. Theirs means you're guessing, and guessing is how a Shelly gets to full-Super range for free.</p><p>Ways to own a bush without walking into it: shoot into it (any hit reveals), throw something over it, Bo's vision star power, a Vision gear, a teammate standing where they can see. Ways to lose to a bush: walk past it while looking somewhere else.</p><p><b>The habit:</b> when a lane goes quiet, someone is in a bush. Quiet is information.</p>",
    fr:"<p>Tu ne perds pas les combats. Tu perds les deux secondes d'avant, dans un buisson que tu n'as pas vérifié.</p><p>Chaque buisson est le tien ou le leur. Le tien, ça veut dire que tu sais ce qu'il y a dedans. Le leur, ça veut dire que tu devines, et deviner, c'est comme ça qu'une Shelly arrive à portée de Super gratuitement.</p><p>Comment posséder un buisson sans y entrer : tirer dedans (toute touche révèle), lancer quelque chose par-dessus, le pouvoir star de vision de Bo, un équipement Vision, un allié placé de façon à voir. Comment perdre contre un buisson : passer à côté en regardant ailleurs.</p><p><b>Le réflexe :</b> quand un couloir devient silencieux, quelqu'un est dans un buisson. Le silence est une information.</p>"}},

{n:{en:"Make it 3v2",fr:"Fais-en un 3v2"},
 b:{en:"<p>Almost every combo on this page is a way of doing the same thing: briefly making it three of you against two of them.</p><p>You don't need a wipe. You need one enemy to be somewhere else for four seconds — pulled, stunned, cocooned, dead, or simply walked too far forward. Everything after that is easy, because 3v2 is not a small advantage. It's the whole fight.</p><p>This also tells you what to do when it happens to you: when you're the one who's alone, do not fight. Walk back. The 3v2 expires by itself if you don't feed it.</p>",
    fr:"<p>Presque tous les combos de cette page font la même chose : créer brièvement un trois contre deux.</p><p>Tu n'as pas besoin d'un ace. Tu as besoin qu'un ennemi soit ailleurs pendant quatre secondes — aspiré, étourdi, encoconné, mort, ou simplement trop avancé. Tout le reste devient facile, parce que le 3v2 n'est pas un petit avantage. C'est tout le combat.</p><p>Ça te dit aussi quoi faire quand ça t'arrive : quand c'est toi qui es seul, ne te bats pas. Recule. Le 3v2 expire tout seul si tu ne le nourris pas.</p>"}},

{n:{en:"Range is a resource",fr:"La portée est une ressource"},
 b:{en:"<p>Damage numbers are visible. Range is not, and it decides more matches.</p><p>A brawler at their best range is a different brawler from the same one two tiles closer. Piper at maximum range beats almost anything; Piper at three tiles loses to almost anything. Same brawler, same level, opposite result.</p><p>So the question in any duel isn't 'who does more damage' — it's <b>'who gets to choose the distance'</b>. If you can pick the range, you've already won. If they can, walk away and find a fight where you can.</p><p><b>The habit:</b> before you engage, ask whose range you're standing in. If the answer is theirs, that's not a fight, it's a donation.</p>",
    fr:"<p>Les chiffres de dégâts sont visibles. La portée, non, et c'est elle qui décide le plus de matchs.</p><p>Un brawler à sa portée idéale est un brawler différent du même deux cases plus près. Polly à portée maximale bat presque tout ; Polly à trois cases perd contre presque tout. Même brawler, même niveau, résultat opposé.</p><p>Donc la question dans un duel n'est pas « qui fait le plus de dégâts » — c'est <b>« qui choisit la distance »</b>. Si tu peux choisir la portée, tu as déjà gagné. Si c'est eux, va-t'en et trouve un combat où tu peux.</p><p><b>Le réflexe :</b> avant de t'engager, demande-toi dans la portée de qui tu te tiens. Si la réponse est « la leur », ce n'est pas un combat, c'est un don.</p>"}},

{n:{en:"How to actually get better",fr:"Comment progresser vraiment"},
 b:{en:"<p>Playing more games is not practice. It's just playing more games.</p><p><b>Pick one brawler for a week.</b> Not your favourite three — one. You cannot learn a matchup you experience once a day. The players who climb fastest have a smaller roster than the players who don't.</p><p><b>After a loss, say the sentence out loud:</b> \"I lost because ___\". If the sentence is \"my teammates were bad\", you learned nothing and the next match will be the same. Make it something you did: I walked into a bush. I used my Super on a full-health tank. I fought a Piper at her range.</p><p><b>Learn one combo properly instead of ten badly.</b> A combo you can do under pressure is worth more than nine you can describe. Start with the two-brawler ones marked Easy.</p><p><b>Watch replays of your own losses, not other people's wins.</b> Your mistakes are more useful than a pro's highlights, because they're yours and you'll make them again tomorrow.</p>",
    fr:"<p>Jouer plus de parties n'est pas de l'entraînement. C'est juste jouer plus de parties.</p><p><b>Prends un seul brawler pour une semaine.</b> Pas tes trois préférés — un. Tu ne peux pas apprendre un matchup que tu vis une fois par jour. Les joueurs qui montent le plus vite ont un roster plus petit que les autres.</p><p><b>Après une défaite, dis la phrase à voix haute :</b> « J'ai perdu parce que ___ ». Si la phrase est « mes coéquipiers étaient nuls », tu n'as rien appris et le match suivant sera identique. Trouve quelque chose que TU as fait : je suis entré dans un buisson. J'ai utilisé mon Super sur un tank plein. J'ai combattu une Polly à sa portée.</p><p><b>Apprends un combo correctement plutôt que dix mal.</b> Un combo que tu réussis sous pression vaut plus que neuf que tu sais décrire. Commence par ceux à deux brawlers marqués Facile.</p><p><b>Regarde les replays de tes défaites, pas les victoires des autres.</b> Tes erreurs sont plus utiles que les highlights d'un pro, parce qu'elles sont à toi et que tu les referas demain.</p>"}}
];
