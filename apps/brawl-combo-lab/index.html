   ========================================================================== */
var L = "en", TAB = "combos", PICKS = [], OPEN = {};
var B = {}; BRAWLERS.forEach(function(b){ B[b.id] = b; });

function t(){ return T[L]; }
function nm(b){ return (L === "fr" && b.fr) ? b.fr : b.en; }
function alt(b){ return b.fr ? (L === "fr" ? b.en : b.fr) : null; }
function tx(o){ return o ? (o[L] || o.en) : ""; }
function norm(s){
  return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9 ]/g, " ");
}
function band(r){ return r <= 35 ? "short" : (r <= 68 ? "mid" : "long"); }
function roleVar(c){ return "var(--r-" + c + ")"; }
function initial(b){ var n = b.en.replace(/[^A-Za-z0-9]/g, ""); return n.slice(0, 2).toUpperCase(); }

/* ---------- search index ---------- */
function hay(kind, o){
  var s = [];
  if (kind === "brawler"){
    s.push(o.en, o.fr || "", o.cls, T.en.cls[o.cls], T.fr.cls[o.cls], o.tags.join(" "),
           o.k.en, o.k.fr, o.w.en, o.w.fr, o.f.en, o.f.fr, band(o.reach));
  } else if (kind === "combo"){
    s.push(o.n.en, o.n.fr, o.why.en, o.why.fr, o.mech.en, o.mech.fr, o.win.en, o.win.fr,
           o.run.en, o.run.fr, o.dont.en, o.dont.fr, o.modes.join(" "));
    o.parts.forEach(function(p){
      var b = B[p]; if (!b) return;
      s.push(b.en, b.fr || "", b.cls, T.en.cls[b.cls], T.fr.cls[b.cls], b.tags.join(" "));
    });
    o.modes.forEach(function(m){
      var md = MODES.filter(function(x){ return x.id === m; })[0];
      if (md) s.push(md.n.en, md.n.fr);
    });
  } else if (kind === "mode"){
    s.push(o.n.en, o.n.fr, o.rew.en, o.rew.fr, o.b.en.replace(/<[^>]+>/g, " "), o.b.fr.replace(/<[^>]+>/g, " "));
  } else {
    s.push(o.n.en, o.n.fr, o.b.en.replace(/<[^>]+>/g, " "), o.b.fr.replace(/<[^>]+>/g, " "));
  }
  return norm(s.join(" "));
}
/* _h is everything; _t is only names and labels, so a search for "bull"
   ranks Bull above the twelve combos that mention bulls in passing. */
BRAWLERS.forEach(function(o){
  o._h = hay("brawler", o);
  o._t = norm([o.en, o.fr || "", o.cls, T.en.cls[o.cls], T.fr.cls[o.cls], o.tags.join(" "), band(o.reach)].join(" "));
});
COMBOS.forEach(function(o){
  o._h = hay("combo", o);
  var s = [o.n.en, o.n.fr];
  o.parts.forEach(function(p){ var b = B[p]; if (b) s.push(b.en, b.fr || "", b.cls, T.en.cls[b.cls], T.fr.cls[b.cls]); });
  o.modes.forEach(function(mi){
    var md = MODES.filter(function(x){ return x.id === mi; })[0];
    if (md) s.push(md.n.en, md.n.fr);
  });
  o._t = norm(s.join(" "));
});
MODES.forEach(function(o){ o._h = hay("mode", o); o._t = norm(o.n.en + " " + o.n.fr); });
KIT.forEach(function(o){ o._h = hay("kit", o); o._t = norm(o.n.en + " " + o.n.fr); });
BASICS.forEach(function(o){ o._h = hay("basic", o); o._t = norm(o.n.en + " " + o.n.fr); });

function match(o, terms){
  return terms.every(function(w){ return o._h.indexOf(w) !== -1; });
}
function rank(list, terms){
  return list.filter(function(o){ return match(o, terms); }).map(function(o){
    var s = 0;
    terms.forEach(function(w){ if (o._t.indexOf(w) !== -1) s++; });
    return { o: o, s: s };
  }).sort(function(a, b){ return b.s - a.s; }).map(function(x){ return x.o; });
}

/* ---------- pieces ---------- */
function chipRole(cls){
  return '<span class="chip role" style="background:' + roleVar(cls) + '">' + t().cls[cls] + '</span>';
}
function pip(b){
  return '<div class="pip" style="background:' + roleVar(b.cls) + '">' + initial(b) + '</div>';
}
function brawlerCard(b){
  var a = alt(b);
  return '<article class="card" style="border-left-color:' + roleVar(b.cls) + '">' +
    '<div class="bw">' + pip(b) +
      '<div style="flex:1;min-width:0">' +
        '<div class="nm">' + nm(b) + (a ? ' <span class="alt">(' + a + ')</span>' : '') + '</div>' +
        '<div class="li">' + tx(b.k) + '</div>' +
        '<div class="wf">' +
          '<div><b>' + t().wants + ':</b> ' + tx(b.w) + '</div>' +
          '<div><i>' + t().fears + ':</i> ' + tx(b.f) + '</div>' +
        '</div>' +
        '<div class="chips">' + chipRole(b.cls) +
          '<span class="chip">' + t()[band(b.reach)] + '</span>' +
          b.tags.slice(0, 3).map(function(g){ return '<span class="chip">' + g + '</span>'; }).join('') +
        '</div>' +
      '</div>' +
    '</div></article>';
}
function comboCard(c){
  var open = !!OPEN[c.id];
  var parts = c.parts.map(function(p){ return B[p] ? nm(B[p]) : p; }).join(' <i>+</i> ');
  var mds = c.modes.map(function(m){
    var md = MODES.filter(function(x){ return x.id === m; })[0];
    return md ? '<span class="chip">' + tx(md.n) + '</span>' : '';
  }).join('');
  var lead = B[c.parts[0]];
  var d = '<div class="detail">' +
    '<dl>' +
      '<dt>' + t().mech + '</dt><dd>' + tx(c.mech) + '</dd>' +
      '<dt>' + t().win + '</dt><dd>' + tx(c.win) + '</dd>' +
      '<dt>' + t().run + '</dt><dd>' + tx(c.run) + '</dd>' +
      '<dt>' + t().dont + '</dt><dd class="warn">' + tx(c.dont) + '</dd>' +
    '</dl><div class="chips">' + mds + '</div></div>';
  return '<article class="card combo" tabindex="0" role="button" data-c="' + c.id + '" aria-expanded="' + open + '"' +
    ' style="border-left-color:' + (lead ? roleVar(lead.cls) : 'var(--gold)') + '">' +
    '<div class="top"><div class="names">' +
      '<div class="parts">' + parts + '</div>' +
      '<h3>' + tx(c.n) + '</h3>' +
    '</div><span class="caret">&#9654;</span></div>' +
    '<p class="why">' + tx(c.why) + '</p>' +
    '<div class="chips"><span class="chip diff d' + (c.diff + 1) + '">' + t().diff[c.diff] + '</span></div>' +
    (open ? d : '') + '</article>';
}
function modeCard(m){
  return '<article class="card" style="border-left-color:var(--star)">' +
    '<h3>' + tx(m.n) + '</h3>' +
    '<div class="kv">' + tx(m.rew) + '</div>' +
    '<div class="prose" style="margin-top:8px">' + tx(m.b) + '</div></article>';
}
function proseCard(p){
  return '<article class="card" style="border-left-color:var(--gold)">' +
    '<h3>' + tx(p.n) + '</h3>' +
    (p.loop ? loopHTML() : '') +
    '<div class="prose" style="margin-top:10px">' + tx(p.b) + '</div></article>';
}
function loopHTML(){
  var c = t().cls;
  var w = L === "fr" ? ["Encaisse", "Plonge", "Distance"] : ["Absorbs", "Dives", "Outranges"];
  return '<div class="loop">' +
    '<div class="n" style="border-color:var(--r-tank)"><span>' + c.tank + '</span><small>' + w[0] + '</small></div>' +
    '<div class="ar">&#9654;</div>' +
    '<div class="n" style="border-color:var(--r-assassin)"><span>' + c.assassin + '</span><small>' + w[1] + '</small></div>' +
    '<div class="ar">&#9654;</div>' +
    '<div class="n" style="border-color:var(--r-marksman)"><span>' + c.marksman + '</span><small>' + w[2] + '</small></div>' +
    '</div><div class="loopnote">' +
    (L === "fr" ? "…et le tireur d'élite reboucle sur le tank. &#9654; veut dire « bat »."
                : "…and the marksman loops back to the tank. &#9654; means \"beats\".") +
    '</div>';
}

/* ---------- the range ruler ---------- */
function ruler(list){
  if (!list.length) return "";
  var sorted = list.slice().sort(function(a, b){ return a.reach - b.reach; });
  var lastX = -99, up = true;
  var marks = sorted.map(function(b){
    var off = 0;
    if (b.reach - lastX < 10){ off = up ? -15 : 15; up = !up; } else { up = true; }
    lastX = b.reach;
    var x = Math.max(4, Math.min(96, b.reach));
    return '<div class="mk" style="left:' + x + '%;background:' + roleVar(b.cls) +
      ';margin-top:' + (off - 13) + 'px" title="' + nm(b) + '">' + initial(b) + '</div>';
  }).join('');
  return '<div class="ruler"><div class="kv">' + t().ruler + '</div>' +
    '<div class="track" style="margin-top:22px;margin-bottom:22px">' +
      '<div class="band" style="left:35%"></div><div class="band" style="left:68%"></div>' + marks +
    '</div><div class="labs"><span>' + t().melee + '</span><span>' + t().mid + '</span><span>' + t().long + '</span></div></div>';
}

/* ---------- the comp doctor ---------- */
function has(list, tag){ return list.some(function(b){ return b.tags.indexOf(tag) !== -1; }); }
function whoHas(list, tags){
  return list.filter(function(b){ return tags.some(function(g){ return b.tags.indexOf(g) !== -1; }); })
             .map(nm).join(", ");
}
function suggest(tags, n){
  var out = BRAWLERS.filter(function(b){
    return PICKS.indexOf(b.id) === -1 && tags.some(function(g){ return b.tags.indexOf(g) !== -1; });
  });
  return out.slice(0, n || 2).map(nm).join(" " + (L === "fr" ? "ou" : "or") + " ");
}
function job(ok, txt){
  return '<div class="job ' + (ok ? "ok" : "no") + '"><span class="ic">' + (ok ? "&#10003;" : "&#10007;") + '</span><div>' + txt + '</div></div>';
}

function diagnose(){
  var p = PICKS.map(function(i){ return B[i]; });
  if (p.length < 2) return '<p class="empty">' + t().doctorEmpty + '</p>';
  var fr = L === "fr", out = "", jobs = "";
  var bands = { short: 0, mid: 0, long: 0 };
  p.forEach(function(b){ bands[band(b.reach)]++; });

  out += ruler(p);

  /* range spread */
  var spread = Object.keys(bands).filter(function(k){ return bands[k] > 0; }).length;
  if (spread === 1){
    var only = band(p[0].reach);
    jobs += job(false, fr
      ? "<b>Tout le monde a la même portée (" + t()[only].toLowerCase() + ").</b> Un seul contre bien choisi neutralise ton équipe entière. Ajoute une portée différente : " + suggest(only === "long" ? ["frontline", "dive"] : ["poke", "burst"], 2) + "."
      : "<b>Everyone has the same range (" + t()[only].toLowerCase() + ").</b> One well-picked counter shuts down your whole team at once. Add a different band: " + suggest(only === "long" ? ["frontline", "dive"] : ["poke", "burst"], 2) + ".");
  } else {
    jobs += job(true, fr
      ? "<b>Portées variées.</b> L'ennemi ne peut pas régler ton équipe avec un seul pick."
      : "<b>Range is spread.</b> The enemy can't answer your team with one pick.");
  }
  if (!bands.long && p.length >= 3){
    jobs += job(false, fr
      ? "<b>Aucune longue portée.</b> Un sniper te tient à distance toute la partie et tu n'as rien à répondre. Essaie " + suggest(["poke", "burst"], 2) + "."
      : "<b>No long range.</b> A sniper holds you off all match and you have no reply. Try " + suggest(["poke", "burst"], 2) + ".");
  }

  /* frontline */
  if (has(p, "frontline")){
    jobs += job(true, fr
      ? "<b>Quelqu'un prend l'espace</b> (" + whoHas(p, ["frontline"]) + ") — il y a un corps devant."
      : "<b>Someone takes space</b> (" + whoHas(p, ["frontline"]) + ") — there's a body out front.");
  } else {
    jobs += job(false, fr
      ? "<b>Personne devant.</b> Aucun de vous ne peut avancer et survivre : vous allez jouer toute la partie sur la défensive. Essaie " + suggest(["frontline"], 2) + "."
      : "<b>Nobody up front.</b> None of you can walk forward and live, so you'll play the whole match on the back foot. Try " + suggest(["frontline"], 2) + ".");
  }

  /* sustain */
  if (has(p, "heal") || has(p, "shield")){
    jobs += job(true, fr
      ? "<b>Du sustain</b> (" + whoHas(p, ["heal", "shield"]) + ") — vous gagnez les combats longs."
      : "<b>You have sustain</b> (" + whoHas(p, ["heal", "shield"]) + ") — you win the long fights.");
  } else {
    jobs += job(false, fr
      ? "<b>Aucun soin, aucun bouclier.</b> Chaque échange est définitif. Ça marche si tu tues vite ; sinon essaie " + suggest(["heal", "shield"], 2) + "."
      : "<b>No healing, no shields.</b> Every trade is permanent. Fine if you kill fast; otherwise try " + suggest(["heal", "shield"], 2) + ".");
  }

  /* control */
  var cc = ["stun", "pull", "knock", "slow"];
  if (has(p, "stun") || has(p, "pull") || has(p, "knock") || has(p, "slow")){
    jobs += job(true, fr
      ? "<b>Du contrôle</b> (" + whoHas(p, cc) + ") — tu peux décider où l'ennemi se trouve."
      : "<b>You have control</b> (" + whoHas(p, cc) + ") — you get to decide where the enemy is.");
  } else {
    jobs += job(false, fr
      ? "<b>Aucun contrôle.</b> Tu ne peux pas créer de 3v2 — tu dois attendre qu'ils se trompent. Essaie " + suggest(["pull", "stun", "knock"], 2) + "."
      : "<b>No control.</b> You can't make a 3v2 happen — you have to wait for them to make a mistake. Try " + suggest(["pull", "stun", "knock"], 2) + ".");
  }

  /* zone */
  if (has(p, "zone")){
    jobs += job(true, fr
      ? "<b>Interdiction de zone</b> (" + whoHas(p, ["zone"]) + ") — tu peux tenir un point sans t'y trouver."
      : "<b>Area denial</b> (" + whoHas(p, ["zone"]) + ") — you can hold a point without standing on it.");
  } else {
    jobs += job(false, fr
      ? "<b>Aucune zone.</b> Tenir le centre ou une zone voudra dire y rester physiquement, et se faire tirer dessus. Essaie " + suggest(["zone"], 2) + "."
      : "<b>No area denial.</b> Holding the middle or a zone means physically standing there and getting shot. Try " + suggest(["zone"], 2) + ".");
  }

  /* anti-dive */
  var peel = p.filter(function(b){
    return b.cls !== "assassin" && (b.tags.indexOf("frontline") !== -1 || b.tags.indexOf("stun") !== -1 ||
      b.tags.indexOf("knock") !== -1 || b.tags.indexOf("shield") !== -1 || (b.reach <= 42 && b.tags.indexOf("burst") !== -1));
  });
  var squishy = p.filter(function(b){ return b.reach >= 69; });
  if (squishy.length && !peel.length){
    jobs += job(false, fr
      ? "<b>Tes snipers sont sans protection.</b> " + squishy.map(nm).join(", ") + " meurent au premier plongeur et personne ne peut les sortir de là. Essaie " + suggest(["frontline", "knock", "shield"], 2) + "."
      : "<b>Your snipers have no protection.</b> " + squishy.map(nm).join(", ") + " die to the first diver and nobody can pull them out. Try " + suggest(["frontline", "knock", "shield"], 2) + ".");
  } else if (peel.length){
    jobs += job(true, fr
      ? "<b>Quelqu'un punit les plongeurs</b> (" + peel.map(nm).join(", ") + ")."
      : "<b>Someone punishes divers</b> (" + peel.map(nm).join(", ") + ").");
  }

  /* wallbreak */
  if (has(p, "wallbreak")){
    jobs += job(true, fr
      ? "<b>Tu peux casser les murs</b> (" + whoHas(p, ["wallbreak"]) + ") — utile en Brawl Ball et Braquage."
      : "<b>You can break walls</b> (" + whoHas(p, ["wallbreak"]) + ") — useful in Brawl Ball and Heist.");
  }

  /* redundancy */
  var cls = {}; p.forEach(function(b){ cls[b.cls] = (cls[b.cls] || 0) + 1; });
  var dup = Object.keys(cls).filter(function(k){ return cls[k] >= (p.length === 3 ? 3 : 2); });
  if (dup.length && p.length === 3){
    jobs += job(false, fr
      ? "<b>Trois " + t().clsP[dup[0]] + ".</b> Vous faites tous le même boulot, donc vous avez tous la même faiblesse."
      : "<b>Three " + t().clsP[dup[0]] + ".</b> You're all doing the same job, so you all have the same weakness.");
  }

  out += '<div class="kv" style="margin-top:18px">' + t().dxTitle + '</div><div class="dx">' + jobs + '</div>';

  /* synergies from the library */
  var found = COMBOS.filter(function(c){
    return c.parts.length >= 2 && c.parts.every(function(x){ return PICKS.indexOf(x) !== -1; });
  });
  if (found.length){
    out += found.map(function(c){
      return '<article class="card syn" style="margin-top:12px">' +
        '<div class="lbl">' + t().synT + '</div>' +
        '<div class="parts" style="font-family:var(--display);font-size:15px;color:var(--gold);margin:3px 0 2px">' +
          c.parts.map(function(x){ return nm(B[x]); }).join(' <i style="color:var(--faint);font-style:normal">+</i> ') + '</div>' +
        '<h3 style="font-size:16px">' + tx(c.n) + '</h3>' +
        '<p class="why" style="margin-top:6px">' + tx(c.run) + '</p></article>';
    }).join('');
  } else if (p.length >= 2){
    var setup = p.filter(function(b){ return ["pull", "stun", "knock", "slow", "invis", "speed", "shield"].some(function(g){ return b.tags.indexOf(g) !== -1; }); });
    var payoff = p.filter(function(b){ return ["zone", "burst", "frontline", "dive"].some(function(g){ return b.tags.indexOf(g) !== -1; }); });
    setup = setup.filter(function(b){ return payoff.indexOf(b) === -1; });
    if (setup.length && payoff.length){
      out += '<article class="card syn" style="margin-top:12px"><div class="lbl">' + t().synT + '</div>' +
        '<p class="why" style="margin-top:5px">' + (fr
          ? "<b>" + setup.map(nm).join(", ") + "</b> met en place, <b>" + payoff.map(nm).join(", ") + "</b> encaisse. C'est le schéma de presque tous les combos : quelqu'un crée le moment, quelqu'un le dépense. La mise en place passe en premier, toujours."
          : "<b>" + setup.map(nm).join(", ") + "</b> sets up, <b>" + payoff.map(nm).join(", ") + "</b> cashes in. That's the shape of almost every combo: someone makes the moment, someone spends it. The setup goes first, always.") + '</p></article>';
    }
  }
  return out;
}

function doctorView(){
  var slots = [0, 1, 2].map(function(i){
    var id = PICKS[i];
    if (!id) return '<div class="slot"><div><div class="plus">+</div><div>' + t().slot + '</div></div></div>';
    var b = B[id];
    return '<div class="slot full" data-drop="' + id + '" tabindex="0" role="button" style="border-color:' + roleVar(b.cls) + '">' +
      '<div>' + pip(b) + '<div class="sn">' + nm(b) + '</div>' +
      '<div class="sr" style="color:' + roleVar(b.cls) + '">' + t().cls[b.cls] + '</div></div></div>';
  }).join('');
  var pick = BRAWLERS.map(function(b){
    var on = PICKS.indexOf(b.id) !== -1;
    return '<button class="pk" data-add="' + b.id + '"' + (on || PICKS.length >= 3 ? " disabled" : "") +
      ' style="border-color:' + (on ? roleVar(b.cls) : "var(--line)") + '">' + nm(b) + '</button>';
  }).join('');
  return '<p class="lede">' + t().doctorL + '</p>' +
    '<div class="slots">' + slots + '</div>' +
    (PICKS.length ? '<div style="text-align:right;margin:-4px 0 10px"><button class="reset" id="rst">' + t().reset + '</button></div>' : '') +
    '<div class="kv">' + t().pickers + '</div><div class="picker">' + pick + '</div>' +
    diagnose();
}

/* ---------- render ---------- */
function render(){
  var d = T[L], q = norm(document.getElementById("q").value).trim();
  var terms = q ? q.split(/\s+/).filter(Boolean) : [];
  document.documentElement.lang = L;
  document.getElementById("q").placeholder = d.ph;
  document.getElementById("foot").textContent = d.foot;
  document.getElementById("clr").classList.toggle("hide", !q);

  document.getElementById("tabs").innerHTML = Object.keys(d.tabs).map(function(k){
    return '<button class="tab" role="tab" data-t="' + k + '" aria-selected="' + (!terms.length && TAB === k) + '">' + d.tabs[k] + '</button>';
  }).join('');

  var m = document.getElementById("main"), h = "";

  if (terms.length){
    var cb = rank(COMBOS, terms);
    var bw = rank(BRAWLERS, terms);
    var md = rank(MODES, terms);
    var pg = rank(KIT.concat(BASICS), terms);
    var n = cb.length + bw.length + md.length + pg.length;
    if (!n){
      h = '<p class="empty">' + d.nores + '<br><span style="font-size:13px">' + d.nores2 + '</span></p>';
    } else {
      h += '<div class="count">' + n + " " + (n === 1 ? d.found : d.founds) + '</div>';
      if (cb.length) h += '<div class="sect-h">' + d.tabs.combos + '</div>' + cb.map(comboCard).join('');
      if (bw.length) h += '<div class="sect-h">' + d.tabs.brawlers + '</div>' + bw.map(brawlerCard).join('');
      if (md.length) h += '<div class="sect-h">' + d.tabs.modes + '</div>' + md.map(modeCard).join('');
      if (pg.length) h += '<div class="sect-h">' + d.tabs.basics + '</div>' + pg.map(proseCard).join('');
    }
  } else if (TAB === "combos"){
    h = '<p class="lede">' + d.combosL + '</p>' + COMBOS.map(comboCard).join('');
  } else if (TAB === "brawlers"){
    var by = { tank: 1, assassin: 2, marksman: 3, artillery: 4, controller: 5, support: 6, damage: 7 };
    h = '<p class="lede">' + d.brawlersL + '</p>' +
      BRAWLERS.slice().sort(function(a, b){ return (by[a.cls] - by[b.cls]) || (a.reach - b.reach); })
        .map(brawlerCard).join('');
  } else if (TAB === "doctor"){
    h = doctorView();
  } else if (TAB === "modes"){
    h = '<p class="lede">' + d.modesL + '</p>' + MODES.map(modeCard).join('');
  } else if (TAB === "kit"){
    h = '<p class="lede">' + d.kitL + '</p>' + KIT.map(proseCard).join('');
  } else if (TAB === "basics"){
    h = '<p class="lede">' + d.basicsL + '</p>' + BASICS.map(proseCard).join('');
  }
  m.innerHTML = h;
}

/* ---------- events ---------- */
function setLang(x){
  L = x;
  document.getElementById("l-en").setAttribute("aria-pressed", x === "en");
  document.getElementById("l-fr").setAttribute("aria-pressed", x === "fr");
  render();
}
document.getElementById("l-en").onclick = function(){ setLang("en"); };
document.getElementById("l-fr").onclick = function(){ setLang("fr"); };
document.getElementById("q").addEventListener("input", render);
document.getElementById("clr").onclick = function(){
  document.getElementById("q").value = ""; render(); document.getElementById("q").focus();
};
document.getElementById("tabs").addEventListener("click", function(e){
  var b = e.target.closest("[data-t]"); if (!b) return;
  TAB = b.dataset.t; document.getElementById("q").value = ""; render();
  window.scrollTo({ top: 0, behavior: "smooth" });
});
function act(e){
  var c = e.target.closest("[data-c]");
  if (c){ OPEN[c.dataset.c] = !OPEN[c.dataset.c]; render(); return; }
  var a = e.target.closest("[data-add]");
  if (a && !a.disabled){ if (PICKS.length < 3 && PICKS.indexOf(a.dataset.add) === -1) PICKS.push(a.dataset.add); render(); return; }
  var r = e.target.closest("[data-drop]");
  if (r){ PICKS = PICKS.filter(function(x){ return x !== r.dataset.drop; }); render(); return; }
  if (e.target.id === "rst"){ PICKS = []; render(); }
}
document.getElementById("main").addEventListener("click", act);
document.getElementById("main").addEventListener("keydown", function(e){
  if (e.key === "Enter" || e.key === " "){
    if (e.target.closest("[data-c],[data-drop]")){ e.preventDefault(); act(e); }
  }
});

if ((navigator.language || "en").toLowerCase().indexOf("fr") === 0) L = "fr";
setLang(L);
</script>
</body>
</html>
