<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Combo Lab — Brawl Stars</title>
<meta name="description" content="Search and understand Brawl Stars combos. Why they work, how to run them, when not to.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   COMBO LAB — arcade cabinet at night.
   Colour encodes ROLE. It is information, not decoration.
   ============================================================ */
:root{
  /* ground */
  --ink:      oklch(0.15 0.038 280);
  --ink-2:    oklch(0.21 0.040 280);
  --ink-3:    oklch(0.27 0.045 280);
  --shadow:   oklch(0.09 0.030 280);
  --line:     oklch(0.38 0.050 280);
  --text:     oklch(0.97 0.008 280);
  --dim:      oklch(0.74 0.022 280);
  --faint:    oklch(0.58 0.030 280);
  /* accents */
  --gold:     oklch(0.84 0.160 88);
  --star:     oklch(0.72 0.190 302);
  --good:     oklch(0.80 0.170 148);
  --bad:      oklch(0.70 0.200 25);
  /* role hues — same order everywhere in the app */
  --r-tank:       oklch(0.72 0.170 48);
  --r-assassin:   oklch(0.68 0.200 312);
  --r-marksman:   oklch(0.78 0.140 202);
  --r-artillery:  oklch(0.82 0.180 132);
  --r-controller: oklch(0.72 0.190 348);
  --r-support:    oklch(0.86 0.150 96);
  --r-damage:     oklch(0.68 0.200 25);

  --display: "Lilita One", "Arial Black", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px;
}
@supports not (color: oklch(0.5 0.1 180)){
  :root{
    --ink:#1d1830;--ink-2:#2b2545;--ink-3:#3a3358;--shadow:#100d1c;--line:#5a5180;
    --text:#f6f4ff;--dim:#b4aed0;--faint:#847ca8;
    --gold:#ffc233;--star:#c264ff;--good:#4fe08a;--bad:#ff6b52;
    --r-tank:#ff9142;--r-assassin:#c264ff;--r-marksman:#4fd4e8;
    --r-artillery:#8ee83c;--r-controller:#ff5fa8;--r-support:#ffd24a;--r-damage:#ff6b52;
  }
}
*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;background:var(--ink);color:var(--text);
  font-family:var(--body);font-size:16px;line-height:1.55;
  /* faint arcade scanline haze — ambient, never in the way */
  background-image:
    radial-gradient(1100px 620px at 50% -10%, oklch(0.30 0.075 300 / .55), transparent 70%),
    repeating-linear-gradient(0deg, oklch(1 0 0 / .015) 0 1px, transparent 1px 3px);
  background-attachment:fixed;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3,h4{font-family:var(--display);font-weight:400;line-height:1.05;letter-spacing:.01em;margin:0;}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:4px;}
.wrap{max-width:920px;margin:0 auto;padding:0 14px;}
.hide{display:none !important;}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:50;
  background:oklch(0.15 0.038 280 / .93);backdrop-filter:blur(10px);
  border-bottom:2px solid var(--line);
}
.bar{display:flex;align-items:center;gap:10px;padding:9px 0 8px;}
.logo{font-family:var(--display);font-size:19px;letter-spacing:.02em;white-space:nowrap;}
.logo b{color:var(--gold);font-weight:400;}
.logo .lm{color:var(--star);}
.spacer{flex:1;}
.lang{display:flex;border:2px solid var(--line);border-radius:99px;overflow:hidden;background:var(--ink-2);}
.lang button{background:none;border:0;padding:4px 11px;font-weight:700;font-size:12px;color:var(--dim);letter-spacing:.06em;}
.lang button[aria-pressed="true"]{background:var(--gold);color:var(--shadow);}

/* ---------- search ---------- */
.searchrow{position:relative;padding-bottom:9px;}
#q{
  width:100%;padding:13px 42px 13px 40px;
  background:var(--ink-2);color:var(--text);
  border:2.5px solid var(--line);border-radius:var(--r);
  box-shadow:0 3px 0 var(--shadow);
  font-family:var(--body);font-size:16px;
}
#q::placeholder{color:var(--faint);}
#q:focus{border-color:var(--gold);outline:none;box-shadow:0 3px 0 var(--shadow);}
.si{position:absolute;left:26px;top:12px;font-size:17px;opacity:.75;pointer-events:none;}
.clr{position:absolute;right:24px;top:9px;background:none;border:0;color:var(--faint);font-size:20px;padding:2px 6px;line-height:1;}
.clr:hover{color:var(--text);}

/* ---------- tabs ---------- */
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 14px 9px;max-width:920px;margin:0 auto;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;}
nav.tabs::-webkit-scrollbar{display:none;}
.tab{
  flex:0 0 auto;background:var(--ink-2);border:2px solid var(--line);border-radius:99px;
  padding:6px 13px;font-weight:700;font-size:13px;color:var(--dim);white-space:nowrap;
  transition:transform .08s;
}
.tab:active{transform:translateY(1px);}
.tab[aria-selected="true"]{background:var(--star);border-color:var(--star);color:#fff;}

/* ---------- generic card ---------- */
.card{
  background:var(--ink-2);border:2px solid var(--line);border-radius:var(--r);
  box-shadow:0 3px 0 var(--shadow);padding:14px;margin:0 0 12px;
  border-left-width:6px;border-left-color:var(--line);
}
.card h3{font-size:19px;margin-bottom:3px;}
.lede{color:var(--dim);font-size:14.5px;margin:0 0 14px;}
.sect-h{font-family:var(--display);font-size:15px;color:var(--gold);letter-spacing:.09em;
  text-transform:uppercase;margin:22px 0 9px;}
.sect-h:first-child{margin-top:6px;}

/* ---------- chips ---------- */
.chip{
  display:inline-flex;align-items:center;gap:4px;
  font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;padding:2px 7px;border-radius:5px;
  background:var(--ink-3);color:var(--dim);border:1px solid var(--line);
}
.chip.role{color:var(--shadow);border:0;}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px;}
.diff{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.05em;}
.d1{color:var(--good);} .d2{color:var(--gold);} .d3{color:var(--bad);}

/* ---------- combo card ---------- */
.combo{cursor:pointer;}
.combo .top{display:flex;align-items:flex-start;gap:9px;}
.combo .names{flex:1;min-width:0;}
.combo .parts{font-family:var(--display);font-size:15px;color:var(--gold);
  letter-spacing:.02em;margin-bottom:2px;}
.combo .parts i{color:var(--faint);font-style:normal;padding:0 3px;}
.combo h3{font-size:17px;color:var(--text);}
.combo .why{color:var(--dim);font-size:14.5px;margin:9px 0 0;}
.caret{color:var(--faint);font-size:13px;flex:0 0 auto;transition:transform .15s;margin-top:3px;}
.combo[aria-expanded="true"] .caret{transform:rotate(90deg);}
.detail{margin-top:12px;padding-top:12px;border-top:2px dashed var(--line);}
.detail dl{margin:0;}
.detail dt{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--star);margin-top:11px;}
.detail dt:first-child{margin-top:0;}
.detail dd{margin:3px 0 0;font-size:14.5px;color:var(--text);}
.detail dd.warn{color:var(--bad);}

/* ---------- brawler card ---------- */
.bw{display:flex;gap:11px;align-items:flex-start;}
.pip{
  flex:0 0 auto;width:42px;height:42px;border-radius:9px;
  display:grid;place-items:center;font-family:var(--display);font-size:16px;
  color:var(--shadow);box-shadow:0 2px 0 var(--shadow);
}
.bw .nm{font-family:var(--display);font-size:17px;line-height:1.1;}
.bw .alt{font-size:12px;color:var(--faint);font-style:italic;}
.bw .li{font-size:14px;color:var(--dim);margin-top:5px;}
.bw .wf{font-size:13.5px;margin-top:7px;}
.bw .wf div{margin-top:3px;}
.bw .wf b{color:var(--good);font-weight:700;}
.bw .wf i{color:var(--bad);font-style:normal;font-weight:700;}

/* ---------- range ruler — the signature ---------- */
.ruler{margin:16px 0 4px;}
.ruler .track{
  position:relative;height:16px;border-radius:99px;border:2px solid var(--line);
  background:linear-gradient(90deg,
    oklch(0.68 0.200 312 / .55) 0%,
    oklch(0.72 0.170 48 / .5) 30%,
    oklch(0.82 0.180 132 / .5) 58%,
    oklch(0.78 0.140 202 / .55) 100%);
  box-shadow:inset 0 2px 5px var(--shadow);
}
.ruler .band{position:absolute;top:-2px;bottom:-2px;border-left:2px dashed oklch(1 0 0 / .3);}
.ruler .mk{
  position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;
  border-radius:50%;border:3px solid var(--ink);
  display:grid;place-items:center;font-family:var(--display);font-size:11px;
  color:var(--shadow);box-shadow:0 2px 0 var(--shadow);
}
.ruler .labs{display:flex;justify-content:space-between;margin-top:7px;
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--faint);text-transform:uppercase;}

/* ---------- comp doctor ---------- */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px;}
.slot{
  background:var(--ink-2);border:2.5px dashed var(--line);border-radius:var(--r);
  min-height:84px;padding:8px 5px;display:grid;place-items:center;text-align:center;
  color:var(--faint);font-size:12px;box-shadow:0 3px 0 var(--shadow);
}
.slot.full{border-style:solid;cursor:pointer;}
.slot .sn{font-family:var(--display);font-size:14px;color:var(--text);line-height:1.1;margin-top:5px;
  word-break:break-word;hyphens:auto;}
.slot .sr{font-family:var(--mono);font-size:9px;letter-spacing:.05em;text-transform:uppercase;margin-top:2px;}
.slot .plus{font-size:26px;font-family:var(--display);}
.picker{max-height:210px;overflow-y:auto;border:2px solid var(--line);border-radius:var(--r);
  background:var(--ink-2);padding:7px;display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px;}
.pk{background:var(--ink-3);border:2px solid var(--line);border-radius:7px;padding:3px 8px;
  font-size:12.5px;font-weight:700;}
.pk:disabled{opacity:.28;cursor:not-allowed;}
.dx{margin-top:4px;}
.job{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--ink-3);
  font-size:14.5px;}
.job:last-child{border-bottom:0;}
.job .ic{flex:0 0 auto;font-family:var(--display);font-size:15px;width:17px;text-align:center;line-height:1.4;}
.job.ok .ic{color:var(--good);} .job.no .ic{color:var(--bad);}
.job.no{color:var(--dim);}
.job b{color:var(--text);}
.syn{border-left-color:var(--gold) !important;background:oklch(0.84 0.160 88 / .09);}
.syn .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--gold);
  text-transform:uppercase;font-weight:700;}
.empty{text-align:center;color:var(--faint);padding:34px 14px;font-size:14.5px;}
.reset{background:var(--ink-2);border:2px solid var(--line);border-radius:99px;padding:5px 14px;
  font-size:12.5px;font-weight:700;color:var(--dim);}

/* ---------- loop diagram ---------- */
.loop{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:5px;
  margin:14px 0 4px;text-align:center;}
.loop .n{background:var(--ink-3);border:2px solid var(--line);border-radius:9px;padding:9px 4px;
  box-shadow:0 3px 0 var(--shadow);}
.loop .n span{font-family:var(--display);font-size:13px;display:block;line-height:1.15;}
.loop .n small{font-size:10px;color:var(--faint);font-family:var(--mono);}
.loop .ar{font-family:var(--display);color:var(--gold);font-size:16px;}
.loopnote{text-align:center;font-size:12.5px;color:var(--faint);margin-top:9px;font-style:italic;}

/* ---------- prose blocks ---------- */
.prose p{margin:0 0 9px;font-size:14.5px;}
.prose p:last-child{margin-bottom:0;}
.prose b{color:var(--gold);font-weight:700;}
.prose ul{margin:6px 0 0;padding-left:19px;font-size:14.5px;}
.prose li{margin-bottom:5px;}
.prose li::marker{color:var(--star);}
.kv{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--star);font-weight:700;margin-bottom:3px;}

footer{border-top:2px solid var(--line);margin-top:30px;padding:18px 0 28px;
  color:var(--faint);font-size:12.5px;text-align:center;}
footer a{color:var(--dim);}
footer .inf{font-size:15px;color:var(--star);}
main{padding-top:12px;min-height:52vh;}
.count{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.06em;
  text-transform:uppercase;margin-bottom:9px;}

@media (max-width:420px){
  .logo{font-size:16px;} .card{padding:12px;} .slots{gap:6px;}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important;scroll-behavior:auto !important;}
}
</style>
</head>

<header>
  <div class="wrap">
    <div class="bar">
      <div class="logo"><span class="lm">&#8734;</span> COMBO <b>LAB</b></div>

      <div class="lang" role="group" aria-label="Language">
        <button id="l-en" aria-pressed="true">EN</button>

</header>

<main class="wrap" id="main"></main>

<footer class="wrap">

</footer>

     tags   what jobs this brawler does for a team. The Comp Doctor reads these.
              frontline heal shield stun pull knock slow zone wallbreak wallmake
              burst poke dive speed invis turret vision buff mobility antitank
     k      kit in one line

 f:{en:"Long range. Both she and the bear have to walk to you.",fr:"Les grandes portées. Elle et l'ours doivent venir à pied."}},

{id:"dynamike",en:"Dynamike",cls:"artillery",reach:55,tags:["zone","wallbreak","burst"],
 k:{en:"Two sticks of dynamite over walls. Super is a barrel that also jumps him out.",fr:"Deux bâtons de dynamite par-dessus les murs. Le Super est un baril qui le fait aussi sauter."},
 w:{en:"A wall to hide behind and someone forced to hold a spot.",fr:"Un mur derrière lequel se cacher et quelqu'un forcé de tenir une position."},
 f:{en:"Anyone who reaches him. He is made of paper.",fr:"Quiconque le rejoint. Il est en papier."}},

{id:"bo",en:"Bo",cls:"controller",reach:60,tags:["zone","vision","knock"],
 k:{en:"Three arrows. Super plants invisible mines that launch whoever steps on them.",fr:"Trois flèches. Le Super pose des mines invisibles qui projettent celui qui marche dessus."},
 w:{en:"Chokepoints. One mined corridor is a corridor nobody uses.",fr:"Les goulots. Un couloir miné est un couloir que personne n'emprunte."},
 f:{en:"Anyone who can see or trigger the mines from safety.",fr:"Ceux qui voient ou déclenchent les mines depuis un endroit sûr."}},

{id:"tick",en:"Tick",cls:"artillery",reach:58,tags:["zone","poke"],
 k:{en:"Mines that chase. Super throws his own head, which chases harder.",fr:"Des mines qui poursuivent. Le Super lance sa propre tête, qui poursuit encore plus."},
 w:{en:"A wall, and enemies who want a spot he can spam.",fr:"Un mur, et des ennemis qui veulent un endroit qu'il peut arroser."},
 f:{en:"Anything fast. Lowest health in the game, roughly.",fr:"Tout ce qui est rapide. Le moins de vie du jeu, à peu près."}},

{id:"8bit",en:"8-Bit",fr:"A.R.K.A.D.",cls:"damage",reach:65,tags:["turret","buff","poke"],
 k:{en:"Slow but heavy shots. Super plants a booster that raises the damage of every teammate near it.",fr:"Tirs lents mais lourds. Le Super plante un booster qui augmente les dégâts de chaque allié à proximité."},
 w:{en:"A defensive spot with a teammate who never has to move.",fr:"Un point défensif avec un allié qui n'a jamais besoin de bouger."},
 f:{en:"Throwers. He is enormous and slower than everyone.",fr:"Les lanceurs. Il est énorme et plus lent que tout le monde."}},

{id:"emz",en:"Emz",fr:"Eliz@",cls:"controller",reach:38,tags:["zone","slow"],
 k:{en:"Hairspray cone that lingers. Super is a bigger cloud that slows.",fr:"Cône de laque qui persiste. Le Super est un nuage plus large qui ralentit."},
 w:{en:"Narrow maps where her cloud covers the only route.",fr:"Les cartes étroites où son nuage couvre le seul passage."},
 f:{en:"Range. Her damage takes time and she has none against snipers.",fr:"La portée. Ses dégâts prennent du temps, et elle n'en a pas contre les snipers."}},

{id:"stu",en:"Stu",cls:"assassin",reach:35,tags:["dive","mobility"],
 k:{en:"Two shots charge a dash. Super is that dash, and it's off cooldown almost instantly.",fr:"Deux tirs chargent un dash. Le Super, c'est ce dash, et il revient presque instantanément."},
 w:{en:"Walls to bounce around and a backline to reach.",fr:"Des murs pour rebondir et une backline à atteindre."},
 f:{en:"Tanks who punish him the second he lands.",fr:"Les tanks qui le punissent dès qu'il atterrit."}},

{id:"elprimo",en:"El Primo",fr:"El Costo",cls:"tank",reach:10,tags:["frontline","dive","knock"],
 k:{en:"Fists. Super is an elbow drop from the sky that knocks people back.",fr:"Poings. Le Super est un coup de coude venu du ciel qui repousse."},
 w:{en:"Anything he can jump onto. Walls to jump over.",fr:"Tout ce sur quoi il peut sauter. Des murs à franchir."},
 f:{en:"Being kited. He has to touch you and everyone knows it.",fr:"Se faire promener. Il doit te toucher et tout le monde le sait."}},

{id:"barley",en:"Barley",fr:"Bartaba",cls:"artillery",reach:55,tags:["zone","poke"],
 k:{en:"Bottles that leave burning puddles. Super is six of them at once.",fr:"Bouteilles qui laissent des flaques enflammées. Le Super en envoie six d'un coup."},
 w:{en:"A wall to sit behind and a target that can't leave (a gem carrier, a safe, a zone).",fr:"Un mur pour se planquer et une cible qui ne peut pas partir (porteur de gemmes, coffre, zone)."},
 f:{en:"Assassins. Bottles are slow and he has nothing when someone arrives.",fr:"Les assassins. Les bouteilles sont lentes et il n'a rien quand quelqu'un arrive."}},

{id:"poco",en:"Poco",cls:"support",reach:34,tags:["heal","poke"],
 k:{en:"Wide sound wave that pierces. Super heals every teammate it touches.",fr:"Large onde sonore qui transperce. Le Super soigne chaque allié touché."},
 w:{en:"A tank in front of him to keep alive.",fr:"Un tank devant lui à maintenir en vie."},
 f:{en:"Burst damage that kills faster than he heals.",fr:"Les dégâts en burst qui tuent plus vite qu'il ne soigne."}},

{id:"rosa",en:"Rosa",cls:"tank",reach:22,tags:["frontline","shield"],
 k:{en:"Three punches. Super is a shield that cuts incoming damage hard.",fr:"Trois coups. Le Super est un bouclier qui réduit fortement les dégâts reçus."},
 w:{en:"Bushes. Her star power heals her in them.",fr:"Les buissons. Son pouvoir star la soigne dedans."},
 f:{en:"Being outranged while the shield ticks away.",fr:"Se faire distancer pendant que le bouclier s'écoule."}},

{id:"carl",en:"Carl",cls:"damage",reach:50,tags:["poke","mobility"],
 k:{en:"Pickaxe that flies out and comes back — he can't shoot again until it returns.",fr:"Pioche qui part et revient — il ne peut pas retirer avant qu'elle revienne."},
 w:{en:"Lining up so the pickaxe hits twice, going and coming.",fr:"Se placer pour que la pioche touche deux fois, à l'aller et au retour."},
 f:{en:"Anyone who dodges the return trip and punishes his empty hands.",fr:"Ceux qui esquivent le retour et le punissent les mains vides."}},

{id:"penny",en:"Penny",cls:"artillery",reach:58,tags:["turret","zone","poke"],
 k:{en:"Shot that splits behind the target. Super is a mortar that shells from far away.",fr:"Tir qui éclate derrière la cible. Le Super est un mortier qui pilonne de loin."},
 w:{en:"Enemies stacked in a line, and high ground for the mortar.",fr:"Des ennemis alignés, et une position haute pour le mortier."},
 f:{en:"Anyone who walks up and breaks the mortar.",fr:"Ceux qui montent et cassent le mortier."}},

{id:"darryl",en:"Darryl",cls:"tank",reach:25,tags:["frontline","dive"],
 k:{en:"Double shotgun. Super rolls him through walls into your face.",fr:"Double fusil. Le Super le fait rouler à travers les murs jusqu'à toi."},
 w:{en:"Tight maps where the roll always lands on someone.",fr:"Les cartes serrées où le roulé atterrit toujours sur quelqu'un."},
 f:{en:"Open maps. He rolls in and dies alone.",fr:"Les cartes ouvertes. Il roule et meurt tout seul."}},

{id:"jacky",en:"Jacky",cls:"tank",reach:15,tags:["frontline"],
 k:{en:"Drill that hits everything around her. Super pulls enemies toward her.",fr:"Marteau-piqueur qui touche tout autour d'elle. Le Super attire les ennemis vers elle."},
 w:{en:"Being surrounded. She's the only one who wants that.",fr:"Être encerclée. Elle est la seule à vouloir ça."},
 f:{en:"Distance. Any distance at all.",fr:"La distance. N'importe laquelle."}},

{id:"rico",en:"Rico",fr:"Ricochet",cls:"damage",reach:60,tags:["poke"],
 k:{en:"Bullets that bounce off walls and get stronger the further they travel.",fr:"Balles qui rebondissent sur les murs et deviennent plus fortes en voyageant."},
 w:{en:"Corridors. He shoots around corners you thought were safe.",fr:"Les couloirs. Il tire dans les coins que tu croyais sûrs."},
 f:{en:"Open maps with no walls to work with.",fr:"Les cartes ouvertes sans mur à exploiter."}},

{id:"piper",en:"Piper",fr:"Polly",cls:"marksman",reach:92,tags:["burst","poke","mobility"],
 k:{en:"More damage the further the shot travels. Super jumps her out and drops bombs.",fr:"Plus de dégâts plus le tir voyage loin. Le Super la fait sauter en lâchant des bombes."},
 w:{en:"The longest sightline on the map, and staying at the very end of it.",fr:"La plus longue ligne de vue de la carte, et rester tout au bout."},
 f:{en:"Anyone who closes the gap. Up close she does almost nothing.",fr:"Ceux qui comblent l'écart. De près, elle ne fait presque rien."}},

{id:"pam",en:"Pam",cls:"support",reach:60,tags:["heal","turret","poke"],
 k:{en:"Spray of scrap. Super drops a turret that heals every teammate near it.",fr:"Gerbe de ferraille. Le Super pose une tourelle qui soigne chaque allié autour."},
 w:{en:"A spot the team has to hold anyway — Heist, Hot Zone.",fr:"Un endroit que l'équipe doit tenir de toute façon — Braquage, Zone Réservée."},
 f:{en:"Throwers, who kill the turret and her from behind a wall.",fr:"Les lanceurs, qui tuent la tourelle et elle depuis derrière un mur."}},

{id:"frank",en:"Frank",cls:"tank",reach:30,tags:["frontline","stun","wallbreak"],
 k:{en:"Slow hammer with reach. Super smashes through walls and stuns everyone hit.",fr:"Marteau lent avec de l'allonge. Le Super traverse les murs et étourdit tout ce qu'il touche."},
 w:{en:"Teammates ready to fire the instant the stun lands.",fr:"Des alliés prêts à tirer à l'instant où l'étourdissement touche."},
 f:{en:"Being interrupted — his attack has a wind-up you can see coming.",fr:"Être interrompu — son attaque a un temps de charge visible."}},

{id:"bibi",en:"Bibi",fr:"Billie",cls:"tank",reach:20,tags:["frontline","knock","dive"],
 k:{en:"Bat that charges a home run. Super is a bubble that knocks people back.",fr:"Batte qui charge un home run. Le Super est une bulle qui repousse."},
 w:{en:"Waiting for the bat to charge, then hitting someone who can't leave.",fr:"Attendre que la batte charge, puis frapper quelqu'un qui ne peut pas partir."},
 f:{en:"Being poked while the bat is still charging.",fr:"Se faire harceler pendant que la batte charge."}},

{id:"bea",en:"Bea",fr:"Béa",cls:"marksman",reach:80,tags:["burst","poke"],
 k:{en:"Miss and you're weak. Hit and the next shot is enormous.",fr:"Rate et tu es faible. Touche et le tir suivant est énorme."},
 w:{en:"A first hit. Everything about her depends on landing it.",fr:"Un premier tir touché. Tout chez elle en dépend."},
 f:{en:"Divers who arrive between her two shots.",fr:"Les plongeurs qui arrivent entre ses deux tirs."}},

{id:"sprout",en:"Sprout",fr:"Wally",cls:"artillery",reach:55,tags:["zone","wallmake","poke"],
 k:{en:"Bouncing seed bomb. Super grows a wall wherever you want one.",fr:"Bombe-graine qui rebondit. Le Super fait pousser un mur où tu veux."},
 w:{en:"A moment where one wall changes everything — blocking a goal, cutting a lane, trapping one enemy alone.",fr:"Un moment où un mur change tout — bloquer un but, couper un couloir, isoler un ennemi."},
 f:{en:"Anyone who reaches it. Also its own wall, if you place it badly.",fr:"Quiconque l'atteint. Et son propre mur, si tu le places mal."}},

{id:"nani",en:"Nani",cls:"marksman",reach:78,tags:["burst","poke"],
 k:{en:"Three shots that fan out then converge. Super is a flying bot you steer into someone and detonate.",fr:"Trois tirs qui s'écartent puis convergent. Le Super est un robot volant qu'on pilote sur quelqu'un et qu'on fait exploser."},
 w:{en:"Enemies who don't know Peep is coming. Full damage needs all three shots at once.",fr:"Des ennemis qui ne voient pas Peep arriver. Les dégâts max exigent les trois tirs ensemble."},
 f:{en:"Anything close. She's a marksman with a manual bomb, not a defence.",fr:"Tout ce qui est proche. C'est une snipeuse avec une bombe télécommandée, pas une défense."}},

{id:"gale",en:"Gale",fr:"Gaël",cls:"controller",reach:55,tags:["knock","slow","wallmake"],
 k:{en:"Snow spread that slows. Super is a gust that shoves everyone backwards.",fr:"Gerbe de neige qui ralentit. Le Super est une bourrasque qui repousse tout le monde."},
 w:{en:"A hazard behind the enemy — a wall, a pit, your assassin.",fr:"Un danger derrière l'ennemi — un mur, un trou, ton assassin."},
 f:{en:"Being alone. The push is worth nothing if nobody follows it.",fr:"Être seul. La poussée ne vaut rien si personne ne suit."}},

{id:"surge",en:"Surge",cls:"damage",reach:40,tags:["dive","mobility"],
 k:{en:"Splitting shot. Every Super upgrades him — longer range, then a teleport, then more damage.",fr:"Tir qui se divise. Chaque Super l'améliore — plus de portée, puis un téléport, puis plus de dégâts."},
 w:{en:"An early kill. He's weak at stage 1 and frightening at stage 3.",fr:"Un kill précoce. Faible au niveau 1, terrifiant au niveau 3."},
 f:{en:"Dying. He resets to stage 1 and starts over.",fr:"Mourir. Il repart au niveau 1 et recommence."}},

{id:"colette",en:"Colette",cls:"damage",reach:55,tags:["poke","dive","antitank"],
 k:{en:"Damage based on a percentage of your health, not a flat number. Super is a charge that goes there and back.",fr:"Dégâts calculés en pourcentage de ta vie, pas un chiffre fixe. Le Super est une charge aller-retour."},
 w:{en:"Fat targets. The bigger the health bar, the more she takes.",fr:"Les grosses cibles. Plus la barre de vie est grande, plus elle en prend."},
 f:{en:"Low-health brawlers. Percentages of a small number are small.",fr:"Les brawlers à petite vie. Un pourcentage d'un petit nombre reste petit."}},

{id:"amber",en:"Amber",fr:"Ambre",cls:"damage",reach:42,tags:["zone","poke"],
 k:{en:"Continuous flamethrower running off a fuel tank. Super spills fire on the ground.",fr:"Lance-flammes continu alimenté par un réservoir. Le Super répand du feu au sol."},
 w:{en:"Corridors she can hose, and fuel drops to keep going.",fr:"Des couloirs à arroser, et des bidons pour tenir."},
 f:{en:"Running dry. An empty Amber is a free kill.",fr:"La panne sèche. Une Ambre vide est un kill gratuit."}},

{id:"lou",en:"Lou",cls:"controller",reach:50,tags:["slow","zone"],
 k:{en:"Ice that builds up — the colder they get, the slower they move, then they freeze.",fr:"Glace qui s'accumule — plus ils refroidissent, plus ils ralentissent, puis ils gèlent."},
 w:{en:"Time on target. His whole kit is a stack that needs seconds.",fr:"Du temps sur la cible. Tout son kit est un cumul qui demande des secondes."},
 f:{en:"Burst. He needs to be shooting you for a while.",fr:"Le burst. Il a besoin de te tirer dessus un moment."}},

{id:"byron",en:"Byron",cls:"support",reach:72,tags:["heal","poke"],
 k:{en:"One dart. It heals allies over time or poisons enemies over time. Super is the same, but bigger.",fr:"Une fléchette. Elle soigne les alliés dans la durée ou empoisonne les ennemis dans la durée."},
 w:{en:"A brawler worth keeping alive from very far away.",fr:"Un brawler qui mérite d'être maintenu en vie, depuis très loin."},
 f:{en:"Divers, and burst that kills before the heal ticks.",fr:"Les plongeurs, et le burst qui tue avant que le soin agisse."}},

{id:"edgar",en:"Edgar",cls:"assassin",reach:12,tags:["dive","mobility"],
 k:{en:"Punches that heal him. Super jumps over the wall onto your marksman.",fr:"Coups de poing qui le soignent. Le Super saute par-dessus le mur sur ton sniper."},
 w:{en:"A marksman standing alone at the back.",fr:"Un sniper seul à l'arrière."},
 f:{en:"A backline with a friend nearby. Landing on two people is landing on a grave.",fr:"Une backline avec un ami à côté. Atterrir sur deux personnes, c'est atterrir dans une tombe."}},

{id:"griff",en:"Griff",cls:"damage",reach:45,tags:["burst"],
 k:{en:"Three rows of coins. All three hit at point blank — that's a huge number.",fr:"Trois rangées de pièces. Les trois touchent à bout portant — ça fait un très gros chiffre."},
 w:{en:"Enemies who walk into his face.",fr:"Des ennemis qui lui rentrent dedans."},
 f:{en:"Distance, where only one row connects.",fr:"La distance, où une seule rangée touche."}},

{id:"squeak",en:"Squeak",cls:"artillery",reach:52,tags:["zone","poke"],
 k:{en:"Sticky blob that lands, waits, then bursts into fragments.",fr:"Boule collante qui atterrit, attend, puis éclate en fragments."},
 w:{en:"Sticking it on a wall or a target that has to stay near it.",fr:"La coller sur un mur ou sur une cible obligée de rester à côté."},
 f:{en:"Movement. The delay gives everyone a free second to leave.",fr:"Le mouvement. Le délai offre à tous une seconde pour partir."}},

{id:"belle",en:"Belle",cls:"marksman",reach:82,tags:["poke","vision"],
 k:{en:"Shot that chains between enemies. Super marks one enemy so everything hurts them more.",fr:"Tir qui s'enchaîne entre ennemis. Le Super marque un ennemi : tout lui fait plus mal."},
 w:{en:"Enemies who stand near each other.",fr:"Des ennemis qui se tiennent proches."},
 f:{en:"Divers. Marking someone doesn't stop them arriving.",fr:"Les plongeurs. Marquer quelqu'un ne l'empêche pas d'arriver."}},

{id:"buzz",en:"Buzz",cls:"assassin",reach:18,tags:["dive","stun"],
 k:{en:"Buoy that pulls him to whatever it hits, then stuns it.",fr:"Bouée qui l'attire sur ce qu'elle touche, puis l'étourdit."},
 w:{en:"Bushes to charge his Super in, and a target near a wall.",fr:"Des buissons pour charger son Super, et une cible près d'un mur."},
 f:{en:"Open ground where you see the buoy coming.",fr:"Le terrain découvert où l'on voit la bouée arriver."}},

{id:"ash",en:"Ash",cls:"tank",reach:22,tags:["frontline"],
 k:{en:"Broom. He gets angrier — and faster — the more damage he takes.",fr:"Balai. Il s'énerve — et accélère — plus il prend de dégâts."},
 w:{en:"A long fight. He is at his best when he's nearly dead.",fr:"Un combat long. Il est à son meilleur quand il est presque mort."},
 f:{en:"Being deleted before the rage builds.",fr:"Se faire effacer avant que la rage monte."}},

{id:"lola",en:"Lola",cls:"damage",reach:55,tags:["poke","turret"],
 k:{en:"Shots that spread. Super leaves a scarf-double that shoots on its own.",fr:"Tirs qui s'écartent. Le Super laisse un double en écharpe qui tire tout seul."},
 w:{en:"Crossfire — she and the double shooting from two angles.",fr:"Le feu croisé — elle et le double tirant de deux angles."},
 f:{en:"Anyone who kills her while she's fussing with the double.",fr:"Ceux qui la tuent pendant qu'elle s'occupe du double."}},

{id:"fang",en:"Fang",cls:"assassin",reach:20,tags:["dive","frontline"],
 k:{en:"Flying kick. His Super chains — a kill refunds it, so he can keep going.",fr:"Coup de pied volant. Son Super s'enchaîne — un kill le rembourse, donc il continue."},
 w:{en:"A grouped-up team he can chain kills through.",fr:"Une équipe regroupée dans laquelle enchaîner les kills."},
 f:{en:"Being kited by one person on an open map. The chain never starts.",fr:"Se faire promener par un seul joueur en terrain ouvert. La chaîne ne démarre jamais."}},

{id:"eve",en:"Eve",cls:"damage",reach:58,tags:["turret","poke"],
 k:{en:"Shots that grow with distance. Super hatches babies that chase people.",fr:"Tirs qui grossissent avec la distance. Le Super fait éclore des bébés qui poursuivent."},
 w:{en:"Water she can walk over that nobody else can.",fr:"De l'eau qu'elle peut traverser et personne d'autre."},
 f:{en:"Anything that reaches her — the babies won't save her.",fr:"Tout ce qui l'atteint — les bébés ne la sauveront pas."}},

{id:"janet",en:"Janet",cls:"marksman",reach:70,tags:["poke","mobility"],
 k:{en:"Cone that's tight at range, wide up close. Super flies her up and bombs from above.",fr:"Cône serré à distance, large de près. Le Super la fait décoller pour bombarder d'en haut."},
 w:{en:"Height. From the air she sees and hits things nobody can answer.",fr:"L'altitude. Depuis les airs, elle voit et frappe sans réponse possible."},
 f:{en:"Landing. She comes down eventually, and everyone knows where.",fr:"L'atterrissage. Elle redescend un jour, et tout le monde sait où."}},

{id:"bonnie",en:"Bonnie",cls:"damage",reach:70,tags:["knock","dive","burst"],
 k:{en:"Two brawlers in one: a long-range cannon, and Super fires herself out to fight up close.",fr:"Deux brawlers en un : un canon longue portée, et le Super la propulse au corps à corps."},
 w:{en:"Switching at the right moment — cannon to poke, out to punish.",fr:"Changer au bon moment — canon pour harceler, sortie pour punir."},
 f:{en:"Being caught in the wrong form.",fr:"Se faire attraper dans la mauvaise forme."}},

{id:"sam",en:"Sam",cls:"assassin",reach:18,tags:["dive","frontline"],
 k:{en:"Throws his knuckle busters and pulls himself back to them, damaging everything in the line.",fr:"Lance ses poings américains et se tire vers eux, blessant tout sur la ligne."},
 w:{en:"Enemies between him and his gloves.",fr:"Des ennemis entre lui et ses gants."},
 f:{en:"Being separated from the gloves. Bare-handed Sam is weak.",fr:"Être séparé des gants. Sam à mains nues est faible."}},

{id:"gus",en:"Gus",cls:"support",reach:48,tags:["shield","heal"],
 k:{en:"Ghost shots. Super gives a teammate a shield that absorbs damage before their health does.",fr:"Tirs fantômes. Le Super donne à un allié un bouclier qui absorbe avant sa vie."},
 w:{en:"A tank about to dive. Shield first, then they go.",fr:"Un tank sur le point de plonger. Bouclier d'abord, puis il y va."},
 f:{en:"Nobody to shield. Alone he does very little.",fr:"Personne à protéger. Seul, il ne fait pas grand-chose."}},

{id:"buster",en:"Buster",cls:"tank",reach:30,tags:["frontline","shield","pull"],
 k:{en:"Beam of light. Super pulls teammates behind him and blocks shots for them.",fr:"Rayon de lumière. Le Super attire les alliés derrière lui et bloque les tirs pour eux."},
 w:{en:"Teammates who need to survive a push — or need rescuing from one.",fr:"Des alliés qui doivent survivre à une poussée — ou être sortis d'une."},
 f:{en:"Damage that goes around him instead of through him.",fr:"Les dégâts qui le contournent au lieu de le traverser."}},

{id:"chester",en:"Chester",cls:"damage",reach:35,tags:["poke","stun"],
 k:{en:"Alternating shots. His Super is random every time — stun, poison, a big hit, a bounce.",fr:"Tirs alternés. Son Super est aléatoire à chaque fois — étourdissement, poison, gros coup, rebond."},
 w:{en:"Knowing which Super is loaded before you commit. It's shown — look.",fr:"Savoir quel Super est chargé avant de s'engager. C'est affiché — regarde."},
 f:{en:"Needing a specific answer. He can't choose.",fr:"Avoir besoin d'une réponse précise. Il ne choisit pas."}},

{id:"gray",en:"Gray",cls:"support",reach:60,tags:["poke","mobility"],
 k:{en:"Cane shots. Super places two portals — anyone on the team can walk between them.",fr:"Tirs de canne. Le Super place deux portails — toute l'équipe peut passer entre les deux."},
 w:{en:"A wall the enemy trusts. Portals make it meaningless.",fr:"Un mur en qui l'ennemi a confiance. Les portails le rendent inutile."},
 f:{en:"Portals that work both ways. They can walk through too.",fr:"Les portails marchent dans les deux sens. Eux aussi peuvent passer."}},

{id:"mandy",en:"Mandy",cls:"marksman",reach:88,tags:["poke","burst"],
 k:{en:"Stand still and her shot becomes a beam that goes almost the whole map and pierces.",fr:"Reste immobile et son tir devient un rayon qui traverse presque la carte et transperce."},
 w:{en:"A lane. Standing still is the cost and the whole point.",fr:"Un couloir. Rester immobile est le prix et tout l'intérêt."},
 f:{en:"Anything that makes her move.",fr:"Tout ce qui la force à bouger."}},

{id:"rt",en:"R-T",cls:"damage",reach:55,tags:["poke","vision"],
 k:{en:"Splits into two halves that shoot from different places. Marked enemies take more.",fr:"Se divise en deux moitiés qui tirent de deux endroits. Les ennemis marqués prennent plus."},
 w:{en:"Crossfire angles nobody can stand between.",fr:"Des angles croisés entre lesquels personne ne peut tenir."},
 f:{en:"Being split when the fight starts. Half of him is half a brawler.",fr:"Être divisé quand le combat démarre. La moitié de lui est un demi-brawler."}},

{id:"willow",en:"Willow",cls:"controller",reach:60,tags:["zone","poke"],
 k:{en:"Cursed brew. Super takes control of an enemy for a few seconds — you drive them.",fr:"Potion maudite. Le Super prend le contrôle d'un ennemi quelques secondes — tu le pilotes."},
 w:{en:"Walking a stolen enemy into their own team's fire, or into a pit.",fr:"Emmener l'ennemi volé sous les tirs de son équipe, ou dans un trou."},
 f:{en:"Doing nothing with the control. Three seconds go fast.",fr:"Ne rien faire du contrôle. Trois secondes, ça passe vite."}},

{id:"doug",en:"Doug",cls:"support",reach:25,tags:["heal","frontline"],
 k:{en:"Hot dog that heals allies it passes through. Super revives a dead teammate once.",fr:"Hot-dog qui soigne les alliés traversés. Le Super ressuscite un allié mort une fois."},
 w:{en:"Standing where a teammate is about to die.",fr:"Être là où un allié va mourir."},
 f:{en:"Being the one who dies. Nobody revives Doug.",fr:"Être celui qui meurt. Personne ne ressuscite Doug."}},

{id:"charlie",en:"Charlie",cls:"controller",reach:55,tags:["stun","zone"],
 k:{en:"Web that builds up. Super wraps one enemy in a cocoon — they can't move or shoot.",fr:"Toile qui s'accumule. Le Super enferme un ennemi dans un cocon — il ne peut ni bouger ni tirer."},
 w:{en:"Teammates who kill the cocoon before it opens.",fr:"Des alliés qui tuent le cocon avant qu'il s'ouvre."},
 f:{en:"Cocooning someone nobody can reach. It's a free escape for them.",fr:"Encoconner quelqu'un que personne n'atteint. C'est une évasion gratuite."}},

{id:"mico",en:"Mico",cls:"assassin",reach:15,tags:["dive","mobility"],
 k:{en:"Jumps over walls constantly. His Super is a big jump onto whoever he lands on.",fr:"Saute par-dessus les murs en permanence. Son Super est un grand saut sur qui il atterrit."},
 w:{en:"Walls everywhere. He's the fastest thing on a maze map.",fr:"Des murs partout. Il est la chose la plus rapide sur une carte-labyrinthe."},
 f:{en:"Open maps. He lands and there's nowhere to hop to.",fr:"Les cartes ouvertes. Il atterrit et n'a nulle part où sauter."}},

{id:"kit",en:"Kit",cls:"support",reach:25,tags:["heal","stun","mobility"],
 k:{en:"Rides on a teammate's back, healing them. Super pounces onto an enemy and pins them.",fr:"Monte sur le dos d'un allié en le soignant. Le Super bondit sur un ennemi et le cloue."},
 w:{en:"A tank to ride. Kit is a passenger who turns one brawler into one-and-a-half.",fr:"Un tank à chevaucher. Kit est un passager qui transforme un brawler en un et demi."},
 f:{en:"Having no ride. Alone, Kit is a very small cat.",fr:"Ne pas avoir de monture. Seul, Kit est un tout petit chat."}},

{id:"larry",en:"Larry & Lawrie",cls:"artillery",reach:58,tags:["zone","turret","poke"],
 k:{en:"Throws bombs from behind cover. Super calls in Lawrie, who hunts on his own.",fr:"Lance des bombes depuis un abri. Le Super appelle Lawrie, qui chasse tout seul."},
 w:{en:"A wall, and Lawrie applying pressure somewhere else.",fr:"Un mur, et Lawrie qui met la pression ailleurs."},
 f:{en:"Assassins, like every thrower.",fr:"Les assassins, comme tous les lanceurs."}},

{id:"angelo",en:"Angelo",cls:"marksman",reach:88,tags:["poke","slow"],
 k:{en:"Charged arrow that poisons. Super is a slick of poison on the ground.",fr:"Flèche chargée qui empoisonne. Le Super est une nappe de poison au sol."},
 w:{en:"Water — he crosses it — and long lanes to hold.",fr:"L'eau — il la traverse — et de longs couloirs à tenir."},
 f:{en:"Anything fast. Charging takes time he doesn't have up close.",fr:"Tout ce qui est rapide. Charger prend un temps qu'il n'a pas de près."}},

{id:"melodie",en:"Melodie",cls:"assassin",reach:30,tags:["dive","mobility"],
 k:{en:"Music notes orbit her. Super gives her three dashes she can spend in any direction.",fr:"Des notes gravitent autour d'elle. Le Super lui donne trois dashs dans toutes les directions."},
 w:{en:"Notes stacked before she commits. Dashing in empty-handed is just dying closer.",fr:"Des notes accumulées avant de s'engager. Dasher les mains vides, c'est mourir plus près."},
 f:{en:"Being caught with no notes and no dashes left.",fr:"Se faire attraper sans note et sans dash."}},

{id:"lily",en:"Lily",cls:"assassin",reach:15,tags:["dive","invis","mobility"],
 k:{en:"Slips into the shadow dimension — untouchable — then reappears next to you.",fr:"File dans la dimension d'ombre — intouchable — puis réapparaît à côté de toi."},
 w:{en:"A target who forgot she exists.",fr:"Une cible qui a oublié qu'elle existe."},
 f:{en:"Coming out of the shadows into three people.",fr:"Sortir de l'ombre au milieu de trois personnes."}},

{id:"berry",en:"Berry",cls:"support",reach:40,tags:["heal","zone"],
 k:{en:"Ice cream that heals allies on the way and pools on the ground.",fr:"Glace qui soigne les alliés au passage et forme une flaque au sol."},
 w:{en:"A spot to sit and a teammate to top up.",fr:"Un endroit où rester et un allié à remplir."},
 f:{en:"Pressure. He heals well and defends himself badly.",fr:"La pression. Il soigne bien et se défend mal."}},

{id:"clancy",en:"Clancy",cls:"damage",reach:52,tags:["poke","burst"],
 k:{en:"Levels up mid-match by hitting things. Stage 3 is a different, much scarier brawler.",fr:"Monte de niveau en cours de partie en touchant. Le niveau 3 est un brawler bien plus effrayant."},
 w:{en:"Free hits early. He needs to farm the ramp.",fr:"Des touches gratuites au début. Il doit farmer sa montée."},
 f:{en:"Being shut down at stage 1 and never getting going.",fr:"Être bloqué au niveau 1 et ne jamais démarrer."}},

{id:"moe",en:"Moe",cls:"damage",reach:30,tags:["mobility","poke"],
 k:{en:"Rocks. Super gives him a drill he rides around at speed, ramming people.",fr:"Cailloux. Le Super lui donne une foreuse qu'il chevauche à toute vitesse pour percuter."},
 w:{en:"Room to drive and someone who can't get away.",fr:"De la place pour rouler et quelqu'un qui ne peut pas fuir."},
 f:{en:"Being on foot with the drill on cooldown.",fr:"Être à pied avec la foreuse en recharge."}},

{id:"kenji",en:"Kenji",cls:"assassin",reach:25,tags:["dive","mobility"],
 k:{en:"Slash. Super dashes and, timed right, parries the shot that would have killed him.",fr:"Coup de sabre. Le Super dash et, bien timé, pare le tir qui l'aurait tué."},
 w:{en:"Reading the enemy's shot. The parry is a skill, not a button.",fr:"Lire le tir de l'ennemi. La parade est une compétence, pas un bouton."},
 f:{en:"Short range and modest damage — he has to be right, not just fast.",fr:"Portée courte et dégâts modestes — il doit avoir raison, pas juste être rapide."}},

{id:"shade",en:"Shade",cls:"assassin",reach:20,tags:["dive","invis"],
 k:{en:"A ghost who goes through walls and turns invisible.",fr:"Un fantôme qui traverse les murs et devient invisible."},
 w:{en:"Walls nobody watches.",fr:"Des murs que personne ne surveille."},
 f:{en:"Being seen. Once you know where he is, he's a squishy melee brawler.",fr:"Être vu. Une fois qu'on sait où il est, c'est un fragile au corps à corps."}},

{id:"juju",en:"Juju",cls:"controller",reach:55,tags:["zone","poke"],
 k:{en:"Her attack changes with the ground she stands on — grass, water, or dirt.",fr:"Son attaque change selon le sol où elle se tient — herbe, eau, ou terre."},
 w:{en:"Knowing which terrain gives which attack, and standing on the right one.",fr:"Savoir quel terrain donne quelle attaque, et se placer sur le bon."},
 f:{en:"Being forced onto the wrong ground.",fr:"Être forcée sur le mauvais sol."}},

{id:"tara",en:"Tara",cls:"damage",reach:50,tags:["pull","poke"],
 k:{en:"Three piercing cards. Super is a black hole that drags everyone nearby into one spot.",fr:"Trois cartes perforantes. Le Super est un trou noir qui traîne tout le monde au même endroit."},
 w:{en:"Teammates with area damage. She gift-wraps three enemies in one place.",fr:"Des alliés avec des dégâts de zone. Elle emballe trois ennemis au même endroit."},
 f:{en:"Pulling with nobody to follow up. Now they're all next to her.",fr:"Aspirer sans personne pour suivre. Maintenant ils sont tous à côté d'elle."}},

{id:"gene",en:"Gene",fr:"D'jinn",cls:"support",reach:62,tags:["pull","heal","poke"],
 k:{en:"Splitting shot. Super is a magic hand that grabs one enemy and yanks them to him.",fr:"Tir qui se divise. Le Super est une main magique qui attrape un ennemi et le tire vers lui."},
 w:{en:"A teammate ready to punish the landing.",fr:"Un allié prêt à punir l'atterrissage."},
 f:{en:"Pulling the wrong person — a tank you just teleported into your backline.",fr:"Aspirer la mauvaise personne — un tank que tu viens de téléporter dans ta backline."}},

{id:"max",en:"Max",cls:"support",reach:58,tags:["speed","mobility","poke"],
 k:{en:"Fast burst of shots. Super speeds up her whole team for a few seconds.",fr:"Rafale rapide. Le Super accélère toute son équipe pendant quelques secondes."},
 w:{en:"A moment where being faster wins it — a goal, a gem grab, an escape.",fr:"Un moment où la vitesse décide — un but, une gemme, une fuite."},
 f:{en:"Using the speed boost with nobody near her.",fr:"Utiliser le boost sans personne à côté."}},

{id:"sandy",en:"Sandy",fr:"Émeri",cls:"controller",reach:42,tags:["invis","zone","slow"],
 k:{en:"Sand shots. Super is a storm that turns the whole team invisible inside it.",fr:"Tirs de sable. Le Super est une tempête qui rend toute l'équipe invisible dedans."},
 w:{en:"A push the enemy can't aim at. Invisibility is not safety — it's confusion.",fr:"Une poussée que l'ennemi ne peut pas viser. L'invisibilité n'est pas la sécurité — c'est la confusion."},
 f:{en:"Enemies who just shoot into the storm anyway.",fr:"Les ennemis qui tirent quand même dans la tempête."}},

{id:"spike",en:"Spike",cls:"damage",reach:55,tags:["zone","slow","poke"],
 k:{en:"Cactus grenade that bursts into spikes. Super is a field that slows and shreds.",fr:"Grenade-cactus qui éclate en épines. Le Super est un champ qui ralentit et déchire."},
 w:{en:"Enemies who can't leave the field — pinned, cornered, or greedy.",fr:"Des ennemis qui ne peuvent pas quitter le champ — bloqués, coincés, ou trop gourmands."},
 f:{en:"Anyone who reaches him. Tiny health.",fr:"Quiconque l'atteint. Très peu de vie."}},

{id:"crow",en:"Crow",fr:"Corbac",cls:"assassin",reach:40,tags:["dive","poke"],
 k:{en:"Poison daggers that stop healing. Super jumps him in and out.",fr:"Dagues empoisonnées qui bloquent les soins. Le Super le fait entrer et sortir."},
 w:{en:"Enemies with a healer — his poison turns that healer off.",fr:"Des ennemis avec un soigneur — son poison éteint ce soigneur."},
 f:{en:"Anything with real health. His damage is small and slow.",fr:"Tout ce qui a de la vraie vie. Ses dégâts sont petits et lents."}},

{id:"leon",en:"Leon",fr:"Léon",cls:"assassin",reach:30,tags:["dive","invis"],
 k:{en:"Spinners that hurt more up close. Super turns him invisible.",fr:"Lames rotatives qui font plus mal de près. Le Super le rend invisible."},
 w:{en:"An isolated target and a clear line to it.",fr:"Une cible isolée et une ligne dégagée jusqu'à elle."},
 f:{en:"Anything that reveals him — a thrower's puddle, Bo's vision, a good guess.",fr:"Tout ce qui le révèle — la flaque d'un lanceur, la vision de Bo, une bonne intuition."}},

{id:"mortis",en:"Mortis",cls:"assassin",reach:15,tags:["dive","mobility"],
 k:{en:"Dashes forward with every swing. He can only move in dashes — he has no normal attack.",fr:"Dash à chaque coup. Il ne se déplace qu'en dashs — il n'a pas d'attaque normale."},
 w:{en:"Kills to refill the bar. A fed Mortis never stops.",fr:"Des kills pour remplir la barre. Un Mortis nourri ne s'arrête jamais."},
 f:{en:"Shotguns and tanks. Dashing into Shelly is suicide.",fr:"Les fusils à pompe et les tanks. Dasher sur Shelly, c'est du suicide."}},

{id:"grom",en:"Grom",cls:"artillery",reach:65,tags:["zone","poke","burst"],
 k:{en:"A cross-shaped blast at a fixed distance. Super is a bigger one you steer.",fr:"Explosion en croix à distance fixe. Le Super est une version plus grosse que l'on dirige."},
 w:{en:"Standing behind a wall and hitting a fixed point over and over.",fr:"Rester derrière un mur et frapper un point fixe encore et encore."},
 f:{en:"Anyone inside his minimum range. He literally cannot hit them.",fr:"Ceux qui entrent sous sa portée minimale. Il ne peut littéralement pas les toucher."}},

{id:"hank",en:"Hank",cls:"tank",reach:40,tags:["frontline","burst"],
 k:{en:"Charge a bubble — the longer you hold, the bigger and further it goes.",fr:"Charge une bulle — plus tu tiens, plus elle est grosse et va loin."},
 w:{en:"Time to charge. A full Hank bubble is a huge number.",fr:"Du temps pour charger. Une bulle pleine, c'est un chiffre énorme."},
 f:{en:"Being rushed. A half-charged bubble is a tickle.",fr:"Se faire rusher. Une bulle à moitié chargée, c'est une chatouille."}},

{id:"maisie",en:"Maisie",cls:"damage",reach:60,tags:["knock","poke"],
 k:{en:"Shot that travels and bursts at the end. Super knocks enemies away and stuns briefly.",fr:"Tir qui voyage et éclate au bout. Le Super repousse les ennemis et étourdit brièvement."},
 w:{en:"Tanks trying to walk at her — she pushes them straight back out.",fr:"Des tanks qui essaient de l'approcher — elle les repousse d'où ils viennent."},
 f:{en:"Getting the distance wrong. Her shot has a sweet spot.",fr:"Se tromper de distance. Son tir a un point idéal."}},

{id:"pearl",en:"Pearl",cls:"damage",reach:45,tags:["zone","poke"],
 k:{en:"Cookies that heat her up — the hotter she gets, the more damage, until she overheats.",fr:"Des cookies qui la chauffent — plus elle chauffe, plus elle frappe, jusqu'à la surchauffe."},
 w:{en:"A sustained fight she can heat up through.",fr:"Un combat long pendant lequel elle monte en température."},
 f:{en:"Overheating at the wrong moment.",fr:"Surchauffer au mauvais moment."}},

{id:"cordelius",en:"Cordelius",cls:"assassin",reach:35,tags:["dive","mobility"],
 k:{en:"Super drags one enemy into a private dimension — 1v1, nobody can help either of you.",fr:"Le Super entraîne un ennemi dans une dimension privée — 1v1, personne ne peut aider."},
 w:{en:"Taking the one enemy who was carrying the team, alone, where their friends can't reach.",fr:"Isoler celui qui portait l'équipe, seul, là où ses amis n'arrivent pas."},
 f:{en:"Picking a fight he loses. In there, nobody helps him either.",fr:"Choisir un duel qu'il perd. Là-dedans, personne ne l'aide non plus."}},

{id:"otis",en:"Otis",cls:"controller",reach:60,tags:["zone","poke"],
 k:{en:"Ink that pierces. Super silences an enemy — no attacks, no Super, nothing.",fr:"Encre perforante. Le Super rend un ennemi muet — plus d'attaque, plus de Super, rien."},
 w:{en:"Silencing the one brawler whose Super would have won the fight.",fr:"Museler le brawler dont le Super aurait gagné le combat."},
 f:{en:"Silencing someone who was going to lose anyway.",fr:"Museler quelqu'un qui allait perdre de toute façon."}},

{id:"meg",en:"Meg",cls:"tank",reach:50,tags:["frontline","burst"],
 k:{en:"Small and weak — until her Super builds a mech and she becomes a monster.",fr:"Petite et faible — jusqu'à ce que son Super construise un méca et qu'elle devienne un monstre."},
 w:{en:"Reaching the mech. Out of it she's a stalling problem.",fr:"Atteindre le méca. Hors du méca, c'est un problème à faire durer."},
 f:{en:"Losing the mech early with no way to rebuild it.",fr:"Perdre le méca tôt sans moyen de le reconstruire."}},

{id:"chuck",en:"Chuck",cls:"damage",reach:30,tags:["mobility","zone"],
 k:{en:"Plants posts and rides between them at speed, hitting everything on the rail.",fr:"Plante des poteaux et roule entre eux à toute vitesse, touchant tout sur le rail."},
 w:{en:"Posts placed before the fight, not during it.",fr:"Des poteaux plantés avant le combat, pas pendant."},
 f:{en:"Posts in stupid places. Then he's a slow brawler with a train ticket to nowhere.",fr:"Des poteaux mal placés. Là, c'est un brawler lent avec un billet pour nulle part."}},

{id:"ruffs",en:"Colonel Ruffs",fr:"Colonel Médor",cls:"support",reach:60,tags:["buff","poke"],
 k:{en:"Bouncing laser. Super drops power-ups that permanently buff whoever picks them up.",fr:"Laser rebondissant. Le Super largue des bonus qui améliorent définitivement celui qui les ramasse."},
 w:{en:"Teammates who actually walk over to collect them.",fr:"Des alliés qui vont vraiment les ramasser."},
 f:{en:"Dropping buffs where nobody dares go.",fr:"Larguer des bonus là où personne n'ose aller."}},

{id:"damian",en:"Damian",cls:"tank",reach:16,tags:["frontline","knock","burst","zone"],
 k:{en:"Two punches charge a third — an explosive kick that knocks back, burns, and chain-explodes to anyone nearby. Charges his Super from damage he TAKES.",fr:"Deux coups de poing en chargent un troisième — un coup de pied explosif qui repousse, brûle et explose en chaîne sur tous ceux qui sont autour. Charge son Super avec les dégâts qu'il ENCAISSE."},
 w:{en:"Enemies bunched up, and people shooting him. Both feed him.",fr:"Des ennemis groupés, et des gens qui lui tirent dessus. Les deux le nourrissent."},
 f:{en:"Anyone who keeps their distance and never lets him land punch number two.",fr:"Ceux qui gardent leurs distances et ne le laissent jamais placer le deuxième poing."}},

{id:"starrnova",en:"Starr Nova",cls:"assassin",reach:52,tags:["dive","mobility","burst"],
 k:{en:"Fires two piercing sparkles — the fastest projectiles in the game. Super dashes forward and transforms her for ~7 seconds: sword, faster, heals a little on hit.",fr:"Tire deux étincelles perforantes — les projectiles les plus rapides du jeu. Son Super fonce et la transforme ~7 secondes : épée, plus rapide, se soigne un peu en touchant."},
 w:{en:"A fight already in progress. She cleans up; she doesn't open.",fr:"Un combat déjà commencé. Elle nettoie ; elle n'ouvre pas."},
 f:{en:"Diving first. Her healing is far weaker than Edgar's or Mortis's — she melts.",fr:"Plonger en premier. Ses soins sont bien plus faibles que ceux d'Edgar ou Mortis — elle fond."}},

{id:"bolt",en:"Bolt",cls:"tank",reach:16,tags:["frontline","mobility","speed"],
 k:{en:"Gets faster the longer he drives in a straight line. Every turn resets it. Charges his Super just by moving.",fr:"Accélère tant qu'il roule en ligne droite. Chaque virage remet le compteur à zéro. Charge son Super rien qu'en se déplaçant."},
 w:{en:"Long open lanes. Plan the route before you move.",fr:"De longs couloirs ouverts. Planifie le trajet avant de bouger."},
 f:{en:"Mazes and tight corners. Stop-start movement makes him a worse tank.",fr:"Les labyrinthes et les coins serrés. Le stop-and-go en fait un tank médiocre."}},

{id:"sirius",en:"Sirius",cls:"controller",reach:78,tags:["turret","zone","poke","slow"],
 k:{en:"Fires two projectiles at once: a straight Shadow Strike and a Starr Bomb that lobs over walls. Every 4th hit steals that brawler's Shadow. Super summons your stored Shadows as weaker clones — and re-aiming the Super steers them.",fr:"Tire deux projectiles à la fois : une Frappe d'ombre en ligne droite et une Starr Bomb qui passe par-dessus les murs. Chaque 4e coup vole l'Ombre du brawler touché. Le Super invoque tes Ombres stockées en clones plus faibles — et viser à nouveau les dirige."},
 w:{en:"A tank to farm Shadows from behind, and long fights. Save up 3 before you summon.",fr:"Un tank derrière lequel farmer les Ombres, et des combats longs. Stocke-en 3 avant d'invoquer."},
 f:{en:"Splash damage — Nita, Tara, Emz, Penny wipe every Shadow at once. He's weak alone: low damage, thin HP.",fr:"Les dégâts de zone — Nita, Tara, Emz, Penny effacent toutes les Ombres d'un coup. Il est faible seul : peu de dégâts, peu de PV."}},

{id:"najia",en:"Najia",cls:"artillery",reach:68,tags:["zone","poke"],
 k:{en:"Throws a jar she can still steer after releasing. It breaks, a snake pops out, hunts the nearest enemy and poisons it. Poison stacks. Super throws three exploding paper snakes.",fr:"Lance une jarre qu'elle peut encore diriger après le tir. Elle se brise, un serpent en sort, chasse l'ennemi le plus proche et l'empoisonne. Le poison se cumule. Son Super lance trois serpents de papier explosifs."},
 w:{en:"Grouped enemies — every extra snake is another poison stack.",fr:"Des ennemis groupés — chaque serpent en plus est un cumul de poison supplémentaire."},
 f:{en:"Anything that closes the gap. She's a thrower: no wall, no Najia.",fr:"Tout ce qui comble la distance. C'est une lanceuse : pas de mur, pas de Najia."}}
];
/* ============================================================================
   COMBOS

   Every entry answers four questions, in this order:
     mech  what physically happens
     win   why that solves a problem
     run   the order and the timing
     dont  when it's a trap

   "dont" is the field nobody writes and the one that makes you better.

   parts  brawler ids from BRAWLERS. 2 or 3.
   modes  gemgrab brawlball heist bounty knockout hotzone showdown
   diff   0 easy · 1 medium · 2 hard
   ========================================================================== */

var COMBOS = [
{id:"pullpuddle",parts:["gene","barley"],diff:1,modes:["gemgrab","hotzone","brawlball"],
 n:{en:"Pull into the puddle",fr:"Aspiration dans la flaque"},
 why:{en:"The oldest trick in the game and still the cleanest. A pull is only worth it if the landing spot hurts.",fr:"Le plus vieux tour du jeu, et toujours le plus propre. Une aspiration ne vaut le coup que si l'atterrissage fait mal."},
 mech:{en:"Gene's hand yanks one enemy across the map to him. Barley has already covered that ground in fire. The enemy lands inside it, at close range, away from their team.",fr:"La main de D'jinn arrache un ennemi à travers la carte. Bartaba a déjà couvert le sol de feu. L'ennemi atterrit dedans, au corps à corps, loin de son équipe."},
 win:{en:"You didn't just damage someone — you moved them. They're now alone, burning, and their two teammates are somewhere else with a hole in their formation. Most fights are won by making it 3v2 for four seconds.",fr:"Tu ne l'as pas juste blessé — tu l'as déplacé. Il est seul, il brûle, et ses deux alliés sont ailleurs avec un trou dans leur formation. La plupart des combats se gagnent en créant un 3v2 pendant quatre secondes."},
 run:{en:"Barley throws FIRST. Puddle on the ground, then Gene pulls. Doing it the other way round gives the enemy a free second to walk out. Works the same with Dynamike, Tick, Sprout, Spike, Willow — any teammate who owns a patch of ground.",fr:"Bartaba lance EN PREMIER. La flaque au sol, puis D'jinn aspire. Dans l'autre sens, tu offres une seconde pour sortir. Marche pareil avec Dynamike, Tick, Wally, Spike, Willow — tout allié qui possède un bout de terrain."},
 dont:{en:"Never pull a tank. You just teleported El Primo into your backline for free, and he's delighted. Pull the marksman, the thrower, the healer — the ones who die to a puddle.",fr:"N'aspire jamais un tank. Tu viens de téléporter El Costo gratuitement dans ta backline, et il est ravi. Aspire le sniper, le lanceur, le soigneur — ceux qui meurent dans une flaque."}},

{id:"blackholespike",parts:["tara","spike"],diff:1,modes:["gemgrab","hotzone","knockout"],
 n:{en:"Black hole, then spikes",fr:"Trou noir, puis épines"},
 why:{en:"Tara doesn't move one enemy. She stacks all three of them into a single square metre.",fr:"Tara ne déplace pas un ennemi. Elle empile les trois sur un mètre carré."},
 mech:{en:"Tara's Super drags every enemy nearby into one point. Spike's Super drops a slowing, damaging field on that exact point. Nobody walks out of a slow field they're standing in the middle of.",fr:"Le Super de Tara traîne chaque ennemi proche en un seul point. Le Super de Spike pose un champ ralentissant et blessant sur ce point exact. Personne ne sort d'un champ de ralentissement quand il est au milieu."},
 win:{en:"Three enemies, one place, area damage. This is how you win a whole round in two seconds instead of trading kills for a minute.",fr:"Trois ennemis, un endroit, des dégâts de zone. C'est comme ça qu'on gagne une manche en deux secondes au lieu d'échanger des kills pendant une minute."},
 run:{en:"Tara Supers first — the hole has to close before Spike commits. Spike aims at where they'll end up, not where they are. Also brilliant with Barley, Dynamike, Emz, Amber, or Colt's barrage.",fr:"Tara Super en premier — le trou doit se refermer avant que Spike s'engage. Spike vise là où ils vont finir, pas où ils sont. Excellent aussi avec Bartaba, Dynamike, Eliz@, Ambre, ou la rafale de Colt."},
 dont:{en:"Don't pull one enemy. Tara's Super on a single target is a waste of the best Super in the game — hold it until at least two are close. And don't pull a Shelly onto your own head.",fr:"N'aspire pas un seul ennemi. Le Super de Tara sur une cible unique gâche le meilleur Super du jeu — garde-le jusqu'à ce qu'au moins deux soient proches. Et n'aspire pas une Shelly sur ta propre tête."}},

{id:"stunburst",parts:["frank","colt"],diff:0,modes:["gemgrab","heist","hotzone","brawlball"],
 n:{en:"Stun, then delete",fr:"Étourdis, puis efface"},
 why:{en:"A stun is a gift certificate. Somebody has to spend it.",fr:"Un étourdissement est un bon d'achat. Quelqu'un doit le dépenser."},
 mech:{en:"Frank's hammer goes through walls and freezes everyone it hits. For that moment they can't move, shoot, or Super. Colt empties a magazine into a target that has stopped dodging.",fr:"Le marteau de Frank traverse les murs et fige tout ce qu'il touche. Pendant cet instant, ils ne peuvent ni bouger, ni tirer, ni Super. Colt vide un chargeur dans une cible qui a arrêté d'esquiver."},
 win:{en:"Colt's problem is that people move sideways. Frank solves it. Any brawler who needs the target to stand still — Colt, Rico, Piper, Brock, Bea, Mandy, Griff — doubles in value next to a stun.",fr:"Le problème de Colt, c'est que les gens bougent latéralement. Frank le règle. Tout brawler qui a besoin d'une cible immobile — Colt, Ricochet, Polly, Brock, Béa, Mandy, Griff — double de valeur à côté d'un étourdissement."},
 run:{en:"The follow-up has to be aimed BEFORE the hammer lands, not after. The stun is short. If you're still lining up when it ends, you got nothing. Same idea with Charlie's cocoon, Buzz's stun, Maisie's knock.",fr:"Le tir doit être visé AVANT que le marteau touche, pas après. L'étourdissement est court. Si tu vises encore quand il finit, tu n'as rien eu. Même idée avec le cocon de Charlie, l'étourdissement de Buzz, la poussée de Maisie."},
 dont:{en:"Frank has a wind-up you can see from across the map. If the enemy has anyone with a stun, a knockback or a dash, they interrupt him and you've spent nothing but your Super.",fr:"Frank a un temps de charge visible à l'autre bout de la carte. Si l'ennemi a un étourdissement, une poussée ou un dash, il l'interrompt et tu n'as dépensé que ton Super."}},

{id:"tankheal",parts:["bull","poco"],diff:0,modes:["gemgrab","brawlball","hotzone","heist"],
 n:{en:"The wall that heals",fr:"Le mur qui se soigne"},
 why:{en:"A tank's job is to be in the way. A healer's job is to make that job last.",fr:"Le boulot d'un tank, c'est d'être dans le passage. Le boulot d'un soigneur, c'est de faire durer ce boulot."},
 mech:{en:"Bull walks forward and absorbs everything aimed at the team. Poco stands behind him and refills him faster than the chip damage empties him.",fr:"Bull avance et absorbe tout ce qui vise l'équipe. Poco reste derrière et le remplit plus vite que les dégâts ne le vident."},
 win:{en:"Individually they lose. Bull gets kited to death; Poco gets outranged. Together they're an object that moves forward and does not stop, and the enemy has to solve it or give up the ground.",fr:"Séparément, ils perdent. Bull se fait promener à mort ; Poco se fait distancer. Ensemble, c'est un objet qui avance et ne s'arrête pas, et l'ennemi doit le résoudre ou céder le terrain."},
 run:{en:"Poco holds his Super until Bull is actually low — healing a full tank heals nothing. Bull never walks further than Poco can follow. Works with El Primo, Rosa, Frank, Darryl, Ash, Jacky + Poco, Byron, Berry, Gus, Pam, Doug.",fr:"Poco garde son Super jusqu'à ce que Bull soit vraiment bas — soigner un tank plein ne soigne rien. Bull ne va jamais plus loin que Poco ne peut suivre. Marche avec El Costo, Rosa, Frank, Darryl, Ash, Jacky + Poco, Byron, Berry, Gus, Pam, Doug."},
 dont:{en:"Against Crow. His poison switches healing off, and then it's just a Bull walking into three people. Also useless against burst — Poco can't out-heal a Piper shot.",fr:"Contre Corbac. Son poison éteint les soins, et ce n'est plus qu'un Bull qui marche vers trois personnes. Inutile aussi contre le burst — Poco ne peut pas dépasser un tir de Polly."}},

{id:"shieldrush",parts:["rosa","gus"],diff:0,modes:["brawlball","hotzone","gemgrab"],
 n:{en:"Shield first, then go",fr:"Bouclier d'abord, puis fonce"},
 why:{en:"A shield spent before the fight is worth double a heal spent during it.",fr:"Un bouclier dépensé avant le combat vaut le double d'un soin dépensé pendant."},
 mech:{en:"Gus gives Rosa a spirit shield that eats damage before her health bar does. Rosa then uses her own shield Super on top. Two layers of damage reduction on a brawler already built to walk into things.",fr:"Gus donne à Rosa un bouclier d'esprit qui mange les dégâts avant sa barre de vie. Rosa met ensuite son propre Super par-dessus. Deux couches de réduction sur une brawler déjà faite pour foncer."},
 win:{en:"Shields are pre-paid health. Healing is a race you can lose; a shield is already there. Against a team that was going to burst Rosa down in one window, the window closes.",fr:"Un bouclier, c'est de la vie prépayée. Le soin est une course qu'on peut perdre ; le bouclier est déjà là. Contre une équipe qui allait effacer Rosa en une fenêtre, la fenêtre se ferme."},
 run:{en:"Shield BEFORE she walks in. Gus shielding a Rosa who is already surrounded is a Gus wasting a Super. Same logic for Buster's shield and Ruffs' buff drops.",fr:"Le bouclier AVANT qu'elle entre. Gus qui protège une Rosa déjà encerclée, c'est un Gus qui gâche son Super. Même logique pour le bouclier de Buster et les bonus de Colonel Médor."},
 dont:{en:"On an open map. Two shields don't fix being outranged by a Piper — they just make the walk longer.",fr:"Sur une carte ouverte. Deux boucliers ne règlent pas le fait d'être distancé par une Polly — ils rallongent juste la marche."}},

{id:"sandpush",parts:["sandy","elprimo"],diff:1,modes:["gemgrab","hotzone","brawlball","heist"],
 n:{en:"The storm push",fr:"La poussée dans la tempête"},
 why:{en:"Invisibility isn't safety. It's confusion — and confusion is enough.",fr:"L'invisibilité n'est pas la sécurité. C'est la confusion — et la confusion suffit."},
 mech:{en:"Sandy's sandstorm hides everyone inside it. The enemy can still shoot into it, but they're shooting at a guess. El Primo walks through the storm and arrives without ever being aimed at.",fr:"La tempête d'Émeri cache tout le monde dedans. L'ennemi peut toujours tirer dedans, mais il tire au hasard. El Costo traverse la tempête et arrive sans jamais avoir été visé."},
 win:{en:"Tanks lose because everyone shoots them for the whole walk. Delete the walk and the tank arrives at full health, which is the only version of a tank that's actually scary.",fr:"Les tanks perdent parce que tout le monde leur tire dessus pendant toute la marche. Supprime la marche et le tank arrive à pleine vie, la seule version d'un tank qui fait vraiment peur."},
 run:{en:"Sandy places the storm ON the route, not on the enemy. The whole team commits at once — a storm with one person in it is just a hint about where that person is.",fr:"Émeri place la tempête SUR le trajet, pas sur l'ennemi. Toute l'équipe s'engage en même temps — une tempête avec une seule personne dedans est juste un indice sur sa position."},
 dont:{en:"Against a thrower. Barley doesn't need to see you to cover the storm in fire, and neither does Tick.",fr:"Contre un lanceur. Bartaba n'a pas besoin de te voir pour couvrir la tempête de feu, et Tick non plus."}},

{id:"speedball",parts:["max","frank"],diff:1,modes:["brawlball","gemgrab"],
 n:{en:"Speed into the goal",fr:"Vitesse vers le but"},
 why:{en:"Brawl Ball is a footrace with weapons. Whoever is faster in the last three seconds scores.",fr:"Le Brawl Ball est une course à pied avec des armes. Le plus rapide sur les trois dernières secondes marque."},
 mech:{en:"Max's Super speeds up the entire team. The ball carrier goes from catchable to uncatchable, and Frank arrives at the goalie before the goalie has finished reloading.",fr:"Le Super de Max accélère toute l'équipe. Le porteur du ballon passe de rattrapable à intouchable, et Frank arrive sur le gardien avant qu'il ait fini de recharger."},
 win:{en:"Most Brawl Ball goals are lost by half a second. Max buys you two. She also un-loses fights: the boost works just as well running away as running in.",fr:"La plupart des buts se perdent d'une demi-seconde. Max t'en achète deux. Elle dé-perd aussi des combats : le boost marche aussi bien pour fuir que pour foncer."},
 run:{en:"Save it. A Max Super used to walk across an empty map is the most common mistake with her. It's for the goal, the gem grab, or the escape — nothing else.",fr:"Garde-le. Un Super de Max utilisé pour traverser une carte vide est l'erreur la plus fréquente avec elle. C'est pour le but, la gemme, ou la fuite — rien d'autre."},
 dont:{en:"When your team is spread out. The boost is an area around Max, not a team-wide buff you can fire from home.",fr:"Quand l'équipe est éparpillée. Le boost est une zone autour de Max, pas un buff d'équipe qu'on déclenche de la maison."}},

{id:"heistturret",parts:["8bit","piper"],diff:0,modes:["heist"],
 n:{en:"Booster and sniper",fr:"Booster et sniper"},
 why:{en:"A damage buff is worth the most on the brawler who never has to move.",fr:"Un bonus de dégâts vaut le plus sur le brawler qui n'a jamais besoin de bouger."},
 mech:{en:"8-Bit plants his damage booster. Anyone standing in it hits harder. Piper stands in it and shoots the safe from maximum range, where her damage is already at its highest.",fr:"A.R.K.A.D. plante son booster de dégâts. Ceux qui se tiennent dedans frappent plus fort. Polly reste dedans et tire sur le coffre à portée maximale, là où ses dégâts sont déjà au plus haut."},
 win:{en:"Two multipliers on the same shot: Piper's distance bonus and 8-Bit's booster. Heist is a damage race against a target that can't dodge — this is the highest number you can put on a stationary object.",fr:"Deux multiplicateurs sur le même tir : le bonus de distance de Polly et le booster d'A.R.K.A.D. Le Braquage est une course aux dégâts contre une cible qui n'esquive pas — c'est le plus gros chiffre possible sur un objet immobile."},
 run:{en:"Booster goes down where Piper can shoot the safe from, not where 8-Bit feels safe. Any long-range brawler works: Brock, Bea, Colt, Mandy, Nani, Grom.",fr:"Le booster se pose là d'où Polly peut tirer sur le coffre, pas là où A.R.K.A.D. se sent bien. N'importe quelle longue portée marche : Brock, Béa, Colt, Mandy, Nani, Grom."},
 dont:{en:"Against a diver. Two immobile brawlers standing on the same tile is a Mortis's dream. You need a third who can peel.",fr:"Contre un plongeur. Deux brawlers immobiles sur la même case, c'est le rêve d'un Mortis. Il te faut un troisième qui protège."}},

{id:"heistdefense",parts:["pam","jessie"],diff:0,modes:["heist","hotzone"],
 n:{en:"Two turrets, one corner",fr:"Deux tourelles, un coin"},
 why:{en:"Defending a fixed point is the one situation where things that can't move are good.",fr:"Défendre un point fixe est la seule situation où les choses immobiles sont bonnes."},
 mech:{en:"Jessie's turret shoots anyone approaching the safe. Pam's turret heals Jessie's turret and both brawlers. Attackers have to kill three things instead of two, and one of them keeps repairing the others.",fr:"La tourelle de Jessie tire sur quiconque approche du coffre. La tourelle de Pam soigne la tourelle de Jessie et les deux brawlers. Les attaquants doivent tuer trois choses au lieu de deux, et l'une répare les autres."},
 win:{en:"Every second the attacker spends killing a turret is a second they're not spending on your safe. You aren't trying to win the fight — you're trying to make it take too long.",fr:"Chaque seconde que l'attaquant passe à tuer une tourelle est une seconde qu'il ne passe pas sur ton coffre. Tu n'essaies pas de gagner le combat — tu essaies de le faire durer trop longtemps."},
 run:{en:"Turrets go slightly to the SIDE of the safe, not on it. On it, one Barley bottle kills both turrets and chips the safe.",fr:"Les tourelles se posent légèrement à CÔTÉ du coffre, pas dessus. Dessus, une bouteille de Bartaba tue les deux tourelles et grignote le coffre."},
 dont:{en:"Against throwers. Turrets can't dodge and neither can Pam. A Barley or a Tick turns this whole plan into free Super charge for them.",fr:"Contre les lanceurs. Les tourelles n'esquivent pas, et Pam non plus. Un Bartaba ou un Tick transforme tout ce plan en charge de Super gratuite pour eux."}},

{id:"wallbounce",parts:["sprout","rico"],diff:2,modes:["gemgrab","hotzone","bounty"],
 n:{en:"Build a wall to shoot around",fr:"Un mur pour tirer dans les coins"},
 why:{en:"Rico's damage lives in walls. Sprout sells walls.",fr:"Les dégâts de Ricochet vivent dans les murs. Wally vend des murs."},
 mech:{en:"Sprout grows a wall in open ground. Rico's bullets now bounce off it and hit people standing where nothing could reach them a second ago. His shots also get stronger the further they travel — and a bounce is extra travel.",fr:"Wally fait pousser un mur en terrain découvert. Les balles de Ricochet rebondissent dessus et touchent des gens là où rien ne les atteignait une seconde plus tôt. Ses tirs deviennent aussi plus forts en voyageant — et un rebond, c'est du voyage en plus."},
 win:{en:"You changed the map. The enemy's safe corner isn't safe any more and they haven't noticed yet.",fr:"Tu as changé la carte. Le coin sûr de l'ennemi ne l'est plus et il ne l'a pas encore remarqué."},
 run:{en:"Sprout walls the OPEN side, turning a two-way corridor into a bounce chamber. Tell Rico first, or he'll just shoot the wall.",fr:"Wally ferme le côté OUVERT, transformant un couloir à deux voies en chambre à rebonds. Préviens Ricochet, sinon il tirera juste dans le mur."},
 dont:{en:"When the wall also blocks your own team's line. Sprout walls are honest — they stop your bullets too.",fr:"Quand le mur bloque aussi la ligne de ton équipe. Les murs de Wally sont honnêtes — ils arrêtent aussi tes balles."}},

{id:"snipershield",parts:["sprout","piper"],diff:1,modes:["bounty","knockout","heist"],
 n:{en:"A wall for the sniper",fr:"Un mur pour la sniper"},
 why:{en:"Piper doesn't die to damage. She dies to arrival.",fr:"Polly ne meurt pas des dégâts. Elle meurt de l'arrivée."},
 mech:{en:"Sprout drops a wall between Piper and the only lane an assassin can reach her through. The Mortis dashes into a wall that wasn't there when he committed.",fr:"Wally pose un mur entre Polly et le seul couloir par lequel un assassin peut l'atteindre. Le Mortis dash dans un mur qui n'existait pas quand il s'est engagé."},
 win:{en:"Marksmen are worth a fortune if they survive and nothing if they don't. The cheapest way to protect one isn't healing — it's geometry.",fr:"Un sniper vaut une fortune s'il survit et rien s'il meurt. La façon la moins chère d'en protéger un n'est pas le soin — c'est la géométrie."},
 run:{en:"React, don't pre-build. The wall goes down when the dive starts, in the gap he's using. Buster's shield Super and Gale's push do the same job differently.",fr:"Réagis, ne construis pas d'avance. Le mur se pose quand le plongeon démarre, dans la brèche qu'il utilise. Le bouclier de Buster et la poussée de Gaël font le même boulot autrement."},
 dont:{en:"Against Mico or Shade, who go over or through walls. Against them a wall is a decoration.",fr:"Contre Mico ou Shade, qui passent par-dessus ou à travers. Contre eux, un mur est une décoration."}},

{id:"pushmines",parts:["gale","bo"],diff:2,modes:["gemgrab","hotzone","brawlball"],
 n:{en:"Push them onto the mines",fr:"Repousse-les sur les mines"},
 why:{en:"A knockback is a question: what's behind them?",fr:"Une poussée est une question : qu'y a-t-il derrière eux ?"},
 mech:{en:"Bo's mines are invisible and sit on a route the enemy uses. Gale's gust shoves whoever's in front of him backwards — directly onto them.",fr:"Les mines de Bo sont invisibles et posées sur une route que l'ennemi emprunte. La bourrasque de Gaël repousse celui qui est devant lui — droit dessus."},
 win:{en:"The enemy is careful about the mines when they choose to walk. Gale removes the choosing. Same trick with a pit, a wall, or your own tank standing behind them.",fr:"L'ennemi fait attention aux mines quand il choisit d'avancer. Gaël supprime le choix. Même astuce avec un trou, un mur, ou ton propre tank posté derrière."},
 run:{en:"Bo mines the route BEFORE the fight, in a place the enemy has to cross. Gale then only has to push in one direction, which is the direction he's already facing.",fr:"Bo mine la route AVANT le combat, à un endroit obligatoire. Gaël n'a plus qu'à pousser dans une direction, celle où il est déjà tourné."},
 dont:{en:"When the push saves them. Gale's gust is long — you can shove an enemy out of your own tank's reach and hand them the escape.",fr:"Quand la poussée les sauve. La bourrasque de Gaël est longue — tu peux éjecter un ennemi hors de portée de ton tank et lui offrir la fuite."}},

{id:"catride",parts:["kit","bull"],diff:0,modes:["gemgrab","brawlball","hotzone","showdown"],
 n:{en:"The passenger",fr:"Le passager"},
 why:{en:"Kit isn't a support standing behind you. Kit is on you.",fr:"Kit n'est pas un soutien derrière toi. Kit est sur toi."},
 mech:{en:"Kit jumps onto Bull's back and stays there, healing him constantly and adding damage. They move as one brawler with two health bars and one hitbox.",fr:"Kit saute sur le dos de Bull et y reste, le soignant en continu et ajoutant des dégâts. Ils se déplacent comme un brawler avec deux barres de vie et une hitbox."},
 win:{en:"Every other healer has a range problem — they have to keep up. Kit doesn't. A tank with Kit on board can go anywhere a tank can go and stay healed the whole way there.",fr:"Tous les autres soigneurs ont un problème de portée — ils doivent suivre. Pas Kit. Un tank avec Kit à bord peut aller partout où un tank va, soigné tout le trajet."},
 run:{en:"Ride the brawler who is going to be in the fight, not the one who is safe. Kit on a Piper is a wasted cat. Jump off to pounce something, then get straight back on.",fr:"Chevauche celui qui va être dans le combat, pas celui qui est à l'abri. Kit sur une Polly, c'est un chat gâché. Saute pour clouer quelqu'un, puis remonte tout de suite."},
