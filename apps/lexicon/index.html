<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lexicon — a word you probably don't know</title>
<meta name="description" content="Draws a word you probably don't know, in English or French: five levels of erudition, toggleable domains, and a printable memory card.">
<!-- Static, so a shared word link previews as the app rather than the word: the
     card is drawn in the browser and there is no server to render an image per
     entry. The link still reopens the exact word. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="poc-lab">
<meta property="og:title" content="Lexicon — a word you probably don't know">
<meta property="og:description" content="A rare word per draw, in English or French, with its transcription, definition and root — and a memory card to take away.">
<meta name="twitter:card" content="summary">
<style>
  /* Self-hosted, subsetted to Latin + IPA + the Greek letters phonetics needs.
     Newsreader carries no IPA glyphs at all, so transcriptions are set in Inter —
     otherwise they fall through to whatever serif the machine happens to have. */
  @font-face{
    font-family:"Newsreader";font-style:normal;font-weight:400;font-display:swap;
    src:url("fonts/newsreader-400.woff2") format("woff2");
  }
  @font-face{
    font-family:"Newsreader";font-style:italic;font-weight:400;font-display:swap;
    src:url("fonts/newsreader-italic-400.woff2") format("woff2");
  }
  @font-face{
    font-family:"Inter";font-style:normal;font-weight:400;font-display:swap;
    src:url("fonts/inter-400.woff2") format("woff2");
  }
  @font-face{
    font-family:"Inter";font-style:normal;font-weight:500;font-display:swap;
    src:url("fonts/inter-500.woff2") format("woff2");
  }

  :root{
    color-scheme:light dark;
    --paper:#f5f2eb; --panel:#fffdf8; --ink:#1a1917; --soft:#4c4840; --muted:#8b8375;
    --rule:#e3ddcf; --hair:#eee9dd; --accent:#9c3b26; --wash:rgba(156,59,38,.08);
    --shadow:0 1px 2px rgba(38,30,20,.05), 0 12px 32px -18px rgba(38,30,20,.28);
    --sans:"Inter",ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
    --serif:"Newsreader",ui-serif,Georgia,"Times New Roman",serif;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme=light]){
      --paper:#131210; --panel:#1c1a16; --ink:#f1ece1; --soft:#c6bfb0; --muted:#8e8676;
      --rule:#2e2b24; --hair:#26241e; --accent:#dd7a56; --wash:rgba(221,122,86,.12);
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 36px -20px rgba(0,0,0,.8);
    }
  }
  :root[data-theme=dark]{
    --paper:#131210; --panel:#1c1a16; --ink:#f1ece1; --soft:#c6bfb0; --muted:#8e8676;
    --rule:#2e2b24; --hair:#26241e; --accent:#dd7a56; --wash:rgba(221,122,86,.12);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 36px -20px rgba(0,0,0,.8);
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--sans);font-size:16px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(120% 80% at 50% -10%, var(--wash), transparent 60%);
    background-repeat:no-repeat;
  }
  .wrap{max-width:760px;margin:0 auto;padding:2.6rem 1.15rem 4rem;}

  /* ── masthead ─────────────────────────────────────────────── */
  .masthead{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:2.2rem;}
  .kicker{font-family:var(--mono);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:0 0 .55rem;}
  h1{font-family:var(--serif);font-weight:400;font-size:2.5rem;line-height:1;letter-spacing:-.02em;margin:0 0 .5rem;}
  .lede{margin:0;color:var(--soft);max-width:44ch;font-size:.95rem;}
  .tools{flex:0 0 auto;display:flex;align-items:center;gap:.5rem;}
  .langs{display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden;}
  .lang{
    font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;
    background:transparent;border:0;color:var(--muted);cursor:pointer;
    padding:.42rem .6rem;transition:color .18s ease,background .18s ease;
  }
  .lang:hover{color:var(--ink);}
  .lang[aria-pressed=true]{color:var(--accent);background:var(--wash);}
  .theme{
    flex:0 0 auto;width:36px;height:36px;display:grid;place-items:center;
    background:transparent;border:1px solid var(--rule);border-radius:50%;
    color:var(--muted);cursor:pointer;transition:color .2s,border-color .2s,transform .2s;
  }
  .theme:hover{color:var(--ink);border-color:var(--muted);transform:rotate(-18deg);}
  .theme svg{width:16px;height:16px;}
  .theme .moon{display:none;}
  :root[data-theme=dark] .theme .moon{display:block;}
  :root[data-theme=dark] .theme .sun{display:none;}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme=light]) .theme .moon{display:block;}
    :root:not([data-theme=light]) .theme .sun{display:none;}
  }

  /* ── controls ─────────────────────────────────────────────── */
  .controls{margin-bottom:1.6rem;}
  .field + .field{margin-top:1.5rem;}
  .label{
    font-family:var(--mono);font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;
    color:var(--muted);margin:0 0 .7rem;display:flex;align-items:baseline;justify-content:space-between;gap:1rem;
  }
  .label .count{letter-spacing:.08em;text-transform:none;font-size:.7rem;}

  .levels{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border-top:1px solid var(--rule);}
  .lvl{
    position:relative;background:none;border:0;border-top:2px solid transparent;margin-top:-1px;
    padding:.75rem .2rem .55rem;cursor:pointer;color:var(--muted);
    display:flex;flex-direction:column;align-items:center;gap:.15rem;
    transition:color .22s ease,border-color .22s ease;
  }
  .lvl .num{font-family:var(--serif);font-size:1.28rem;line-height:1;letter-spacing:.04em;}
  .lvl .nm{font-size:.7rem;letter-spacing:.02em;}
  .lvl:hover{color:var(--soft);}
  .lvl[aria-checked=true]{color:var(--accent);border-top-color:var(--accent);}
  .lvl[aria-checked=true] .nm{color:var(--soft);}
  .lvl-desc{margin:.7rem 0 0;font-size:.86rem;color:var(--muted);min-height:1.3em;}

  .chips{display:flex;flex-wrap:wrap;gap:.4rem;}
  /* The lit dot carries the state, so eight active chips stay quiet rather than
     turning the panel into a wall of accent. */
  .chip{
    display:inline-flex;align-items:center;gap:.5rem;
    font-family:var(--sans);font-size:.82rem;color:var(--muted);
    background:transparent;border:1px solid var(--rule);border-radius:999px;
    padding:.35rem .85rem .35rem .7rem;cursor:pointer;transition:all .18s ease;
  }
  .chip::before{
    content:"";width:6px;height:6px;border-radius:50%;flex:0 0 auto;
    border:1px solid var(--muted);background:transparent;transition:all .18s ease;
  }
  .chip:hover{color:var(--ink);border-color:var(--muted);}
  .chip[aria-pressed=true]{color:var(--ink);background:var(--wash);}
  .chip[aria-pressed=true]::before{background:var(--accent);border-color:var(--accent);}
  .chip[aria-pressed=false]{opacity:.7;}
  .bulk{display:flex;gap:.9rem;margin-top:.7rem;}
  .link{
    background:none;border:0;padding:0;cursor:pointer;color:var(--muted);
    font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;
    border-bottom:1px solid transparent;transition:color .18s,border-color .18s;
  }
  .link:hover{color:var(--ink);border-bottom-color:var(--rule);}

  /* ── the stage ────────────────────────────────────────────── */
  .stage{
    margin-top:2rem;background:var(--panel);border:1px solid var(--rule);border-radius:16px;
    padding:1.6rem 1.7rem 1.8rem;box-shadow:var(--shadow);position:relative;overflow:hidden;
  }
  .stage::before{content:"";position:absolute;inset:0 0 auto;height:2px;background:var(--accent);opacity:.85;}
  .stage-head{
    display:flex;justify-content:space-between;align-items:baseline;gap:1rem;
    font-family:var(--mono);font-size:.65rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  }
  .word{
    font-family:var(--serif);font-weight:400;font-optical-sizing:auto;
    font-size:clamp(2.3rem,8.5vw,3.9rem);line-height:1.04;letter-spacing:-.022em;
    margin:1.1rem 0 .5rem;overflow-wrap:break-word;hyphens:auto;
  }
  .phon{margin:0;color:var(--muted);font-size:.92rem;display:flex;flex-wrap:wrap;align-items:baseline;gap:.55rem;}
  .phon .ipa{font-family:var(--sans);font-size:.93rem;letter-spacing:.005em;}
  .phon .sep{opacity:.5;}
  .phon .pos{font-style:italic;font-family:var(--serif);font-size:1rem;}
  .rule{border:0;border-top:1px solid var(--hair);margin:1.25rem 0 1.15rem;}
  .def{font-family:var(--serif);font-size:1.28rem;line-height:1.52;margin:0;max-width:48ch;text-wrap:pretty;}
  .root{margin:1.15rem 0 0;font-size:.86rem;color:var(--muted);max-width:52ch;line-height:1.55;}
  .root .lbl{
    font-family:var(--mono);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;
    color:var(--accent);margin-right:.6rem;
  }
  .stage.empty .word{font-size:1.5rem;color:var(--muted);font-style:italic;}

  /* ── actions ──────────────────────────────────────────────── */
  .actions{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.5rem;}
  .btn{
    font-family:var(--sans);font-size:.9rem;font-weight:500;
    padding:.62rem 1.15rem;border-radius:999px;cursor:pointer;
    border:1px solid var(--rule);background:transparent;color:var(--ink);
    transition:all .18s ease;
  }
  .btn:hover:not(:disabled){border-color:var(--muted);transform:translateY(-1px);}
  .btn:active:not(:disabled){transform:translateY(0);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fffdf8;}
  .btn.primary:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .sheet{
    margin-top:.85rem;padding:1rem 1.1rem 1.1rem;
    background:var(--panel);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow);
    max-width:34rem;
  }
  @media (prefers-reduced-motion:no-preference){
    .sheet{animation:sheetIn .26s cubic-bezier(.2,.7,.2,1) both;}
    @keyframes sheetIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}
  }
  .sheet__t{
    margin:0 0 .7rem;font-family:var(--mono);font-size:.64rem;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);
  }
  .sheet__row{display:flex;flex-wrap:wrap;gap:.4rem;}
  .sheet__row + .sheet__row{margin-top:.45rem;}
  .sheet__b{
    font-family:var(--sans);font-size:.82rem;color:var(--soft);text-decoration:none;
    background:transparent;border:1px solid var(--rule);border-radius:999px;
    padding:.34rem .8rem;cursor:pointer;transition:all .18s ease;
  }
  .sheet__b:hover{color:var(--ink);border-color:var(--muted);transform:translateY(-1px);}
  .sheet__n{margin:.75rem 0 0;font-size:.72rem;color:var(--muted);line-height:1.5;}
  .hint{margin:.9rem 0 0;font-size:.76rem;color:var(--muted);}
  kbd{
    font-family:var(--mono);font-size:.7rem;border:1px solid var(--rule);border-bottom-width:2px;
    border-radius:5px;padding:.1rem .34rem;color:var(--soft);
  }

  footer{margin-top:3rem;padding-top:1.2rem;border-top:1px solid var(--hair);
    font-size:.76rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;justify-content:space-between;}
  footer a{color:var(--muted);text-underline-offset:3px;}
  footer a:hover{color:var(--ink);}

  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px;}

  @media (max-width:560px){
    .wrap{padding-top:2rem;}
    h1{font-size:2.1rem;}
    .stage{padding:1.3rem 1.25rem 1.5rem;}
    .lvl .nm{font-size:.62rem;}
    .def{font-size:1.18rem;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
    .theme:hover{transform:none;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div>
      <p class="kicker">Lexicon</p>
      <h1 id="h1">A word you probably don't know</h1>
      <p class="lede" id="lede">Pick how far past common usage you want to go, keep only the domains you care for, and take the card with you.</p>
    </div>
    <div class="tools">
    <div class="langs" id="langs" role="group" aria-label="Language">
      <button class="lang" type="button" data-lang="en" aria-pressed="true" lang="en">EN</button>
      <button class="lang" type="button" data-lang="fr" aria-pressed="false" lang="fr">FR</button>
    </div>
    <button class="theme" id="theme" type="button" aria-label="Switch colour theme" title="Switch colour theme">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2"/><path d="M12 2.4v2.2M12 19.4v2.2M2.4 12h2.2M19.4 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/>
      </svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.2 8.2 0 1 0 10.2 10.2z"/>
      </svg>
    </button>
    </div>
  </header>

  <section class="controls">
    <div class="field">
      <p class="label"><span id="levelLabel">Level of knowledge</span></p>
      <div class="levels" id="levels" role="radiogroup" aria-label="Level of knowledge"></div>
      <p class="lvl-desc" id="lvlDesc"></p>
    </div>

    <div class="field">
      <p class="label"><span id="domainLabel">Domains</span><span class="count" id="poolCount"></span></p>
      <div class="chips" id="chips" role="group" aria-label="Domains"></div>
      <div class="bulk">
        <button class="link" id="allDomains" type="button">All</button>
        <button class="link" id="noDomains" type="button">None</button>
      </div>
    </div>
  </section>

  <article class="stage" id="stage" aria-live="polite">
    <div class="stage-head">
      <span id="tagDomain"></span>
      <span id="tagLevel"></span>
    </div>
    <h2 class="word" id="word"></h2>
    <p class="phon" id="phon">
      <span class="ipa" id="ipa"></span>
      <span class="sep" aria-hidden="true">·</span>
      <span class="pos" id="pos"></span>
    </p>
    <hr class="rule">
    <p class="def" id="def"></p>
    <p class="root" id="rootLine"><span class="lbl" id="rootLbl">Root</span><span id="root"></span></p>
  </article>

  <div class="actions">
    <button class="btn primary" id="next" type="button">New word</button>
    <button class="btn" id="dl" type="button">Download card</button>
    <button class="btn" id="share" type="button" aria-expanded="false" aria-controls="sheet">Share</button>
  </div>

  <div class="sheet" id="sheet" hidden role="group" aria-labelledby="sheetTitle">
    <p class="sheet__t" id="sheetTitle">Share this card</p>
    <div class="sheet__row">
      <button class="sheet__b" id="copyLink" type="button">Copy link</button>
      <button class="sheet__b" id="copyImage" type="button">Copy image</button>
    </div>
    <div class="sheet__row" id="socials"></div>
    <p class="sheet__n" id="sheetNote"></p>
  </div>
  <p class="hint" id="hint"><kbd>Space</kbd> new word &nbsp;·&nbsp; <kbd>D</kbd> download card</p>

  <footer>
    <span id="stat"></span>
    <span><span id="footnote">Broad transcriptions</span> · <a href="../">poc-lab</a></span>
  </footer>
</div>

<noscript><p style="text-align:center;font-family:sans-serif">This page needs JavaScript to draw words.</p></noscript>

<script>
// ── data ────────────────────────────────────────────────────────────────────
// Rows are positional to keep 200 entries readable in bulk; the field list below
// is the schema and is zipped into objects once, at load.
const FIELDS = ["domain", "level", "word", "ipa", "pos", "def", "root"];

// Two banks, not one bank translated. English draws rare English words, French
// draws rare French ones — switching language changes the vocabulary, not the
// labels on it. The eight domains and five levels are the same shelf in both,
// so a reader who has learned the map keeps it when they switch.
const L10N = {
  en: {
    htmlLang: "en",
    name: "English",
    domains: {
      language: "Language & Rhetoric", mind: "Mind & Philosophy", nature: "Nature & Earth",
      matter: "Matter & Cosmos", body: "Body & Medicine", arts: "Arts & Craft",
      society: "Society & Law", systems: "Number & Systems",
    },
    levels: [
      { name: "Common",     desc: "Words a curious adult has met in print but never said aloud." },
      { name: "Well-read",  desc: "The working vocabulary of someone who reads widely." },
      { name: "Erudite",    desc: "Terms of art you only meet inside a discipline." },
      { name: "Recondite",  desc: "A practitioner's shorthand, opaque from the outside." },
      { name: "Omniscient", desc: "Words that send specialists back to the reference shelf." },
    ],
    pos: { n: "noun", nm: "noun", nf: "noun", adj: "adjective", v: "verb", adv: "adverb", phr: "phrase" },
    title: "A word you probably don't know",
    lede: "Pick how far past common usage you want to go, keep only the domains you care for, and take the card with you.",
    levelLabel: "Level of knowledge",
    domainLabel: "Domains",
    inPlay: (n) => (n === 1 ? "1 word in play" : `${n} words in play`),
    all: "All", none: "None",
    next: "New word", download: "Download card", share: "Share",
    shareTitle: "Share this card", copyLink: "Copy link", copyImage: "Copy image",
    copied: "Copied", shareOn: (n) => `Share on ${n}`,
    shareNote: "Links reopen the word. To post the card itself, download it and attach it.",
    drawing: "Drawing…", saved: "Saved", failed: "Card failed",
    hint: "<kbd>Space</kbd> new word &nbsp;·&nbsp; <kbd>D</kbd> download &nbsp;·&nbsp; <kbd>S</kbd> share",
    emptyTag: "No pool", emptyWord: "Nothing at this level",
    emptyDef: "Turn on another domain, or move to a different level — this combination is empty.",
    rootLabel: "Root", defLabel: "Definition",
    stat: (w, d, l) => `${w} words · ${d} domains · ${l} levels`,

    themeLabel: "Switch colour theme", langLabel: "Language",
    levelAria: (n, name) => `Level ${n}, ${name}`,
  },
  fr: {
    htmlLang: "fr",
    name: "Français",
    domains: {
      language: "Langue & Rhétorique", mind: "Esprit & Philosophie", nature: "Nature & Terre",
      matter: "Matière & Cosmos", body: "Corps & Médecine", arts: "Arts & Métiers",
      society: "Société & Droit", systems: "Nombre & Systèmes",
    },
    levels: [
      { name: "Courant",    desc: "Des mots qu'un lecteur curieux a croisés sans jamais les dire." },
      { name: "Lettré",     desc: "Le vocabulaire de qui lit beaucoup." },
      { name: "Érudit",     desc: "Des termes qu'on ne rencontre qu'au sein d'une discipline." },
      { name: "Savant",     desc: "La langue d'un métier, opaque vue du dehors." },
      { name: "Omniscient", desc: "Des mots qui renvoient les spécialistes au dictionnaire." },
    ],
    pos: { n: "nom", nm: "n. m.", nf: "n. f.", adj: "adjectif", v: "verbe", adv: "adverbe", phr: "locution" },
    title: "Un mot que vous ne connaissez sans doute pas",
    lede: "Choisissez jusqu'où aller au-delà de l'usage courant, ne gardez que les domaines qui vous intéressent, et emportez la fiche.",
    levelLabel: "Niveau de connaissance",
    domainLabel: "Domaines",
    inPlay: (n) => (n === 1 ? "1 mot en jeu" : `${n} mots en jeu`),
    all: "Tous", none: "Aucun",
    next: "Nouveau mot", download: "Télécharger la fiche", share: "Partager",
    shareTitle: "Partager cette fiche", copyLink: "Copier le lien", copyImage: "Copier l'image",
    copied: "Copié", shareOn: (n) => `Partager sur ${n}`,
    shareNote: "Les liens rouvrent le mot. Pour publier la fiche elle-même, téléchargez-la et joignez-la.",

    emptyTag: "Aucun tirage", emptyWord: "Rien à ce niveau",

};

const DOMAIN_KEYS = ["language", "mind", "nature", "matter", "body", "arts", "society", "systems"];
const ROMAN = ["I", "II", "III", "IV", "V"];

const RAW_EN = [
  // ── Language & Rhetoric ──
  ["language",1,"laconic","/ləˈkɒnɪk/","adj","Using very few words; terse to the point of seeming cold.","Greek Lakōnikos, ‘of Laconia’ — the region of Sparta, whose people were famed for answering at length only when they had to."],
  ["language",1,"garrulous","/ˈɡærələs/","adj","Talking too much, and about trifles.","Latin garrire, to chatter."],
  ["language",1,"malapropism","/ˈmæləprɒpɪzəm/","n","The use of a word in place of a similar-sounding one, to unintended comic effect.","After Mrs Malaprop in Sheridan’s The Rivals (1775), from French mal à propos, ‘inappropriate’."],
  ["language",1,"circumlocution","/ˌsɜːkəmləˈkjuːʃən/","n","Saying in many words what could be said in few, often to avoid saying it plainly.","Latin circum (around) + loqui (to speak)."],
  ["language",1,"epithet","/ˈɛpɪθɛt/","n","A descriptive phrase fixed to a name — ‘swift-footed Achilles’; also, an abusive term.","Greek epitheton, ‘something added’."],
  ["language",2,"polysemy","/pəˈlɪsɪmi/","n","The capacity of a single word to carry several related meanings at once.","Greek poly (many) + sēma (sign)."],
  ["language",2,"solecism","/ˈsɒlɪsɪzəm/","n","A blunder in grammar or usage; by extension, a breach of good manners.","Greek soloikismos, after Soloi, a colony whose Greek was thought to have gone to seed."],
  ["language",2,"anaphora","/əˈnæfərə/","n","The repetition of the same word at the start of successive clauses.","Greek anaphora, ‘a carrying back’."],
  ["language",2,"zeugma","/ˈzjuːɡmə/","n","A figure in which one word governs two others in different senses — ‘she took her coat and her leave’.","Greek zeugma, ‘a yoking’."],
  ["language",2,"litotes","/laɪˈtəʊtiːz/","n","Understatement by denying the opposite — ‘not bad’ for excellent.","Greek litos, plain or simple."],
  ["language",3,"apophasis","/əˈpɒfəsɪs/","n","Raising a subject by declaring you will not raise it — ‘I won’t mention his debts’.","Greek apophasis, denial."],
  ["language",3,"catachresis","/ˌkætəˈkriːsɪs/","n","The strained or improper use of a word, sometimes deliberate — Milton’s ‘blind mouths’.","Greek katachrēsis, misuse."],
  ["language",3,"hapax legomenon","/ˌhæpæks lɪˈɡɒmɪnɒn/","n","A word attested only once in the whole of a corpus, leaving its meaning a matter of inference.","Greek, ‘said once’."],
  ["language",3,"paronomasia","/ˌpærənəˈmeɪziə/","n","Wordplay that turns on similarity of sound; punning treated as a rhetorical figure.","Greek para (beside) + onomazein (to name)."],
  ["language",3,"syncope","/ˈsɪŋkəpi/","n","The loss of a sound or syllable from the middle of a word — ‘ne’er’, ‘fo’c’sle’.","Greek synkopē, ‘a cutting up’."],
  ["language",4,"aposiopesis","/ˌæpəsaɪəˈpiːsɪs/","n","Breaking off in mid-sentence as though unable or unwilling to go on.","Greek aposiōpēsis, ‘becoming silent’."],
  ["language",4,"epizeuxis","/ˌɛpɪˈzjuːksɪs/","n","The immediate repetition of a word for emphasis — ‘alone, alone, all all alone’.","Greek epizeuxis, ‘a fastening together’."],
  ["language",4,"anacoluthon","/ˌænəkəˈluːθɒn/","n","A sentence that abandons the grammar it started with and finishes in another.","Greek anakolouthon, ‘lacking sequence’."],
  ["language",4,"metathesis","/mɪˈtæθɪsɪs/","n","The swapping of sounds within a word — Old English brid becoming bird.","Greek metathesis, transposition."],
  ["language",4,"antanaclasis","/ˌæntənəˈklæsɪs/","n","Repeating a word in two different senses — ‘your argument is sound, nothing but sound’.","Greek antanaklasis, ‘a bending back’."],
  ["language",5,"tmesis","/təˈmiːsɪs/","n","The insertion of one word inside another — ‘abso-blooming-lutely’.","Greek tmēsis, ‘a cutting’."],
  ["language",5,"polyptoton","/pəˈlɪptətɒn/","n","Repetition of words sharing a root but differing in form — ‘the Greeks are strong, and skilful to their strength’.","Greek polyptōton, ‘in many cases’."],
  ["language",5,"paraprosdokian","/ˌpærəprɒsˈdəʊkiən/","n","A sentence whose ending forces you to reinterpret its beginning.","Coined from Greek para (beyond) + prosdokia (expectation)."],
  ["language",5,"epanalepsis","/ˌɛpənəˈlɛpsɪs/","n","A clause that ends with the same word it began with — ‘nothing is worse than doing nothing’.","Greek epanalēpsis, ‘a taking up again’."],
  ["language",5,"hendiadys","/hɛnˈdaɪədɪs/","n","Expressing one idea through two nouns joined by ‘and’ — ‘sound and fury’ for furious sound.","Greek hen dia dyoin, ‘one through two’."],

  // ── Mind & Philosophy ──
  ["mind",1,"solipsism","/ˈsɒlɪpsɪzəm/","n","The view that nothing can be known to exist beyond one’s own mind.","Latin solus (alone) + ipse (self)."],
  ["mind",1,"ennui","/ɒnˈwiː/","n","A weary dissatisfaction that comes of having nothing that seems worth doing.","French, from Latin in odio, ‘it is hateful to me’."],
  ["mind",1,"schadenfreude","/ˈʃɑːdənˌfrɔɪdə/","n","The small pleasure taken in another’s misfortune.","German Schaden (harm) + Freude (joy)."],
  ["mind",1,"sophistry","/ˈsɒfɪstri/","n","Reasoning built to persuade rather than to hold — plausible in form, false in substance.","Greek sophistēs, a teacher of wisdom, turned pejorative by Plato."],
  ["mind",1,"volition","/vəˈlɪʃən/","n","The faculty of choosing and setting oneself in motion; the act of willing.","Latin volo, ‘I wish’."],
  ["mind",2,"epistemology","/ɪˌpɪstɪˈmɒlədʒi/","n","The study of knowledge itself — what it is, where it comes from, how far it reaches.","Greek epistēmē (knowledge) + logos (account)."],
  ["mind",2,"teleology","/ˌtɛliˈɒlədʒi/","n","Explanation by reference to purpose or end rather than to prior cause.","Greek telos, end or goal."],
  ["mind",2,"qualia","/ˈkwɑːliə/","n","The raw felt quality of an experience — the particular redness of red.","Latin qualis, ‘of what kind’."],
  ["mind",2,"akrasia","/əˈkreɪziə/","n","Acting against one’s own better judgement; weakness of will.","Greek akrasia, ‘lacking command’ over oneself."],
  ["mind",2,"reification","/ˌriːɪfɪˈkeɪʃən/","n","Treating an abstraction as though it were a concrete thing with a life of its own.","Latin res (thing) + facere (to make)."],
  ["mind",3,"apperception","/ˌæpəˈsɛpʃən/","n","The mind’s absorption of a new perception into the body of what it already holds.","Latin ad (to) + percipere (to perceive); given technical weight by Leibniz and Kant."],
  ["mind",3,"hermeneutics","/ˌhɜːməˈnjuːtɪks/","n","The theory and practice of interpretation, first of scripture, later of any text or act.","Greek hermēneuein, to interpret."],
  ["mind",3,"phenomenology","/fɪˌnɒmɪˈnɒlədʒi/","n","The study of experience strictly as it presents itself to consciousness, bracketing the question of what lies behind.","Greek phainomenon, ‘that which appears’."],
  ["mind",3,"nominalism","/ˈnɒmɪnəlɪzəm/","n","The doctrine that universals are only names — there is no redness, only red things.","Latin nomen, name."],
  ["mind",3,"aporia","/əˈpɔːriə/","n","The impasse reached when equally good arguments point in opposite directions.","Greek aporia, ‘without passage’."],
  ["mind",4,"hylomorphism","/ˌhaɪləˈmɔːfɪzəm/","n","Aristotle’s doctrine that every substance is matter and form together, neither existing bare.","Greek hylē (matter) + morphē (form)."],
  ["mind",4,"supervenience","/ˌsuːpəˈviːniəns/","n","A dependence in which nothing can differ at the higher level without differing at the lower.","Latin supervenire, to come upon."],
  ["mind",4,"apophatic","/ˌæpəˈfætɪk/","adj","Describing the divine only by negation — saying what it is not, since what it is exceeds speech.","Greek apophasis, denial."],
  ["mind",4,"quiddity","/ˈkwɪdɪti/","n","The essential nature that makes a thing the kind of thing it is — its whatness.","Medieval Latin quidditas, from quid (what)."],
  ["mind",4,"eudaimonia","/ˌjuːdaɪˈməʊniə/","n","Flourishing across a whole life — the highest human good in Aristotle, badly served by ‘happiness’.","Greek eu (well) + daimōn (guiding spirit)."],
  ["mind",5,"haecceity","/hɛkˈsiːɪti/","n","The thisness that makes an individual this one and no other, beyond any property it shares.","Duns Scotus’s Latin haecceitas, from haec (this)."],
  ["mind",5,"anamnesis","/ˌænæmˈniːsɪs/","n","Plato’s doctrine that learning is recollection — the soul recovering what it knew before birth.","Greek anamnēsis, ‘a calling to mind’."],
  ["mind",5,"hypostasis","/haɪˈpɒstəsɪs/","n","The underlying reality standing beneath appearances; in Trinitarian theology, one of the three Persons.","Greek hypostasis, ‘that which stands under’."],
  ["mind",5,"entelechy","/ɛnˈtɛlɪki/","n","In Aristotle, the completed actuality a thing reaches in becoming fully what it was for.","Greek entelecheia, ‘having its end within itself’."],
  ["mind",5,"apocatastasis","/ˌæpəkəˈtæstəsɪs/","n","The restoration of all things to their original state; in Origen, the final reconciliation of every creature.","Greek apokatastasis, re-establishment."],
  // ── Nature & Earth ──
  ["nature",1,"petrichor","/ˈpɛtrɪkɔː/","n","The earthy smell released when rain falls on ground that has been dry a long time.","Greek petra (stone) + ichōr, the fluid said to run in the veins of the gods; coined by two Australian scientists in 1964."],
  ["nature",1,"crepuscular","/krɪˈpʌskjʊlə/","adj","Active at dusk and dawn rather than by day or night.","Latin crepusculum, twilight."],
  ["nature",1,"aestivation","/ˌiːstɪˈveɪʃən/","n","Dormancy through the heat of summer — hibernation’s opposite number.","Latin aestas, summer."],
  ["nature",1,"murmuration","/ˌmɜːmjʊˈreɪʃən/","n","A great wheeling flock of starlings, turning as though it were one body.","Latin murmurare, to murmur — first the sound, then the flock."],
  ["nature",1,"rime","/raɪm/","n","The white ice that grows on cold surfaces when fog freezes as it touches them.","Old English hrīm, frost."],
  ["nature",2,"mycorrhiza","/ˌmaɪkəˈraɪzə/","n","The partnership of fungus and plant root through which water and nutrients are traded underground.","Greek mykēs (fungus) + rhiza (root)."],
  ["nature",2,"karst","/kɑːst/","n","Country of sinkholes, caves and vanishing rivers, formed where water dissolves limestone from within.","German Karst, after the limestone plateau inland of Trieste."],
  ["nature",2,"endemism","/ˈɛndəmɪzəm/","n","The condition of a species occurring naturally in one region and nowhere else on earth.","Greek en (in) + dēmos (people, district)."],
  ["nature",2,"brumation","/bruːˈmeɪʃən/","n","The winter torpor of reptiles — metabolically unlike the hibernation of mammals.","Latin bruma, the winter solstice."],
  ["nature",2,"alluvium","/əˈluːviəm/","n","The silt and gravel a river lays down where its water slows.","Latin alluere, to wash against."],
  ["nature",3,"allelopathy","/əˌliːˈlɒpəθi/","n","Chemical warfare between plants: compounds released to suppress the germination of neighbours.","Greek allēlōn (of one another) + pathos (suffering)."],
  ["nature",3,"anadromous","/əˈnædrəməs/","adj","Migrating up out of the sea into rivers to spawn, as salmon do.","Greek ana (up) + dromos (running)."],
  ["nature",3,"nunatak","/ˈnuːnətæk/","n","A peak of rock standing clear above the surface of an ice sheet.","Greenlandic nunataq."],
  ["nature",3,"sclerophyll","/ˈsklɪərəfɪl/","n","A plant with small, hard, leathery leaves — the standard build for drought and fire country.","Greek sklēros (hard) + phyllon (leaf)."],
  ["nature",3,"thermokarst","/ˈθɜːməʊkɑːst/","n","Pitted, collapsing terrain left where permafrost thaws and the ground settles into the void.","Greek thermē (heat) + karst."],
  ["nature",4,"ecotone","/ˈiːkətəʊn/","n","The tense transitional band where two ecological communities meet and neither quite rules.","Greek oikos (house) + tonos (tension)."],
  ["nature",4,"halophyte","/ˈhæləfaɪt/","n","A plant that lives, and often only thrives, in salt-saturated ground.","Greek hals (salt) + phyton (plant)."],
  ["nature",4,"lek","/lɛk/","n","A patch of ground where males gather season after season to display competitively for mates.","Swedish lek, play."],
  ["nature",4,"aeolian","/iːˈəʊliən/","adj","Shaped, carried or laid down by the wind.","Greek Aiolos, the keeper of the winds."],
  ["nature",4,"vivipary","/vɪˈvɪpəri/","n","Bearing live young; in plants, the germination of a seed while still attached to the parent, as in mangroves.","Latin vivus (alive) + parere (to bring forth)."],
  ["nature",5,"thigmotropism","/θɪɡˈmɒtrəpɪzəm/","n","Growth directed by touch — the tendril that finds a support and coils around it.","Greek thigma (touch) + tropos (a turning)."],
  ["nature",5,"inquiline","/ˈɪŋkwɪlaɪn/","n","An animal that lives inside the nest or gall of another species without preying on it.","Latin inquilinus, a lodger."],
  ["nature",5,"cryoturbation","/ˌkraɪəʊtɜːˈbeɪʃən/","n","The slow churning of soil by repeated freezing and thawing, which sorts stones into rings and stripes.","Greek kryos (frost) + Latin turbare (to disturb)."],
  ["nature",5,"myrmecochory","/ˌmɜːmɪkəˈkɔːri/","n","Seed dispersal by ants, bought with a fatty appendage the seed grows for the purpose.","Greek myrmēx (ant) + chōrein (to spread)."],
  ["nature",5,"pedogenesis","/ˌpiːdəʊˈdʒɛnɪsɪs/","n","The making of soil out of parent rock, climate, organisms and time.","Greek pedon (ground) + genesis; not to be confused with paedogenesis, reproduction by juveniles."],

  // ── Matter & Cosmos ──
  ["matter",1,"sublimation","/ˌsʌblɪˈmeɪʃən/","n","The passage of a solid straight into vapour, skipping the liquid state entirely — dry ice, frost on a cold clear morning.","Latin sublimare, to raise up."],
  ["matter",1,"penumbra","/pɪˈnʌmbrə/","n","The half-shadow at the edge of a shadow, where the light source is only partly hidden.","Latin paene (almost) + umbra (shadow)."],
  ["matter",1,"albedo","/ælˈbiːdəʊ/","n","The fraction of incoming light a surface throws back — fresh snow near one, fresh asphalt near zero.","Latin albus, white."],
  ["matter",1,"effervescence","/ˌɛfəˈvɛsəns/","n","The escape of dissolved gas from a liquid as a stream of bubbles.","Latin effervescere, to boil up."],
  ["matter",1,"parallax","/ˈpærəlæks/","n","The apparent shift of a near object against a far background when the observer moves — the first rung of the distance ladder to the stars.","Greek parallaxis, alteration."],
  ["matter",2,"deliquescence","/ˌdɛlɪˈkwɛsəns/","n","The habit of certain solids of drawing so much water out of the air that they dissolve in it.","Latin deliquescere, to melt away."],
  ["matter",2,"chirality","/kaɪˈrælɪti/","n","The property of a structure that cannot be laid over its own mirror image, as a left hand cannot fit a right glove.","Greek cheir, hand."],
  ["matter",2,"syzygy","/ˈsɪzɪdʒi/","n","The alignment of three bodies in one line — sun, earth and moon at every eclipse.","Greek syzygia, a yoking together."],
  ["matter",2,"allotrope","/ˈælətrəʊp/","n","One of several forms a single element can take by rearranging its atoms — graphite and diamond are both carbon.","Greek allos (other) + tropos (manner)."],
  ["matter",2,"hysteresis","/ˌhɪstəˈriːsɪs/","n","The lag of an effect behind its cause, so that a system’s present state depends on the path it took to get there.","Greek hysterēsis, a shortcoming or coming late."],
  ["matter",3,"enthalpy","/ɛnˈθælpi/","n","The heat content of a system at constant pressure — the bookkeeping quantity for whether a reaction gives out warmth or takes it in.","Greek enthalpein, to warm within."],
  ["matter",3,"eutectic","/juːˈtɛktɪk/","adj","Of the mixture whose melting point is the lowest any proportion of those components can reach — the reason solder melts below either metal.","Greek eutēktos, easily melted."],
  ["matter",3,"birefringence","/ˌbaɪrɪˈfrɪndʒəns/","n","The splitting of a light ray into two by a material whose refractive index depends on direction — why calcite doubles the print beneath it.","Latin bis (twice) + refringere (to break up)."],
  ["matter",3,"azeotrope","/əˈziːətrəʊp/","n","A mixture whose vapour has exactly the composition of its liquid, so distillation can concentrate it no further.","Greek a- (not) + zein (to boil) + tropos (change)."],
  ["matter",3,"libration","/laɪˈbreɪʃən/","n","The slow rocking of the moon in its orbit that lets us see a little around each limb — about 59% of the surface in all.","Latin librare, to balance."],
  ["matter",4,"thixotropy","/θɪkˈsɒtrəpi/","n","The property of a gel that thins while it is stirred and stiffens again once left alone — ketchup, drilling mud, non-drip paint.","Greek thixis (a touching) + tropē (a turning)."],
  ["matter",4,"enantiomer","/ɪˈnæntiəmə/","n","Either member of a pair of molecules that are mirror images of one another and cannot be superposed.","Greek enantios (opposite) + meros (part)."],
  ["matter",4,"sonoluminescence","/ˌsɒnəʊluːmɪˈnɛsəns/","n","The flash of light given off by a bubble in a liquid when sound waves collapse it.","Latin sonus (sound) + lumen (light)."],
  ["matter",4,"baryogenesis","/ˌbæriəʊˈdʒɛnɪsɪs/","n","The unsettled process in the early universe that left slightly more matter than antimatter — and so left anything at all.","Greek barys (heavy) + genesis."],
  ["matter",4,"fugacity","/fjuːˈɡæsɪti/","n","The effective pressure of a real gas, corrected so it can be slotted into equations written for an ideal one.","Latin fugere, to flee."],
  ["matter",5,"spallation","/spɔːˈleɪʃən/","n","The knocking of fragments out of a material by an energetic particle — the mechanism behind neutron sources and cosmic-ray damage.","From spall, a chip struck off stone."],
  ["matter",5,"antiferromagnetism","/ˌæntiˌfɛrəʊˈmæɡnɪtɪzəm/","n","An ordering in which neighbouring atomic moments point in opposite directions and cancel, leaving no net magnetism.","Greek anti (against) + Latin ferrum (iron) + magnetism."],
  ["matter",5,"mesophase","/ˈmɛzəʊfeɪz/","n","A state of matter caught between crystal and liquid — ordered in some directions, fluid in others, as in liquid crystals.","Greek mesos (middle) + phase."],
  ["matter",5,"clathrate","/ˈklæθreɪt/","n","A compound in which one kind of molecule sits caged inside the crystal lattice of another — methane locked in ice on the sea floor.","Latin clathratus, furnished with a lattice."],
  ["matter",5,"phonon","/ˈfəʊnɒn/","n","The quantum of vibration in a crystal lattice, treated as a particle because it carries energy and momentum like one.","Greek phōnē (sound), on the pattern of photon."],
  // ── Body & Medicine ──
  ["body",1,"anhedonia","/ˌænhɪˈdəʊniə/","n","The loss of the capacity to take pleasure in things that once gave it.","Greek an- (without) + hēdonē (pleasure)."],
  ["body",1,"proprioception","/ˌprəʊpriəˈsɛpʃən/","n","The sense that tells you where your limbs are without your having to look.","Latin proprius (one’s own) + capere (to take)."],
  ["body",1,"borborygmus","/ˌbɔːbəˈrɪɡməs/","n","The rumbling made by gas and fluid moving through the intestines.","Greek borborygmos, an imitation of the sound itself."],
  ["body",1,"presbyopia","/ˌprɛzbiˈəʊpiə/","n","The age-related stiffening of the lens that pushes the newspaper steadily further from the face.","Greek presbys (old man) + ōps (eye)."],
  ["body",1,"epistaxis","/ˌɛpɪˈstæksɪs/","n","Bleeding from the nose.","Greek epistazein, to bleed from the nose, from stazein (to drip)."],
  ["body",2,"nociception","/ˌnəʊsɪˈsɛpʃən/","n","The nervous system’s detection of damaging stimuli — the signalling, which is not yet the felt pain.","Latin nocere (to harm) + capere (to take)."],
  ["body",2,"petechia","/pɪˈtiːkiə/","n","A pinpoint spot of bleeding under the skin that does not blanch under pressure.","Italian petecchia, a small spot."],
  ["body",2,"interoception","/ˌɪntərəˈsɛpʃən/","n","The sense of the body’s own internal state — heartbeat, breath, hunger, the need to move.","Latin interus (inward) + capere (to take)."],
  ["body",2,"peristalsis","/ˌpɛrɪˈstælsɪs/","n","The travelling wave of muscular contraction that pushes contents along the gut.","Greek peri (around) + stalsis (constriction)."],
  ["body",2,"apnoea","/æpˈniːə/","n","A temporary halt in breathing, most often noticed during sleep.","Greek a- (without) + pnoiē (breath)."],
  ["body",3,"akathisia","/ˌækəˈθɪziə/","n","A distressing inner restlessness that makes staying still intolerable, often a drug side effect.","Greek a- (not) + kathizein (to sit)."],
  ["body",3,"anosognosia","/ˌænɒsɒɡˈnəʊziə/","n","A patient’s genuine unawareness of their own deficit — denying a paralysed limb is paralysed.","Greek a- (without) + nosos (disease) + gnōsis (knowledge)."],
  ["body",3,"allodynia","/ˌæləʊˈdɪniə/","n","Pain produced by something that should not hurt at all, such as the weight of a bedsheet.","Greek allos (other) + odynē (pain)."],
  ["body",3,"dysgeusia","/dɪsˈɡjuːziə/","n","A persistent distortion of taste, often metallic, that overlays whatever is eaten.","Greek dys- (bad) + geusis (taste)."],
  ["body",3,"hemianopia","/ˌhɛmiəˈnəʊpiə/","n","Blindness in half the visual field of each eye, usually from damage behind the eyes rather than in them.","Greek hēmi (half) + an- (without) + ōps (sight)."],
  ["body",4,"prosopagnosia","/ˌprɒsəpæɡˈnəʊziə/","n","The inability to recognise faces, including familiar ones, with vision otherwise intact.","Greek prosōpon (face) + agnōsia (not knowing)."],
  ["body",4,"synkinesis","/ˌsɪŋkɪˈniːsɪs/","n","Involuntary movement in one part of the body accompanying a voluntary movement in another — the eye closing as the mouth smiles.","Greek syn (together) + kinēsis (movement)."],
  ["body",4,"apraxia","/əˈpræksiə/","n","The loss of the ability to carry out a learned movement on request, though strength, sensation and comprehension are unimpaired.","Greek a- (without) + praxis (action)."],
  ["body",4,"hypnagogia","/ˌhɪpnəˈɡəʊdʒiə/","n","The threshold state between waking and sleep, with its own drifting imagery and jerks.","Greek hypnos (sleep) + agōgos (leading)."],
  ["body",4,"formication","/ˌfɔːmɪˈkeɪʃən/","n","The sensation of insects crawling over or under the skin, with nothing there.","Latin formica, ant."],
  ["body",5,"anosodiaphoria","/ˌænəʊsəʊdaɪəˈfɔːriə/","n","Acknowledging a serious deficit but remaining strangely indifferent to it — one step past anosognosia.","Greek a- (without) + nosos (disease) + diaphora (difference, concern)."],
  ["body",5,"micropsia","/maɪˈkrɒpsiə/","n","A perceptual distortion in which objects appear smaller and further off than they are.","Greek mikros (small) + opsis (sight)."],
  ["body",5,"palinopsia","/ˌpælɪˈnɒpsiə/","n","The persistence or return of a visual image after the object itself has gone from view.","Greek palin (again) + opsis (sight)."],
  ["body",5,"dysdiadochokinesia","/dɪsˌdaɪədəʊkəʊkɪˈniːziə/","n","The inability to perform rapid alternating movements smoothly — a classic sign of cerebellar damage.","Greek dys- (bad) + diadochos (succeeding) + kinēsis (movement)."],
  ["body",5,"asterixis","/ˌæstəˈrɪksɪs/","n","The abrupt loss and recovery of posture that makes an outstretched hand flap — a sign of metabolic encephalopathy.","Greek a- (without) + stērixis (fixed position)."],

  // ── Arts & Craft ──
  ["arts",1,"chiaroscuro","/kiˌɑːrəˈskʊərəʊ/","n","The modelling of form through strong contrast of light and dark.","Italian chiaro (light) + oscuro (dark)."],

  // ── Nature & Terre ──
  ["nature",1,"pétrichor","/petʁikɔʁ/","nm","Odeur de terre que libère la pluie tombant sur un sol longtemps sec.","Du grec petra (pierre) + ichōr, le fluide qui coulait dans les veines des dieux ; mot forgé en 1964."],
  ["nature",1,"crépusculaire","/kʁepyskylɛʁ/","adj","Qui vit et chasse à la tombée du jour, plutôt qu’en plein jour ou en pleine nuit.","Du latin crepusculum, « demi-jour »."],
  ["nature",1,"estivation","/ɛstivasjɔ̃/","nf","Engourdissement par lequel certains animaux traversent l’été, comme d’autres traversent l’hiver.","Du latin aestas, « été »."],
  ["nature",1,"frimas","/fʁima/","nm","Brouillard froid qui se dépose en givre sur tout ce qu’il touche.","De l’ancien français frim, « gelée blanche »."],
  ["nature",1,"résurgence","/ʁezyʁʒɑ̃s/","nf","Réapparition à l’air libre d’une rivière qui s’était perdue sous la roche.","Du latin resurgere, « se relever »."],
  ["nature",2,"mycorhize","/mikɔʁiz/","nf","Association d’un champignon et d’une racine, par laquelle les deux échangent eau et nourriture.","Du grec mykēs (champignon) + rhiza (racine)."],
  ["nature",2,"karst","/kaʁst/","nm","Relief de gouffres et de rivières souterraines, creusé par l’eau dans le calcaire.","De l’allemand Karst, le plateau calcaire de l’arrière-pays de Trieste."],
  ["nature",2,"endémisme","/ɑ̃demism/","nm","Fait pour une espèce de n’exister naturellement que sur un seul territoire.","Du grec en (dans) + dēmos (peuple, contrée)."],
  ["nature",2,"alluvion","/alyvjɔ̃/","nf","Dépôt de sable et de limon laissé par un cours d’eau là où il ralentit.","Du latin alluvio, « débordement »."],
  ["nature",2,"anadrome","/anadʁɔm/","adj","Se dit d’un poisson qui remonte les fleuves depuis la mer pour frayer.","Du grec ana (en remontant) + dromos (course)."],
  ["nature",3,"allélopathie","/alelɔpati/","nf","Guerre chimique entre plantes : les substances que l’une libère empêchent les voisines de germer.","Du grec allēlōn (les uns les autres) + pathos (souffrance)."],
  ["nature",3,"sclérophylle","/sklerɔfil/","adj","Se dit d’une plante aux feuilles petites, dures et coriaces, taillées pour la sécheresse et le feu.","Du grec sklēros (dur) + phyllon (feuille)."],
  ["nature",3,"nunatak","/nynatak/","nm","Sommet rocheux qui perce la surface d’une calotte glaciaire.","De l’inuit du Groenland nunataq."],
  ["nature",3,"halophyte","/alɔfit/","nf","Plante qui vit, et souvent ne prospère que, dans les sols saturés de sel.","Du grec hals (sel) + phyton (plante)."],
  ["nature",3,"écotone","/ekɔtɔn/","nm","Bande de transition où deux milieux se rencontrent sans que l’un l’emporte tout à fait.","Du grec oikos (maison) + tonos (tension)."],
  ["nature",4,"thermokarst","/tɛʁmokaʁst/","nm","Terrain bosselé qui s’affaisse là où le pergélisol dégèle et où le sol se referme sur le vide.","Du grec thermē (chaleur) + karst."],
  ["nature",4,"éolien","/eɔljɛ̃/","adj","Façonné, transporté ou déposé par le vent.","D’Éole, gardien des vents."],
  ["nature",4,"inquilin","/ɛ̃kilɛ̃/","nm","Animal qui loge dans le nid ou la galle d’une autre espèce sans la dévorer.","Du latin inquilinus, « locataire »."],
  ["nature",4,"cryoturbation","/kʁijotyʁbasjɔ̃/","nf","Brassage du sol par les gels et dégels répétés, qui finit par trier les pierres en cercles et en bandes.","Du grec kryos (froid) + latin turbare (agiter)."],
  ["nature",4,"vivipare","/vivipaʁ/","adj","Qui met au monde des petits déjà formés ; chez les plantes, dont la graine germe encore attachée au pied.","Du latin vivus (vivant) + parere (enfanter)."],
  ["nature",5,"myrmécochorie","/miʁmekɔkɔʁi/","nf","Dissémination des graines par les fourmis, payée d’un appendice gras que la graine fabrique pour cela.","Du grec myrmēx (fourmi) + chōrein (se répandre)."],
  ["nature",5,"thigmotropisme","/tigmɔtʁɔpism/","nm","Croissance orientée par le toucher : la vrille qui rencontre un appui et s’y enroule.","Du grec thigma (contact) + tropos (tour)."],
  ["nature",5,"pédogenèse","/pedɔʒənɛz/","nf","Formation du sol à partir de la roche mère, du climat, du vivant et du temps.","Du grec pedon (sol) + genesis ; à ne pas confondre avec la reproduction par des larves, qui porte le même nom."],
  ["nature",5,"saprophage","/sapʁɔfaʒ/","adj","Qui se nourrit de matière organique en décomposition.","Du grec sapros (pourri) + phagein (manger)."],
  ["nature",5,"lithophyte","/litɔfit/","nf","Plante qui pousse à même la roche nue, sans sol pour la porter.","Du grec lithos (pierre) + phyton (plante)."],

  // ── Matière & Cosmos ──
  ["matter",1,"sublimation","/syblimasjɔ̃/","nf","Passage direct d’un solide à l’état de vapeur, sans étape liquide — la neige carbonique, le givre par un matin clair.","Du latin sublimare, « élever »."],
  ["matter",1,"pénombre","/penɔ̃bʁ/","nf","Zone de demi-ombre, là où la source de lumière n’est masquée qu’en partie.","Du latin paene (presque) + umbra (ombre)."],
  ["matter",1,"albédo","/albedo/","nm","Part de la lumière qu’une surface renvoie : proche de un pour la neige fraîche, de zéro pour l’asphalte.","Du latin albus, « blanc »."],
  ["matter",1,"parallaxe","/paʁalaks/","nf","Déplacement apparent d’un objet proche sur le fond du ciel quand l’observateur se déplace — le premier barreau de l’échelle des distances.","Du grec parallaxis, « changement »."],
  ["matter",1,"effervescence","/efɛʁvesɑ̃s/","nf","Échappement en bulles d’un gaz dissous dans un liquide.","Du latin effervescere, « entrer en ébullition »."],
  ["matter",2,"déliquescence","/delikesɑ̃s/","nf","Propriété d’un solide qui prend tant d’eau à l’air ambiant qu’il finit par s’y dissoudre.","Du latin deliquescere, « fondre »."],
  ["matter",2,"chiralité","/kiʁalite/","nf","Propriété d’une structure qu’on ne peut superposer à son image dans un miroir, comme la main gauche au gant droit.","Du grec cheir, « main »."],
  ["matter",2,"syzygie","/siziʒi/","nf","Alignement de trois corps célestes sur une même droite, comme à chaque éclipse.","Du grec syzygia, « attelage »."],
  ["matter",2,"allotropie","/alɔtʁɔpi/","nf","Faculté d’un même élément de prendre plusieurs formes : le graphite et le diamant sont tous deux du carbone.","Du grec allos (autre) + tropos (manière)."],
  ["matter",2,"hystérésis","/isteʁezis/","nf","Retard d’un effet sur sa cause, qui fait dépendre l’état d’un système du chemin qu’il a parcouru.","Du grec hysterēsis, « retard »."],
  ["matter",3,"enthalpie","/ɑ̃talpi/","nf","Contenu de chaleur d’un système à pression constante — la grandeur qui dit si une réaction donne de la chaleur ou en prend.","Du grec enthalpein, « échauffer »."],
  ["matter",3,"eutectique","/øtɛktik/","adj","Se dit du mélange dont le point de fusion est le plus bas que ces composants puissent atteindre — d’où la soudure qui fond sous ses deux métaux.","Du grec eutēktos, « qui fond aisément »."],
  ["matter",3,"biréfringence","/biʁefʁɛ̃ʒɑ̃s/","nf","Dédoublement d’un rayon lumineux par un milieu dont l’indice dépend de la direction : la calcite double le texte posé dessous.","Du latin bis (deux fois) + refringere (briser)."],
  ["matter",3,"azéotrope","/azeɔtʁɔp/","nm","Mélange dont la vapeur a exactement la composition du liquide, si bien que la distillation n’y peut plus rien.","Du grec a- (sans) + zein (bouillir) + tropos (changement)."],
  ["matter",3,"libration","/libʁasjɔ̃/","nf","Balancement lent de la Lune sur son orbite, qui laisse voir un peu plus que sa moitié.","Du latin librare, « balancer »."],
  ["matter",4,"thixotropie","/tiksɔtʁɔpi/","nf","Propriété d’un gel qui se liquéfie tant qu’on l’agite et reprend dès qu’on le laisse : le ketchup, la boue de forage, la peinture sans coulure.","Du grec thixis (contact) + tropē (tour)."],
  ["matter",4,"énantiomère","/enɑ̃tjɔmɛʁ/","nm","Chacune de deux molécules images l’une de l’autre dans un miroir et non superposables.","Du grec enantios (opposé) + meros (partie)."],
  ["matter",4,"fugacité","/fygasite/","nf","Pression corrigée d’un gaz réel, pour qu’il entre dans les équations écrites pour le gaz parfait.","Du latin fugere, « fuir »."],
  ["matter",4,"sonoluminescence","/sonolyminesɑ̃s/","nf","Éclair de lumière émis par une bulle qu’une onde sonore fait s’effondrer dans un liquide.","Du latin sonus (son) + lumen (lumière)."],
  ["matter",4,"clathrate","/klatʁat/","nm","Composé où une molécule se trouve emprisonnée dans la cage cristalline d’une autre : le méthane pris dans la glace des fonds marins.","Du latin clathratus, « grillagé »."],
  ["matter",5,"spallation","/spalasjɔ̃/","nf","Arrachement d’éclats à un matériau frappé par une particule très énergétique.","De l’anglais spall, « éclat de pierre »."],
  ["matter",5,"antiferromagnétisme","/ɑ̃tifeʁomaɲetism/","nm","Ordre où les moments magnétiques voisins pointent en sens contraire et s’annulent, ne laissant aucune aimantation.","De anti + latin ferrum (fer) + magnétisme."],
  ["matter",5,"phonon","/fɔnɔ̃/","nm","Quantum de vibration d’un réseau cristallin, traité comme une particule parce qu’il en transporte l’énergie.","Du grec phōnē (son), sur le modèle de photon."],
  ["matter",5,"mésophase","/mezofaz/","nf","État de la matière entre le cristal et le liquide : ordonné dans certaines directions, fluide dans les autres, comme les cristaux liquides.","Du grec mesos (milieu) + phase."],
  ["matter",5,"baryogenèse","/baʁjoʒənɛz/","nf","Processus mal élucidé qui, dans l’univers primitif, laissa un peu plus de matière que d’antimatière — et donc quelque chose plutôt que rien.","Du grec barys (lourd) + genesis."],

  // ── Corps & Médecine ──
  ["body",1,"anhédonie","/anedɔni/","nf","Perte de la capacité d’éprouver du plaisir à ce qui en donnait.","Du grec an- (sans) + hēdonē (plaisir)."],
  ["body",1,"proprioception","/pʁɔpʁijɔsɛpsjɔ̃/","nf","Sens qui renseigne sur la position des membres sans qu’on ait à les regarder.","Du latin proprius (propre) + capere (prendre)."],
  ["body",1,"borborygme","/bɔʁbɔʁigm/","nm","Gargouillement des gaz et des liquides qui circulent dans l’intestin.","Du grec borborygmos, mot qui imite le bruit lui-même."],
  ["body",1,"presbytie","/pʁɛsbisi/","nf","Durcissement du cristallin avec l’âge, qui éloigne peu à peu le journal du visage.","Du grec presbys, « vieillard »."],
  ["body",1,"épistaxis","/epistaksis/","nf","Saignement de nez.","Du grec epistazein, « couler goutte à goutte »."],
  ["body",2,"nociception","/nɔsisɛpsjɔ̃/","nf","Détection par le système nerveux des stimulus qui abîment les tissus — le signal, qui n’est pas encore la douleur ressentie.","Du latin nocere (nuire) + capere (prendre)."],
  ["body",2,"intéroception","/ɛ̃teʁɔsɛpsjɔ̃/","nf","Sens de l’état intérieur du corps : la faim, le souffle, le battement du cœur, le besoin de bouger.","Du latin interus, « au-dedans »."],
  ["body",2,"péristaltisme","/peʁistaltism/","nm","Onde de contraction musculaire qui pousse le contenu le long du tube digestif.","Du grec peri (autour) + stalsis (resserrement)."],
  ["body",2,"pétéchie","/petesi/","nf","Petite tache de sang sous la peau, qui ne s’efface pas quand on appuie dessus.","De l’italien petecchia, « petite tache »."],
  ["body",2,"apnée","/apne/","nf","Arrêt momentané de la respiration, le plus souvent remarqué pendant le sommeil.","Du grec a- (sans) + pnoiē (souffle)."],
  ["body",3,"akathisie","/akatizi/","nf","Impatience intérieure qui rend insupportable de rester en place, souvent provoquée par un médicament.","Du grec a- (ne pas) + kathizein (s’asseoir)."],
  ["body",3,"anosognosie","/anɔzɔɡnɔzi/","nf","Méconnaissance par le malade de son propre trouble : nier qu’un membre soit paralysé.","Du grec a- (sans) + nosos (maladie) + gnōsis (connaissance)."],
  ["body",3,"allodynie","/alɔdini/","nf","Douleur déclenchée par ce qui ne devrait pas faire mal, comme le poids d’un drap.","Du grec allos (autre) + odynē (douleur)."],
  ["body",3,"dysgueusie","/disɡøzi/","nf","Altération durable du goût, souvent métallique, qui recouvre tout ce qu’on mange.","Du grec dys- (mauvais) + geusis (goût)."],
  ["body",3,"hémianopsie","/emjanɔpsi/","nf","Perte de la moitié du champ visuel de chaque œil, par lésion située en arrière des yeux.","Du grec hēmi (demi) + an- (sans) + ōps (vue)."],
  ["body",4,"prosopagnosie","/pʁɔzɔpaɡnɔzi/","nf","Incapacité de reconnaître les visages, même familiers, la vue étant par ailleurs intacte.","Du grec prosōpon (visage) + agnōsia (non-connaissance)."],
  ["body",4,"apraxie","/apʁaksi/","nf","Perte de la capacité d’exécuter sur commande un geste appris, sans déficit de force ni de compréhension.","Du grec a- (sans) + praxis (action)."],
  ["body",4,"syncinésie","/sɛ̃sinezi/","nf","Mouvement involontaire d’une partie du corps accompagnant le mouvement voulu d’une autre : l’œil qui se ferme quand la bouche sourit.","Du grec syn (avec) + kinēsis (mouvement)."],
  ["body",4,"formication","/fɔʁmikasjɔ̃/","nf","Sensation de fourmis courant sur la peau ou dessous, sans que rien n’y soit.","Du latin formica, « fourmi »."],
  ["body",4,"hypnagogie","/ipnaɡɔʒi/","nf","État de seuil entre la veille et le sommeil, avec ses images flottantes et ses sursauts.","Du grec hypnos (sommeil) + agōgos (qui conduit)."],
  ["body",5,"astérixis","/asteʁiksis/","nm","Chute brusque du tonus qui fait battre la main tendue — signe d’encéphalopathie métabolique.","Du grec a- (sans) + stērixis (position fixe)."],
  ["body",5,"palinopsie","/palinɔpsi/","nf","Persistance ou retour d’une image après que l’objet a disparu du champ.","Du grec palin (de nouveau) + opsis (vue)."],
  ["body",5,"micropsie","/mikʁɔpsi/","nf","Trouble de la perception où les objets paraissent plus petits et plus lointains qu’ils ne sont.","Du grec mikros (petit) + opsis (vue)."],
  ["body",5,"anosodiaphorie","/anozodjafɔʁi/","nf","Indifférence à un trouble grave qu’on reconnaît pourtant — un pas au-delà de l’anosognosie.","Du grec a- (sans) + nosos (maladie) + diaphora (souci)."],
  ["body",5,"dysdiadococinésie","/disdjadɔkosinezi/","nf","Impossibilité d’enchaîner des mouvements alternés rapides, signe classique d’une atteinte du cervelet.","Du grec dys- (mal) + diadochos (qui succède) + kinēsis (mouvement)."],

  // ── Arts & Métiers ──
  ["arts",1,"clair-obscur","/klɛʁɔpskyʁ/","nm","Modelé obtenu par le heurt de la lumière et de l’ombre.","Calque de l’italien chiaroscuro, de chiaro (clair) et oscuro (sombre)."],
  ["arts",1,"leitmotiv","/lɛtmɔtiv/","nm","Courte phrase musicale attachée à un personnage ou à une idée, et qui revient avec lui.","De l’allemand Leitmotiv, « motif conducteur »."],
  ["arts",1,"repentir","/ʁəpɑ̃tiʁ/","nm","Trace d’une première version qui reparaît sous la peinture à mesure que les couches s’amincissent.","Du sens ordinaire du mot : le changement d’avis du peintre, rendu visible par le temps."],
  ["arts",1,"empâtement","/ɑ̃pɑtmɑ̃/","nm","Pâte posée assez épaisse pour garder le relief de la brosse.","De pâte — le mot nomme la matière autant que le geste qui la dépose."],
  ["arts",1,"patine","/patin/","nf","Pellicule que l’âge et la main déposent sur le bronze, le bois ou le cuir, et qu’on se garde de nettoyer.","De l’italien patina, « enduit »."],
  ["arts",2,"sfumato","/sfumato/","nm","Fondu si progressif des valeurs qu’aucun contour ne se laisse trouver.","De l’italien sfumare, « s’évanouir en fumée »."],
  ["arts",2,"ostinato","/ɔstinato/","nm","Bref motif répété sans relâche sous ce qui change au-dessus.","De l’italien ostinato, « obstiné »."],
  ["arts",2,"grisaille","/ɡʁizaj/","nf","Peinture exécutée dans les seuls tons de gris, pour préparer une couleur ou pour imiter la sculpture.","De gris ; le mot a d’abord nommé la couleur, puis la manière tout entière."],
  ["arts",2,"tessiture","/tesityʁ/","nf","Portion de l’étendue où une voix se tient le plus aisément, distincte des extrêmes qu’elle peut atteindre.","De l’italien tessitura, « texture »."],
  ["arts",2,"repoussé","/ʁəpuse/","nm","Métal mis en relief à coups de marteau donnés depuis l’envers.","De repousser."],
  ["arts",3,"contrapposto","/kɔ̃tʁaposto/","nm","Attitude où le poids porte sur une seule jambe, opposant l’inclinaison des hanches à celle des épaules.","De l’italien contrapposto, « mis en opposition »."],
  ["arts",3,"mélisme","/melism/","nm","Groupe de notes chantées sur une seule syllabe.","Du grec melisma, « chant »."],
  ["arts",3,"craquelure","/kʁaklyʁ/","nf","Fin réseau de fentes qui gagne une surface peinte en vieillissant, et dont le dessin aide à la dater.","De craqueler."],
  ["arts",3,"ekphrasis","/ɛkfʁazis/","nf","Description d’une œuvre plastique assez vive pour valoir œuvre à son tour — le bouclier d’Achille.","Du grec ekphrasis, « exposition »."],
  ["arts",3,"entasis","/ɑ̃tazis/","nf","Léger renflement donné au fût d’une colonne pour corriger l’œil, qui verrait creux un profil parfaitement droit.","Du grec entasis, « tension »."],
  ["arts",4,"ténébrisme","/tenebʁism/","nm","Manière où l’ombre occupe le tableau et la lumière ne tombe violemment que sur quelques passages.","Du latin tenebrae, « ténèbres »."],
  ["arts",4,"hémiole","/emjɔl/","nf","Déplacement rythmique qui loge trois temps dans la durée de deux, ou l’inverse.","Du grec hēmiolios, « un et demi »."],
  ["arts",4,"mordant","/mɔʁdɑ̃/","nm","Ornement où la note est mordue par une alternance rapide avec sa voisine.","De mordre, d’après l’italien mordente."],
  ["arts",4,"sprezzatura","/spʁɛdzatuʁa/","nf","Négligence étudiée qui fait paraître aisé ce qui a coûté.","Forgé par Castiglione dans Le Livre du courtisan, 1528."],
  ["arts",4,"anastylose","/anastiloz/","nf","Relèvement d’une ruine avec ses propres éléments tombés, tout ajout restant reconnaissable.","Du grec ana (de nouveau) + stylos (colonne)."],
  ["arts",5,"isocéphalie","/izosefali/","nf","Convention qui aligne toutes les têtes à la même hauteur, quelle que soit la posture des figures.","Du grec isos (égal) + kephalē (tête)."],
  ["arts",5,"cangiante","/kandʒɑ̃te/","nm","Mode de peinture où une couleur change de teinte, et non seulement de valeur, en passant dans l’ombre.","De l’italien cangiante, « changeant »."],
  ["arts",5,"repoussoir","/ʁəpuswaʁ/","nm","Figure ou masse placée au premier plan sur un côté, pour renvoyer le regard vers le fond.","De repousser."],
  ["arts",5,"prolation","/pʁɔlasjɔ̃/","nf","Dans la notation mesurée, division de la semi-brève en deux ou en trois minimes.","Du latin prolatio, « extension »."],
  ["arts",5,"glacis","/ɡlasi/","nm","Couche de couleur transparente passée sur une couche sèche pour en modifier le ton sans le couvrir.","De glacer."],

  // ── Société & Droit ──
  ["society",1,"usufruit","/yzyfʁɥi/","nm","Droit d’user d’un bien d’autrui et d’en percevoir les fruits, à charge de le rendre intact.","Du latin usus (usage) + fructus (jouissance)."],
  ["society",1,"interrègne","/ɛ̃tɛʁʁɛɲ/","nm","Intervalle entre deux règnes ou deux gouvernements, où l’autorité reste suspendue.","Du latin inter (entre) + regnum (règne)."],
  ["society",1,"sinécure","/sinekyʁ/","nf","Charge qui rapporte sans presque rien exiger.","Du latin sine cura, « sans souci » — d’abord un bénéfice sans charge d’âmes."],
  ["society",1,"hégémonie","/eʒemɔni/","nf","Domination qui s’exerce autant par le consentement que par la force.","Du grec hēgemonia, « commandement »."],
  ["society",1,"plébiscite","/plebisit/","nm","Vote direct de tout le corps électoral sur une seule question, souvent sur la souveraineté elle-même.","Du latin plebs (peuple) + scitum (décret)."],
  ["society",2,"corvée","/kɔʁve/","nf","Travail non payé dû par le tenancier à son seigneur ou à l’État : des journées de route au lieu d’argent.","Du latin corrogare, « requérir »."],
  ["society",2,"affranchissement","/afʁɑ̃ʃismɑ̃/","nm","Acte par lequel un maître rendait la liberté à son esclave.","De franc, « libre »."],
  ["society",2,"irrédentisme","/iʁedɑ̃tism/","nm","Revendication par un État de terres tenues par un autre, au nom de la langue, de l’histoire ou du sang.","De l’italien Italia irredenta, « Italie non rachetée »."],
  ["society",2,"subsidiarité","/sybsidjaʁite/","nf","Principe voulant que la décision revienne au plus petit échelon capable de la prendre.","Du latin subsidium, « réserve, secours »."],
  ["society",2,"alleu","/alø/","nm","Terre possédée en pleine propriété, sans redevance ni service dus à aucun seigneur.","Du francique al-ôd, « bien complet »."],
  ["society",3,"autochtone","/otɔktɔn/","adj","Issu du sol même où on le trouve, sans récit d’arrivée.","Du grec autos (soi-même) + chthōn (terre)."],
  ["society",3,"prébende","/pʁebɑ̃d/","nf","Revenu attaché à une stalle de chanoine et tiré d’un domaine réservé à cet office.","Du latin praebenda, « ce qui doit être fourni »."],
  ["society",3,"amphictyonie","/ɑ̃fiktjɔni/","nf","Ligue de cités voisines unies par la garde commune d’un sanctuaire.","Du grec amphiktyones, « ceux qui habitent alentour »."],
  ["society",3,"mainmorte","/mɛ̃mɔʁt/","nf","Condition des biens détenus par une communauté qui ne meurt pas, et qui échappent donc aux successions.","De main et morte."],
  ["society",3,"tontine","/tɔ̃tin/","nf","Association où les parts des membres qui meurent viennent grossir celles des survivants.","De Lorenzo Tonti, banquier napolitain qui l’imagina au XVIIe siècle."],
  ["society",4,"apanage","/apanaʒ/","nm","Terres ou revenus assignés aux cadets d’un souverain pour qu’ils vivent sans régner.","De l’ancien français apaner, du latin ad panem, « pour le pain »."],
  ["society",4,"wergeld","/vɛʁɡɛld/","nm","Prix mis sur la vie d’un homme dans les droits germaniques, versé à sa parenté pour éteindre la vengeance.","Du vieux haut allemand wer (homme) + geld (paiement)."],
  ["society",4,"synœcisme","/sinesism/","nm","Réunion de plusieurs villages en une seule cité, en droit sinon toujours en fait.","Du grec synoikismos, « habitation commune »."],
  ["society",4,"ultra vires","/yltʁa viʁɛs/","phr","Au-delà des pouvoirs de l’organe qui a agi, et nul pour ce seul motif.","Du latin, « au-delà des forces »."],
  ["society",4,"latifundium","/latifɔ̃djɔm/","nm","Très grand domaine exploité par une main-d’œuvre dépendante, dont l’extension vida la petite paysannerie romaine.","Du latin latus (large) + fundus (domaine)."],
  ["society",5,"anacyclose","/anasikloz/","nf","Cycle des constitutions selon Polybe : la monarchie tourne en tyrannie, l’aristocratie en oligarchie, la démocratie en règne de la foule, et l’on recommence.","Du grec anakyklōsis, « retour périodique »."],
  ["society",5,"proskynèse","/pʁɔskinɛz/","nf","Prosternation rituelle devant un supérieur — usage perse dont Alexandre scandalisa ses Macédoniens en l’exigeant.","Du grec proskynēsis, « baiser vers »."],
  ["society",5,"déshérence","/dezeʁɑ̃s/","nf","État d’une succession que nul héritier ne réclame et qui revient à l’État.","De l’ancien français deseriter, « déshériter »."],
  ["society",5,"champart","/ʃɑ̃paʁ/","nm","Redevance seigneuriale prélevée en nature sur une part de la récolte, dans le champ même.","De champ et part."],
  ["society",5,"vidamé","/vidame/","nm","Dignité du vidame, laïc qui tenait le temporel d’un évêché et en portait les armes.","Du latin vice dominus, « à la place du seigneur »."],

  // ── Nombre & Systèmes ──
  ["systems",1,"heuristique","/øʁistik/","nf","Règle empirique qui donne vite une réponse acceptable, sans garantir la meilleure.","Du grec heuriskein, « trouver »."],
  ["systems",1,"asymptote","/asɛ̃ptɔt/","nf","Droite dont une courbe s’approche indéfiniment sans jamais l’atteindre.","Du grec asymptōtos, « qui ne coïncide pas »."],
  ["systems",1,"tautologie","/totɔlɔʒi/","nf","Proposition vraie par sa seule forme, et qui n’apprend donc rien du monde.","Du grec tauto (le même) + logos (discours)."],
  ["systems",1,"idempotent","/idɑ̃pɔtɑ̃/","adj","Qui donne le même résultat qu’on l’applique une fois ou cent — la propriété qui rend une reprise sans danger.","Du latin idem (même) + potens (puissant)."],
  ["systems",1,"récursivité","/ʁekyʁsivite/","nf","Définition ou procédure qui s’appelle elle-même sur un cas plus petit, jusqu’à un cas qu’on sait résoudre d’emblée.","Du latin recurrere, « revenir en courant »."],
  ["systems",2,"monotone","/mɔnɔtɔn/","adj","Qui varie dans un seul sens et ne revient jamais en arrière.","Du grec monos (seul) + tonos (ton, tension)."],
  ["systems",2,"orthogonal","/ɔʁtɔɡɔnal/","adj","À angle droit ; par extension, qui varie tout à fait indépendamment.","Du grec orthos (droit) + gōnia (angle)."],
  ["systems",2,"cardinalité","/kaʁdinalite/","nf","Taille d’un ensemble, définie par appariement plutôt que par comptage, ce qui permet de comparer des infinis.","Du latin cardinalis, « principal », de cardo (gond)."],
  ["systems",2,"isomorphisme","/izɔmɔʁfism/","nm","Correspondance qui conserve toute la structure et rend deux objets identiques à leur nom près.","Du grec isos (égal) + morphē (forme)."],
  ["systems",2,"stochastique","/stɔkastik/","adj","Régi par le hasard plutôt que par une règle fixe, et décrit par des lois de probabilité.","Du grec stochastikos, « habile à conjecturer », de stochos (la cible)."],
  ["systems",3,"vecteur propre","/vɛktœʁ pʁɔpʁ/","nm","Direction qu’une transformation ne fait qu’étirer ou contracter, sans la faire tourner.","De propre au sens de « caractéristique », calque de l’allemand eigen."],
  ["systems",3,"convolution","/kɔ̃vɔlysjɔ̃/","nf","Opération qui fait glisser une fonction sur une autre et cumule leur recouvrement à chaque décalage.","Du latin convolvere, « rouler ensemble »."],
  ["systems",3,"surjectif","/syʁʒɛktif/","adj","Se dit d’une application qui atteint tout élément de l’ensemble d’arrivée, sans en laisser un seul de côté.","De sur (vers) + latin jacere (jeter)."],
  ["systems",3,"mémoïsation","/memɔizasjɔ̃/","nf","Mise en cache des résultats d’une fonction, pour répondre de mémoire à un appel déjà fait.","De l’anglais memoization, forgé sans le r de memorization."],
  ["systems",3,"monoïde","/mɔnɔid/","nm","Ensemble muni d’une opération associative et d’un élément neutre qui ne change rien.","Du grec monos (seul) et du suffixe -oïde."],
  ["systems",4,"homotopie","/ɔmɔtɔpi/","nf","Déformation continue d’une application en une autre, et relation que cette déformabilité définit.","Du grec homos (même) + topos (lieu)."],
  ["systems",4,"catamorphisme","/katamɔʁfism/","nm","Schéma de récursion qui replie toute une structure en une seule valeur — la somme en est l’archétype.","Du grec kata (vers le bas) + morphē (forme)."],
  ["systems",4,"quine","/kwin/","nm","Programme sans entrée qui imprime exactement son propre texte.","Du logicien W. V. O. Quine, dont le paradoxe repose sur l’autoréférence."],
  ["systems",4,"linéarisabilité","/lineaʁizabilite/","nf","Garantie qu’une opération concurrente paraît prendre effet en un instant, quelque part entre son appel et son retour.","Du latin linea, « ligne »."],
  ["systems",4,"faisceau","/fɛso/","nm","Structure qui attache des données à chaque ouvert d’un espace et dit comment recoller le local en global.","Du sens ordinaire : une gerbe de tiges liées en un même point."],
  ["systems",5,"ultrafiltre","/yltʁafiltʁ/","nm","Choix maximal et cohérent des parties tenues pour « grandes », qui tranche pour tout ensemble entre lui et son complémentaire.","Du latin ultra (au-delà) et de filtre."],
  ["systems",5,"anamorphisme","/anamɔʁfism/","nm","Miroir du catamorphisme : schéma qui déplie une graine unique en une structure entière.","Du grec ana (vers le haut) + morphē (forme)."],
  ["systems",5,"paracohérence","/paʁakɔeʁɑ̃s/","nf","Propriété d’une logique où une contradiction n’entraîne pas n’importe quelle conclusion.","Du grec para (à côté) et de cohérence."],
  ["systems",5,"machine à oracle","/maʃin a ɔʁakl/","nf","Ordinateur théorique doté d’une boîte noire qui résout un problème en une seule étape, pour mesurer des difficultés relatives.","Du latin oraculum ; la notion est de Turing."],
  ["systems",5,"topos","/tɔpɔs/","nm","Catégorie qui se comporte comme un univers d’ensembles et sert de cadre à une géométrie et à une logique propres.","Du grec topos, « lieu »."],

  // ── Langue & Rhétorique (suite) ──
  ["language",1,"adage","/adaʒ/","nm","Formule brève consacrée par l’usage, énonçant une règle pratique ou juridique tenue pour évidente — « nul n’est censé ignorer la loi ».","Du latin adagium, « proverbe, dicton », composé de ad- et du radical de aio, « je dis »."],
  ["language",1,"digression","/diɡʁɛsjɔ̃/","nf","Écart par lequel le discours quitte un moment son sujet pour y revenir, développement latéral toléré tant qu’il ne fait pas perdre le fil.","Du latin digressio, « action de s’écarter », de digredi, « s’éloigner, faire un détour »."],
  ["language",1,"emphase","/ɑ̃fɑz/","nf","Force appuyée donnée à l’expression et, le plus souvent péjorativement, l’enflure d’un ton qui hausse la voix bien au-delà de ce que le sujet mérite.","Du latin emphasis, emprunté au grec emphasis, « apparence, expression forte », de emphainein, « faire voir »."],
  ["language",1,"litote","/litɔt/","nf","Figure qui dit peu pour faire entendre beaucoup, l’atténuation valant renforcement — « Va, je ne te hais point » pour un aveu d’amour.","Du grec ancien litotēs, « simplicité, modération », dérivé de litos, « simple, uni »."],
  ["language",1,"onomatopée","/ɔnɔmatɔpe/","nf","Mot forgé par imitation du bruit qu’il désigne, comme « glouglou », « clapotis » ou le « cocorico » du coq.","Du grec ancien onomatopoiia, « création de mots », de onoma, « nom », et poiein, « faire »."],
  ["language",1,"oxymore","/ɔksimɔʁ/","nm","Alliance, dans un même groupe de mots, de deux termes contradictoires dont le heurt fait sens — « cette obscure clarté qui tombe des étoiles ».","Du grec ancien oxymōron, littéralement « spirituellement sot », de oxys, « aigu », et mōros, « émoussé, sot »."],
  ["language",1,"prolixe","/pʁɔliks/","adj","Qui emploie beaucoup plus de mots que la matière n’en demande, diluant la pensée dans l’abondance du discours.","Du latin prolixus, « qui coule abondamment, étendu, allongé »."],
  ["language",1,"quolibet","/kɔlibɛ/","nm","Raillerie lancée à la volée contre quelqu’un, plaisanterie publique de mauvais aloi qui vise à faire rire aux dépens d’un autre.","Du latin scolastique quodlibet, « ce qu’on veut », nom des disputes universitaires portant sur un sujet libre."],
  ["language",2,"ampoulé","/ɑ̃pule/","adj","Gonflé de grands mots et de tours pompeux, d’un style dont la boursouflure excède de loin la matière traitée.","De ampoule, du latin ampulla, « petite fiole »; Horace nommait déjà ampullae les mots enflés."],
  ["language",2,"circonlocution","/siʁkɔ̃lɔkysjɔ̃/","nf","Détour de langage par lequel on tourne autour d’une idée sans la nommer, pour ménager l’interlocuteur ou éviter de s’engager.","Du latin circumlocutio, « action de parler en tournant autour », calque du grec periphrasis."],
  ["language",2,"faconde","/fakɔ̃d/","nf","Abondance facile et brillante de la parole, le mot ayant pris une teinte ironique envers celui qui parle trop aisément.","Du latin facundia, « éloquence, facilité d’élocution », de facundus, « disert »."],
  ["language",2,"palinodie","/palinɔdi/","nf","Rétractation publique par laquelle on soutient le contraire de ce qu’on avait affirmé, souvent employé au pluriel pour railler les revirements d’un homme public.","Du grec ancien palinōidia, « chant repris à l’envers », de palin, « de nouveau », et ōidē, « chant »."],
  ["language",2,"pérorer","/peʁɔʁe/","v","Discourir longuement et avec suffisance, en s’écoutant parler devant un auditoire qu’on suppose acquis.","Du latin perorare, « plaider jusqu’au bout, conclure un discours », de per- et orare, « parler »."],
  ["language",2,"philippique","/filipik/","nf","Réquisitoire véhément prononcé en public contre un adversaire, discours d’attaque soutenu d’un bout à l’autre par l’indignation.","Du grec ancien Philippikoi logoi, « discours contre Philippe », harangues de Démosthène visant Philippe II de Macédoine."],
  ["language",2,"sibyllin","/sibilɛ̃/","adj","Dont le sens reste volontairement obscur et suspendu, à la manière des oracles antiques — « il s’en tira par une réponse sibylline ».","Du latin sibyllinus, « qui appartient aux sibylles », prophétesses dont les oracles passaient pour indéchiffrables."],
  ["language",2,"solécisme","/sɔlesism/","nm","Manquement à la syntaxe, la phrase étant mal construite alors que les mots la composant existent bel et bien — « après qu’il soit parti ».","Du grec ancien soloikismos, d’après Soloi, colonie de Cilicie où l’on parlait un grec fautif."],
  ["language",3,"antonomase","/ɑ̃tɔnɔmaz/","nf","Échange d’un nom propre contre un nom commun ou l’inverse — « un harpagon » pour un avare, « le Stagirite » pour Aristote.","Du grec ancien antonomasia, « emploi d’un nom pour un autre », de anti, « à la place de », et onoma, « nom »."],
  ["language",3,"asyndète","/asɛ̃dɛt/","nf","Suppression des mots de liaison entre propositions, dont la juxtaposition nue précipite le rythme — « Je suis venu, j’ai vu, j’ai vaincu ».","Du grec ancien asyndeton, « non lié », de a- privatif et syndetos, « attaché ensemble »."],
  ["language",3,"chiasme","/kjasm/","nm","Disposition croisée des termes de deux membres symétriques selon le schéma AB-BA — « il faut manger pour vivre et non vivre pour manger ».","Du grec ancien chiasmos, « disposition en croix », d’après la forme de la lettre chi)."],
  ["language",3,"diglossie","/diɡlɔsi/","nf","Coexistence dans une même communauté de deux variétés d’une langue hiérarchisées par l’usage, l’une réservée à l’écrit et au formel, l’autre à la conversation.","Du grec ancien diglōssos, « qui parle deux langues », de di-, « deux », et glōssa, « langue »."],
  ["language",3,"gloser","/ɡloze/","v","Commenter un texte par des explications en marge et, par extension péjorative, s’étendre en remarques oiseuses sur un détail.","De glose, du latin glossa, emprunté au grec glōssa, « langue », puis « mot rare exigeant explication »."],
  ["language",3,"hypotypose","/ipɔtipoz/","nf","Description si vive et si présente que la scène paraît se dérouler sous les yeux du lecteur, le récit se faisant tableau.","Du grec ancien hypotypōsis, « esquisse, modèle », de hypo, « sous », et typos, « empreinte »."],
  ["language",3,"idiotisme","/idjɔtism/","nm","Tournure propre à une langue et rebelle à la traduction littérale, tel le gallicisme « il y a » ou l’anglais « it rains cats and dogs ».","Du latin idiotismus, du grec idiōtismos, « langage propre à un particulier », de idios, « propre »."],
  ["language",3,"prosopopée","/pʁɔzɔpɔpe/","nf","Figure par laquelle on fait parler un absent, un mort, une abstraction ou une chose, à qui l’orateur prête voix et visage.","Du grec ancien prosōpopoiia, « action de donner un personnage », de prosōpon, « visage », et poiein, « faire »."],
  ["language",4,"aposiopèse","/apɔzjɔpɛz/","nf","Rupture brusque du discours, la phrase restant en suspens et confiant au lecteur ce que le locuteur feint de ne pouvoir achever.","Du grec ancien aposiōpēsis, « action de se taire », de siōpan, « garder le silence »."],
  ["language",4,"crase","/kʁɑz/","nf","Fusion en une seule voyelle longue de deux voyelles contiguës appartenant à des mots successifs, procédé courant du grec ancien.","Du grec ancien krasis, « mélange, fusion », de kerannymi, « mêler »."],
  ["language",4,"épanadiplose","/epanadiploz/","nf","Figure où la phrase s’ouvre et se ferme sur le même mot, l’encadrement produisant un effet de clôture — « L’homme est un loup pour l’homme ».","Du grec ancien epanadiplōsis, « redoublement », de epi, ana et diploos, « double »."],
  ["language",4,"épiphonème","/epifɔnɛm/","nm","Exclamation sentencieuse qui clôt un récit ou un développement pour en tirer la leçon — « Tel est pris qui croyait prendre ».","Du grec ancien epiphōnēma, « exclamation ajoutée », de epi, « sur », et phōnein, « faire entendre sa voix »."],
  ["language",4,"haplologie","/aplɔlɔʒi/","nf","Chute de l’une de deux syllabes identiques ou voisines contiguës, qui a réduit « idololâtre » à « idolâtre ».","Du grec ancien haploos, « simple », et logos, « parole, discours »."],
  ["language",4,"hendiadys","/ɛ̃djadis/","nm","Expression d’une idée unique par deux termes coordonnés là où l’un devrait grammaticalement dépendre de l’autre — « boire dans l’or et la coupe » pour « dans la coupe d’or ».","Du grec ancien hen dia dyoin, « une seule chose au moyen de deux », transmis par les grammairiens latins."],
