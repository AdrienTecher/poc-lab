  ["language",4,"parataxe","/paʁataks/","nf","Construction qui juxtapose les propositions sans mot subordonnant, laissant au lecteur le soin de rétablir le rapport logique qui les unit.","Du grec ancien parataxis, « rangement côte à côte », de para, « auprès », et taxis, « ordre »."],
  ["language",5,"apophonie","/apɔfɔni/","nf","Alternance vocalique à l’intérieur d’une même racine, porteuse à elle seule d’une valeur grammaticale — l’allemand « singen, sang, gesungen ».","Du grec ancien apo, « loin de », et phōnē, « son, voix »; calque savant de l’allemand Ablaut."],
  ["language",5,"battologie","/batɔlɔʒi/","nf","Répétition oiseuse des mêmes mots ou des mêmes idées, radotage érigé en défaut caractérisé du style.","Du grec ancien battologia, d’après Battos, roi bègue de Cyrène, et logos, « parole »."],
  ["language",5,"épanalepse","/epanalɛps/","nf","Reprise insistante d’un même mot ou groupe de mots au fil de la phrase ou en tête de membres successifs, la répétition martelant l’idée.","Du grec ancien epanalēpsis, « reprise », de epi, ana et lambanein, « prendre »."],
  ["language",5,"hypocoristique","/ipɔkɔʁistik/","adj","Qui exprime la tendresse par le diminutif, le redoublement ou l’altération caressante d’un nom — « fifille », « chouchou », « Lolo » pour Laurence.","Du grec ancien hypokoristikos, « caressant », de hypokorizesthai, « appeler d’un nom tendre »."],
  ["language",5,"paragoge","/paʁaɡɔʒ/","nf","Adjonction d’un son ou d’une syllabe à la fin d’un mot sans que le sens en soit modifié — le « s » des formes poétiques « jusques » et « avecques ».","Du grec ancien paragōgē, « action de conduire au-delà, allongement », de para, « à côté », et agein, « conduire »."],
  ["language",5,"parémiologie","/paʁemjɔlɔʒi/","nf","Étude des proverbes et des locutions figées, de leur forme, de leur transmission et de leur emploi dans une communauté.","Du grec ancien paroimia, « proverbe », et logos, « étude, discours »."],
  ["language",5,"synchyse","/sɛ̃kiz/","nf","Désordre extrême de la construction, les mots entrelacés brouillant les rapports syntaxiques au point de rendre la phrase presque indéchiffrable.","Du grec ancien synchysis, « confusion, mélange », de synchein, « verser ensemble, brouiller »."],

  // ── Esprit & Philosophie (suite) ──
  ["mind",1,"axiome","/aksjom/","nm","Proposition tenue pour évidente et posée sans démonstration, dont un système déductif tire toutes ses conséquences.","Du grec ancien axiôma, « ce qui est jugé digne, principe admis », de axios, « digne »."],
  ["mind",1,"candeur","/kɑ̃dœʁ/","nf","Pureté d’un esprit sans détour, qui ne soupçonne pas la ruse et se livre sans calcul.","Du latin candor, « blancheur éclatante », de candere, « être d’un blanc brillant »."],
  ["mind",1,"dessein","/desɛ̃/","nm","Projet formé par l’esprit et poursuivi avec suite — « il n’agit jamais qu’à dessein ».","De l’ancien français desseigner, du latin designare, « marquer d’un signe, désigner »."],
  ["mind",1,"obnubiler","/ɔbnybile/","v","Occuper l’esprit d’une idée fixe au point d’en obscurcir tout le jugement, comme un nuage voile le ciel.","Du latin obnubilare, « couvrir de nuages », de nubes, « nuage »."],
  ["mind",1,"probité","/pʁɔbite/","nf","Rectitude morale scrupuleuse qui fait observer ses devoirs jusque dans ce qu’aucun regard ne contrôle.","Du latin probitas, « honnêteté », de probus, « de bonne qualité, honnête »."],
  ["mind",1,"ressentiment","/ʁəsɑ̃timɑ̃/","nm","Rancune tenace née d’une offense qu’on rumine, que Nietzsche érige en ressort secret de la morale des faibles.","De ressentir, « éprouver de nouveau », du latin sentire, « éprouver, sentir »."],
  ["mind",1,"sagacité","/sagasite/","nf","Finesse d’esprit qui devine ce qui n’est qu’indiqué et tire d’un indice ténu la conclusion juste.","Du latin sagacitas, « finesse de l’odorat », de sagax, « qui a le flair sûr »."],
  ["mind",1,"scrupule","/skʁypyl/","nm","Inquiétude de conscience qui retient d’agir par crainte de mal faire, jusque dans le détail le plus mince.","Du latin scrupulus, « petit caillou pointu » qui blesse le pied dans la sandale."],
  ["mind",2,"concupiscence","/kɔ̃kypisɑ̃s/","nf","Inclination de l’appétit sensible qui porte au plaisir immédiat contre le jugement de la raison.","Du latin chrétien concupiscentia, « désir ardent », de concupiscere, « convoiter »."],
  ["mind",2,"contingence","/kɔ̃tɛ̃ʒɑ̃s/","nf","Caractère de ce qui peut être ou n’être pas, également éloigné du nécessaire et de l’impossible.","Du latin contingere, « échoir, arriver par hasard », de tangere, « toucher »."],
  ["mind",2,"immanence","/imanɑ̃s/","nf","Présence d’un principe au sein même de ce qu’il régit, sans recours à un au-delà — l’inverse exact de la transcendance.","Du latin immanere, « demeurer dans », de manere, « rester »."],
  ["mind",2,"ineffable","/inefabl/","adj","Qui excède toute parole, non par pauvreté du vocabulaire mais parce que l’expérience déborde la structure du langage.","Du latin ineffabilis, « qui ne peut être dit », de fari, « parler »."],
  ["mind",2,"inférence","/ɛ̃feʁɑ̃s/","nf","Opération par laquelle l’esprit tire une proposition nouvelle d’une ou plusieurs autres tenues pour vraies.","Du latin inferre, « porter dans, en tirer la conséquence »."],
  ["mind",2,"maïeutique","/majøtik/","nf","Art socratique de faire accoucher l’interlocuteur, par questions graduées, des vérités qu’il portait sans le savoir.","Du grec ancien maieutikê tekhnê, « art de l’accouchement », de maia, « sage-femme »."],
  ["mind",2,"pusillanime","/pyzilanim/","adj","Qui manque de la hauteur d’âme nécessaire pour vouloir de grandes choses et recule devant le moindre risque.","Du latin pusillanimis, « qui a l’âme petite », de pusillus, « très petit », et animus, « esprit »."],
  ["mind",2,"syllogisme","/silɔʒism/","nm","Raisonnement déductif à deux prémisses et une conclusion, où un moyen terme relie les deux extrêmes.","Du grec ancien sullogismos, « calcul, raisonnement », de sun, « avec », et logizesthai, « calculer »."],
  ["mind",3,"acédie","/asedi/","nf","Torpeur spirituelle du moine, mêlant dégoût de la prière et ennui du lieu, tenue au désert pour le pire des démons.","Du grec ancien akêdia, « absence de soin, indifférence », de kêdos, « souci »."],
  ["mind",3,"ataraxie","/ataʁaksi/","nf","Tranquillité d’une âme que nul trouble n’agite plus, souverain bien visé par l’épicurisme comme par le stoïcisme.","Du grec ancien ataraxia, « absence de trouble », de tarassein, « agiter, troubler »."],
  ["mind",3,"captieux","/kapsjø/","adj","Qui trompe sous une apparence de rigueur et tend un piège au consentement — « un argument captieux ».","Du latin captiosus, « qui cherche à prendre au piège », de capere, « prendre »."],
  ["mind",3,"casuistique","/kazɥistik/","nf","Partie de la théologie morale qui résout les cas de conscience en confrontant la règle au détail des circonstances; par glissement, subtilité argumentative complaisante.","Du latin casus, « cas, ce qui échoit », par le latin scolastique casuista."],
  ["mind",3,"monade","/mɔnad/","nf","Substance simple, sans parties ni fenêtres, qui exprime de sa place l’univers entier dans la métaphysique de Leibniz.","Du grec ancien monas, monados, « unité, ce qui est un »."],
  ["mind",3,"psittacisme","/psitasism/","nm","Répétition mécanique de formules dont celui qui les profère n’a nulle intelligence.","Du latin psittacus, « perroquet », emprunté au grec psittakos."],
  ["mind",3,"ratiociner","/ʁasjɔsine/","v","Raisonner interminablement, avec une subtilité pointilleuse qui ne mène à rien.","Du latin ratiocinari, « calculer, raisonner », de ratio, « compte, raison »."],
  ["mind",3,"théodicée","/teɔdise/","nf","Justification de la bonté et de la justice divines face au scandale du mal, discipline nommée par Leibniz en 1710.","Du grec ancien theos, « dieu », et dikê, « justice » — mot forgé par Leibniz."],
  ["mind",4,"aperception","/apɛʁsɛpsjɔ̃/","nf","Conscience réfléchie que l’esprit prend de ses propres perceptions, que Leibniz distingue de la perception obscure.","Dérivé d’apercevoir, du latin percipere, « saisir » — terme forgé en français par Leibniz."],
  ["mind",4,"clinamen","/klinamɛn/","nm","Déviation infime et sans cause assignable qui écarte l’atome de sa chute chez Lucrèce, et sauve la liberté du déterminisme.","Du latin clinamen, « inclinaison, déviation », de clinare, « pencher »."],
  ["mind",4,"conatus","/kɔnatys/","nm","Chez Spinoza, effort par lequel chaque chose persévère dans son être et qui constitue son essence actuelle.","Du latin conatus, « effort, élan », de conari, « s’efforcer »."],
  ["mind",4,"enthymème","/ɑ̃timɛm/","nm","Syllogisme abrégé dont une prémisse, jugée évidente, reste tue — forme ordinaire du raisonnement rhétorique.","Du grec ancien enthumêma, « ce qu’on garde à l’esprit », de thumos, « cœur, esprit »."],
  ["mind",4,"gnoséologie","/gnozeɔlɔʒi/","nf","Théorie générale de la connaissance envisagée dans ses conditions et ses limites, distincte de l’épistémologie des sciences constituées.","Du grec ancien gnôsis, « connaissance », et logos, « discours, étude »."],
  ["mind",4,"nescience","/nesjɑ̃s/","nf","État d’ignorance envisagé positivement, comme un non-savoir assumé plutôt qu’une lacune à combler.","Du latin nescientia, « ignorance », de nescire, « ne pas savoir »."],
  ["mind",4,"noème","/nɔɛm/","nm","Chez Husserl, contenu objectif visé par un acte de conscience, corrélat du versant vécu qu’est la noèse.","Du grec ancien noêma, « ce qui est pensé », de noein, « penser »."],
  ["mind",5,"acatalepsie","/akatalɛpsi/","nf","Thèse sceptique selon laquelle aucune représentation ne permet de saisir avec certitude la nature des choses.","Du grec ancien akatalêpsia, « impossibilité de saisir », de katalambanein, « saisir »."],
  ["mind",5,"apagogique","/apagɔʒik/","adj","Qualifie la démonstration qui établit une thèse en réduisant sa contradictoire à l’absurde.","Du grec ancien apagôgê, « action de détourner, d’écarter », de apagein, « emmener »."],
  ["mind",5,"aséité","/aseite/","nf","Propriété de l’être qui tient son existence de lui seul, sans cause ni raison hors de soi, réservée à Dieu par la scolastique.","Du latin scolastique aseitas, formé sur a se, « par soi »."],
  ["mind",5,"dianoétique","/djanɔetik/","adj","Relatif à la pensée discursive qui avance d’un pas à l’autre, par opposition à l’intuition — Aristote y range les vertus de l’intellect.","Du grec ancien dianoêtikos, « relatif à la pensée discursive », de dianoia, « pensée »."],
  ["mind",5,"sorite","/sɔʁit/","nm","Raisonnement en chaîne où l’attribut de chaque proposition devient le sujet de la suivante; nom aussi du paradoxe du tas.","Du grec ancien sôreitês, « entassé », de sôros, « tas »."],
  ["mind",5,"syncatégorématique","/sɛ̃kategɔʁematik/","adj","Qualifie le terme qui ne signifie rien par lui-même et ne prend fonction qu’adjoint à d’autres — « tout », « aucun », « ne… pas ».","Du grec ancien sunkatêgorêmatikos, « qui signifie conjointement », de katêgorêma, « attribut »."],
  ["mind",5,"syndérèse","/sɛ̃deʁɛz/","nf","Disposition innée de l’intelligence pratique qui connaît sans faillir les premiers principes du bien, chez les scolastiques.","Du grec ancien suntêrêsis, « conservation, garde vigilante », de suntêrein, « conserver »."],

  // ── Nature & Terre (suite) ──
  ["nature",1,"bruine","/bʁɥin/","nf","Pluie très fine et froide dont les gouttelettes semblent flotter plutôt que tomber, mouillant lentement mais complètement.","Du latin pruina, « gelée blanche, givre »."],
  ["nature",1,"combe","/kɔ̃b/","nf","Petite vallée encaissée aux versants raides; dans le Jura, dépression ouverte au sommet d’un pli par l’érosion de sa voûte.","Du gaulois cumba, « vallée, cuve »."],
  ["nature",1,"embrun","/ɑ̃bʁœ̃/","nm","Fine poussière d’eau salée que le vent arrache à la crête des vagues et porte loin dans les terres, salant la végétation littorale.","Du provençal embrun, déverbal de embrumar, « bruiner »."],
  ["nature",1,"estran","/ɛstʁɑ̃/","nm","Bande de littoral alternativement recouverte et découverte par la marée, domaine des laisses de mer et des pêcheurs à pied.","Du normand estran, issu de l’ancien scandinave strönd, « rivage »."],
  ["nature",1,"friche","/fʁiʃ/","nf","Terre abandonnée par la culture et reconquise par la végétation spontanée, stade transitoire vers le retour du bois.","Du moyen néerlandais versch, « frais, nouvellement retourné »."],
  ["nature",1,"futaie","/fytɛ/","nf","Peuplement forestier issu de semis, dont les arbres sont menés en hauts fûts jusqu’à maturité, par opposition au taillis exploité en rejets.","De fût, du latin fustis, « bâton, tronc »."],
  ["nature",1,"lande","/lɑ̃d/","nf","Étendue de sol pauvre et acide, sans culture, où dominent bruyères, ajoncs et genêts sur un tapis ras.","Du gaulois landa, « terrain découvert, plaine »."],
  ["nature",1,"taillis","/taji/","nm","Bois exploité par coupes rapprochées, où les souches conservées repoussent en rejets au lieu d’être remplacées par semis.","De tailler, du bas latin taliare, « couper, fendre »."],
  ["nature",2,"adret","/adʁɛ/","nm","Versant de montagne tourné vers le soleil, où se concentrent les cultures, les villages et la limite haute des arbres.","De l’occitan adrech, du latin directus, « tourné en face »."],
  ["nature",2,"bocage","/bɔkaʒ/","nm","Paysage agraire où chaque parcelle est close de haies vives et d’arbres, formant un maillage qui freine le vent et abrite la faune.","Du normanno-picard bocage, de bosc, « bois »."],
  ["nature",2,"étiage","/etjaʒ/","nm","Niveau le plus bas atteint par un cours d’eau au fil de l’année, et débit de référence qu’on en tire pour dimensionner prélèvements et rejets.","De étier, « canal de marais salant », du latin aestuarium, « bras de mer »."],
  ["nature",2,"glèbe","/ɡlɛb/","nf","Terre de culture envisagée comme fonds patrimonial, notamment celle à laquelle le serf médiéval était juridiquement attaché.","Du latin gleba, « motte de terre »."],
  ["nature",2,"saumâtre","/somɑtʁ/","adj","D’une salinité intermédiaire entre l’eau douce et l’eau de mer, comme celle des estuaires et des lagunes, au goût âcre.","Du latin populaire salmacidus, « d’un goût salé »."],
  ["nature",2,"sylvestre","/silvɛstʁ/","adj","Qui appartient à la forêt, y croît ou y vit à l’état spontané: « le pin sylvestre colonise les sols les plus maigres ».","Du latin silvestris, « des bois », de silva, « forêt »."],
  ["nature",2,"tourbière","/tuʁbjɛʁ/","nf","Zone humide où l’engorgement permanent bloque la décomposition des végétaux, qui s’accumulent en tourbe sur plusieurs mètres.","De tourbe, du francique turba, « matière végétale décomposée »."],
  ["nature",2,"ubac","/ybak/","nm","Versant de montagne exposé au nord, froid et humide, où la neige dure et où la forêt descend plus bas qu’en face.","De l’occitan ubac, du latin opacus, « sombre, ombragé »."],
  ["nature",3,"drageon","/dʁaʒɔ̃/","nm","Rejet né sur une racine traçante, à distance du pied, qui donne un individu autonome et permet au peuplier ou au robinier d’envahir une parcelle.","Du francique draibjo, « rejeton, pousse »."],
  ["nature",3,"essarter","/esaʁte/","v","Défricher un terrain boisé en arrachant broussailles et souches pour le livrer à la culture ou au pâturage.","Du bas latin exsartare, de exsarire, « sarcler, défricher »."],
  ["nature",3,"guéret","/ɡeʁɛ/","nm","Terre labourée puis laissée nue en jachère jusqu’aux semailles suivantes, motte apparente et sillons ouverts.","Du latin vervactum, « jachère, terre labourée au printemps »."],
  ["nature",3,"marcescent","/maʁsesɑ̃/","adj","Se dit du feuillage qui se dessèche sans se détacher et demeure sur l’arbre jusqu’au débourrement suivant, comme chez le chêne et le charme.","Du latin marcescens, participe de marcescere, « se flétrir »."],
  ["nature",3,"moraine","/mɔʁɛn/","nf","Amas de débris rocheux arrachés, charriés puis abandonnés par un glacier, formant bourrelets latéraux ou barrage frontal.","Du savoyard morena, « bourrelet de terre », d’un radical préroman mor-, « monticule »."],
  ["nature",3,"ripisylve","/ʁipisilv/","nf","Forêt riveraine étroite bordant un cours d’eau, à la fois filtre des nitrates, corridor pour la faune et frein à l’érosion des berges.","Du latin ripa, « rive », et silva, « forêt »."],
  ["nature",3,"thalweg","/talvɛɡ/","nm","Ligne joignant les points les plus bas d’une vallée, vers laquelle converge l’écoulement et que suit souvent une frontière fluviale.","De l’allemand Thalweg, « chemin de la vallée », de Tal et Weg."],
  ["nature",4,"affouiller","/afuje/","v","Creuser et miner par le courant la base d’une berge ou d’une pile de pont, jusqu’au déchaussement qui provoque l’effondrement.","De fouiller, du latin populaire fodiculare, « creuser », avec le préfixe a-."],
  ["nature",4,"cespiteux","/sɛspitø/","adj","Dont les tiges naissent en touffe dense sur une même souche, port caractéristique des graminées formant gazon.","Du latin caespes, caespitis, « motte de gazon »."],
  ["nature",4,"doline","/dɔlin/","nf","Dépression fermée en cuvette, creusée par la dissolution du calcaire, où s’accumulent argiles rouges et cultures de fond.","Du slovène dolina, « vallée, creux »."],
  ["nature",4,"gélifraction","/ʒelifʁaksjɔ̃/","nf","Éclatement d’une roche sous l’effet des cycles gel-dégel de l’eau retenue dans ses fissures, principal fournisseur des éboulis d’altitude.","De gel, du latin gelu, et du latin fractio, « brisure »."],
  ["nature",4,"régolithe","/ʁeɡɔlit/","nm","Couverture meuble d’altérites, de débris et de poussières qui coiffe la roche en place, sur Terre comme sur la Lune.","Du grec ancien rhêgos, « couverture », et lithos, « pierre »."],
  ["nature",4,"rhéophile","/ʁeɔfil/","adj","Inféodé aux eaux vives, fraîches et bien oxygénées, comme la truite ou le chabot que la retenue d’un barrage élimine.","Du grec ancien rheos, « courant », et philos, « ami »."],
  ["nature",4,"sciaphile","/sjafil/","adj","Qualifie une plante qui prospère à l’ombre du couvert forestier et souffre du plein soleil, tel le hêtre à l’état jeune.","Du grec ancien skia, « ombre », et philos, « ami »."],
  ["nature",5,"aiguail","/eɡwaj/","nm","Rosée abondante restée sur l’herbe et les feuilles au petit matin, dont les veneurs lisent les traces pour relever la voie du cerf.","De l’ancien français aigue, « eau », du latin aqua."],
  ["nature",5,"catabatique","/katabatik/","adj","Se dit d’un vent d’air froid et dense qui dévale une pente sous son propre poids, tels les blizzards permanents du plateau antarctique.","Du grec ancien katabatikos, « qui descend », de katabainein, « descendre »."],
  ["nature",5,"hamada","/amada/","nf","Plateau désertique de roche nue, balayé par le vent qui en a emporté tout le sable, opposé aux ergs dunaires.","De l’arabe hammada, « terrain stérile et pierreux »."],
  ["nature",5,"inselberg","/inzɛlbɛʁɡ/","nm","Relief résiduel isolé aux flancs abrupts, émergeant d’une surface d’aplanissement tropicale comme une île de roche saine.","De l’allemand Inselberg, « montagne-île », de Insel et Berg."],
  ["nature",5,"nyctinastie","/niktinasti/","nf","Mouvement périodique de fermeture et d’ouverture des feuilles ou des fleurs commandé par l’alternance du jour et de la nuit, chez le trèfle ou le nénuphar.","Du grec ancien nux, nuktos, « nuit », et nastos, « tassé, pressé »."],
  ["nature",5,"ombrotrophe","/ɔ̃bʁɔtʁɔf/","adj","Qualifie une tourbière nourrie des seules précipitations, sans apport de la nappe, donc extrêmement pauvre en minéraux et acide.","Du grec ancien ombros, « pluie », et trophê, « nourriture »."],
  ["nature",5,"sténoèce","/stenɔɛs/","adj","Se dit d’une espèce à faible amplitude écologique, cantonnée à une fourchette étroite de conditions et donc excellente bio-indicatrice.","Du grec ancien stenos, « étroit », et oikos, « habitation »."],

  // ── Matière & Cosmos (suite) ──
  ["matter",1,"amalgame","/amalɡam/","nm","Alliage que le mercure forme avec un autre métal, longtemps employé pour dorer, pour extraire l’or et pour obturer les dents.","Du latin médiéval amalgama, probablement de l’arabe al-malgham « pâte molle », lui-même du grec malagma « emplâtre »."],
  ["matter",1,"diaphane","/djafan/","adj","Qui laisse passer la lumière sans laisser voir nettement les formes, à mi-chemin du transparent et de l’opaque: « une porcelaine diaphane ».","Du grec ancien diaphanês, « qui se montre à travers », de dia « à travers » et phainein « paraître »."],
  ["matter",1,"éther","/etɛʁ/","nm","Fluide impondérable dont on supposait l’espace empli pour porter la lumière, congédié par la relativité restreinte; chez les poètes, la région la plus pure du ciel.","Du grec ancien aithêr, « air supérieur, ciel embrasé », de aithein « brûler »."],
  ["matter",1,"firmament","/fiʁmamɑ̃/","nm","La voûte du ciel tenue pour une surface fixe où seraient sertis les astres, image d’un monde clos que la science a défaite.","Du latin firmamentum, « appui, soutien », de firmus « ferme », calque du grec stereôma dans la Vulgate."],
  ["matter",1,"incandescent","/ɛ̃kɑ̃desɑ̃/","adj","Porté à une température si haute que le corps rayonne de lui-même, du rouge sombre au blanc.","Du latin incandescere, « devenir blanc de chaleur », de candere « être ardent, blanc »."],
  ["matter",1,"limaille","/limaj/","nf","Poussière de particules métalliques arrachées par la lime, dont on saupoudre un aimant pour rendre ses lignes de champ visibles.","De limer, du latin limare « polir à la lime », de lima « lime »."],
  ["matter",1,"nébuleuse","/nebyløz/","nf","Vaste nuage de gaz et de poussières interstellaires, brillant de sa propre lumière ou éclairé par les étoiles qu’il enfante.","Du latin nebulosus, « couvert de brume », de nebula « nuée, brouillard »."],
  ["matter",1,"scorie","/skɔʁi/","nf","Résidu vitreux qui surnage d’un métal en fusion et qu’on écume, ou lave bulleuse figée à la surface d’une coulée.","Du latin scoria, emprunté au grec skôria, « écume du métal en fusion », de skôr « déjection »."],
  ["matter",2,"aérolithe","/aeʁɔlit/","nm","Nom ancien de la pierre tombée du ciel, en usage au temps où l’on discutait encore que le ciel pût lapider la Terre.","Du grec ancien aêr, « air », et lithos, « pierre »."],
  ["matter",2,"aphélie","/afeli/","nm","Point de son orbite où une planète ou une comète se trouve le plus loin du Soleil, et où sa vitesse est la plus faible.","Du grec ancien apo, « loin de », et hêlios, « soleil »."],
  ["matter",2,"chatoyer","/ʃatwaje/","v","Renvoyer des reflets mobiles et changeants selon l’angle du regard, comme la soie, l’opale ou l’œil-de-chat.","De chat, par analogie avec l’éclat mobile de l’œil du chat."],
  ["matter",2,"ductile","/dyktil/","adj","Qualifie un métal qu’on peut étirer en fil sans qu’il rompe, l’or l’étant plus qu’aucun autre.","Du latin ductilis, « qu’on peut conduire ou étirer », de ducere « conduire, tirer »."],
  ["matter",2,"empyrée","/ɑ̃piʁe/","nm","Dans la cosmologie antique et médiévale, la sphère la plus haute du ciel, faite de feu pur et demeure des bienheureux.","Du grec ancien empurios, « qui est dans le feu », de en « dans » et pur « feu »."],
  ["matter",2,"gangue","/ɡɑ̃ɡ/","nf","Roche stérile qui enveloppe le minerai ou le cristal et dont il faut le dégager avant tout usage.","De l’allemand Gang, « filon de minerai », proprement « marche, allée »."],
  ["matter",2,"nadir","/nadiʁ/","nm","Point de la sphère céleste diamétralement opposé au zénith, à la verticale sous les pieds de l’observateur.","De l’arabe nazīr as-samt, « opposé au zénith », de nazīr « vis-à-vis »."],
  ["matter",2,"sidéral","/sideʁal/","adj","Qui se rapporte aux étoiles et se mesure sur elles: le jour sidéral, retour d’une étoile au méridien, dure 23 h 56 min.","Du latin sideralis, de sidus, sideris, « astre, constellation »."],
  ["matter",3,"chondrite","/kɔ̃dʁit/","nf","Météorite pierreuse jamais fondue, criblée de billes silicatées condensées avant les planètes, et qui date la naissance du système solaire.","Du grec ancien khondros, « grain, granule », d’après les grains qu’elle renferme."],
  ["matter",3,"dendrite","/dɑ̃dʁit/","nf","Cristal arborescent qui pousse en ramifications successives dans un métal en train de se solidifier ou sur une vitre qui givre.","Du grec ancien dendritês, « qui a rapport à l’arbre », de dendron « arbre »."],
  ["matter",3,"écliptique","/ekliptik/","nm","Grand cercle que le Soleil paraît décrire en un an sur la sphère céleste, plan de référence auquel on rapporte l’inclinaison des orbites.","Du grec ancien ekleiptikos, « relatif aux éclipses », de ekleipsis « défaillance, éclipse »."],
  ["matter",3,"frittage","/fʁitaʒ/","nm","Consolidation d’une poudre en une pièce cohérente par chauffage au-dessous du point de fusion, les grains se soudant par diffusion.","De fritte, de l’italien fritta, « frite », nom du mélange vitrifiable cuit à demi."],
  ["matter",3,"héliaque","/eljak/","adj","Qualifie le lever ou le coucher d’un astre au ras du Soleil: « le lever héliaque de Sirius ouvrait l’année égyptienne ».","Du grec ancien hêliakos, « du soleil », de hêlios « soleil »."],
  ["matter",3,"macle","/makl/","nf","Assemblage régulier de deux cristaux d’une même espèce accolés selon une loi de symétrie, tel le fer de lance du gypse.","Du latin macula, « tache », par l’ancien français macle, « losange » du blason."],
  ["matter",3,"piézoélectricité","/pjezoelɛktʁisite/","nf","Propriété de certains cristaux qui se polarisent électriquement sous une contrainte mécanique, et se déforment en retour lorsqu’on leur applique un champ.","Du grec piezein, « presser », et de électricité."],
  ["matter",4,"colure","/kɔlyʁ/","nm","Chacun des deux grands cercles de la sphère céleste passant par les pôles et par les points équinoxiaux ou solsticiaux.","Du grec ancien kolouros, « à la queue tronquée », de kolos « écourté » et oura « queue », le cercle paraissant coupé sous l’horizon."],
  ["matter",4,"décrépiter","/dekʁepite/","v","Faire éclater un sel avec crépitement en le chauffant, l’eau emprisonnée dans ses cristaux se vaporisant d’un coup.","Du latin crepitare, « craquer, pétiller », avec le préfixe dé- marquant la séparation."],
  ["matter",4,"épitaxie","/epitaksi/","nf","Croissance d’une couche cristalline dont l’orientation est dictée par le cristal qui lui sert de support, procédé au fondement des semi-conducteurs.","Du grec ancien epi, « sur », et taxis, « arrangement, ordre »."],
  ["matter",4,"facule","/fakyl/","nf","Plage brillante et plus chaude de la surface solaire, visible surtout près du bord du disque et voisine des taches.","Du latin facula, « petite torche », diminutif de fax, facis « flambeau »."],
  ["matter",4,"martensite","/maʁtɛnsit/","nf","Phase dure et distordue de l’acier, obtenue quand une trempe assez brutale piège le carbone sans lui laisser le temps de diffuser.","Du nom du métallurgiste allemand Adolf Martens (1850-1914), avec le suffixe minéralogique -ite."],
  ["matter",4,"mésomérie","/mezɔmeʁi/","nf","Description d’une molécule dont la structure réelle tient à la fois de plusieurs formules limites, la délocalisation des électrons la stabilisant.","Du grec ancien mesos, « au milieu », et meros, « partie »."],
  ["matter",4,"pléochroïsme","/pleɔkʁɔism/","nm","Propriété d’un cristal anisotrope de montrer des couleurs différentes selon la direction d’observation en lumière polarisée.","Du grec ancien pleiôn, « plus nombreux », et khrôs, khrôtos, « couleur, teint »."],
  ["matter",5,"adularescence","/adylaʁesɑ̃s/","nf","Lueur bleutée et flottante qui semble glisser sous la surface de la pierre de lune lorsqu’on l’incline.","De adulaire, feldspath nommé d’après le massif de l’Adula, dans les Alpes suisses."],
  ["matter",5,"anthélie","/ɑ̃teli/","nf","Tache blanche qui apparaît très rarement au point du ciel exactement opposé au Soleil, née de la réflexion sur des plaquettes de glace en suspension.","Du grec ancien anti, « en face de », et hêlios, « soleil »."],
  ["matter",5,"métamicte","/metamikt/","adj","Qualifie un minéral dont la radioactivité interne a ruiné le réseau cristallin, laissant un verre sous une forme extérieure intacte.","Du grec ancien meta, « au-delà, changement », et miktos, « mélangé »."],
  ["matter",5,"pnictogène","/pniktɔʒɛn/","nm","Élément de la quinzième colonne du tableau périodique, de l’azote au bismuth, réunis par leurs cinq électrons de couche externe.","Du grec ancien pnigein, « étouffer », et gennan, « engendrer », l’azote pur asphyxiant qui le respire."],
  ["matter",5,"polytypie","/pɔlitipi/","nf","Faculté d’un même composé de cristalliser en variétés qui ne diffèrent que par l’ordre d’empilement de couches identiques, le carbure de silicium en comptant des centaines.","Du grec ancien polus, « nombreux », et tupos, « empreinte, forme »."],
  ["matter",5,"rhéopexie","/ʁeɔpɛksi/","nf","Épaississement progressif d’un fluide soumis à une agitation prolongée, comportement rare et inverse de celui des pâtes qui se fluidifient sous cisaillement.","Du grec ancien rhein, « couler », et pêxis, « coagulation, prise en masse »."],
  ["matter",5,"sidérophile","/sideʁɔfil/","adj","Qualifie un élément qui, lors de la différenciation d’une planète, suit le fer et s’enfonce avec lui vers le noyau, tel l’or ou le platine.","Du grec ancien sidêros, « fer », et philos, « ami, qui aime »."],

  // ── Corps & Médecine (suite) ──
  ["body",1,"cérumen","/seʁymɛn/","nm","Sécrétion cireuse jaune brun produite par les glandes du conduit auditif externe, dont elle protège la peau et le tympan.","Du latin médiéval cerumen, formé sur cera « cire »."],
  ["body",1,"déglutir","/deglytiʁ/","v","Faire passer la salive, un aliment ou un médicament du fond de la bouche vers l’œsophage par un réflexe coordonné.","Du latin deglutire, « avaler », de gluttire « engloutir »."],
  ["body",1,"ecchymose","/ekimoz/","nf","Épanchement de sang dans les tissus sous-cutanés après un choc, qui colore la peau en bleu sombre puis en jaune verdâtre à mesure qu’il se résorbe.","Du grec ancien ekkhumôsis, « épanchement d’humeur », de ek « hors de » et khumos « suc »."],
  ["body",1,"entorse","/ɑ̃tɔʁs/","nf","Lésion articulaire par élongation ou déchirure des ligaments, sans déplacement durable des surfaces osseuses, à la différence de la luxation.","Ancien participe passé féminin de entordre, du latin intorquere « tordre en dedans »."],
  ["body",1,"fébrile","/febʁil/","adj","Qui relève de la fièvre ou l’accompagne, et par extension qu’agite une excitation nerveuse comparable — « une attente fébrile ».","Du latin febrilis, dérivé de febris « fièvre »."],
  ["body",1,"luette","/lɥɛt/","nf","Appendice charnu suspendu au milieu du bord libre du voile du palais, qui obture les fosses nasales pendant la déglutition.","De l’ancien français uete, diminutif du latin uva « grappe de raisin », avec agglutination de l’article dans « l’uette »."],
  ["body",1,"omoplate","/ɔmɔplat/","nf","Os plat et triangulaire de l’épaule, que l’anatomie moderne nomme scapula, et qui coulisse librement sur l’arrière du thorax.","Du grec ancien ômoplatê, de ômos « épaule » et platê « surface plate »."],
  ["body",1,"rotule","/ʁɔtyl/","nf","Petit os mobile logé devant l’articulation du genou, où il sert de poulie au tendon du quadriceps.","Du latin rotula, « petite roue », diminutif de rota « roue »."],
  ["body",2,"coccyx","/kɔksis/","nm","Os terminal de la colonne vertébrale, formé de quatre ou cinq vertèbres soudées et atrophiées, vestige d’une queue.","Du grec ancien kokkux, « coucou », l’os évoquant le bec de cet oiseau."],
  ["body",2,"exsangue","/ɛksɑ̃ɡ/","adj","Qui a perdu son sang et en porte la pâleur extrême, et par extension vidé de toute vigueur — « un visage exsangue ».","Du latin exsanguis, « sans sang », de ex « hors de » et sanguis « sang »."],
  ["body",2,"fontanelle","/fɔ̃tanɛl/","nf","Espace membraneux souple séparant les os du crâne du nouveau-né, qui autorise le modelage de la tête à la naissance avant de s’ossifier.","De l’ancien français fontenele, « petite fontaine », diminutif de fontaine."],
  ["body",2,"furoncle","/fyʁɔ̃kl/","nm","Inflammation aiguë et nécrosante d’un follicule pileux et de sa glande sébacée, formant un nodule douloureux qui finit par expulser un bourbillon.","Du latin furunculus, « petit voleur », diminutif de fur « voleur », d’abord le rejet de vigne qui dérobe la sève."],
  ["body",2,"livide","/livid/","adj","D’une pâleur bleuâtre et plombée, couleur d’un corps privé de sang, le sens strict précédant l’usage affaibli où le mot vaut simplement « très pâle ».","Du latin lividus, « de couleur de plomb, bleuâtre », de livere « être bleuâtre »."],
  ["body",2,"suppurer","/sypyʁe/","v","Produire du pus et le laisser s’écouler, en parlant d’une plaie ou d’un foyer infecté.","Du latin suppurare, de sub « sous » et pus, puris « pus »."],
  ["body",2,"syncope","/sɛ̃kɔp/","nf","Perte de connaissance brève et complète due à une chute soudaine du débit sanguin cérébral, avec effondrement du tonus et retour spontané à soi.","Du grec ancien sunkopê, « brisement, retranchement », de sun « avec » et koptein « couper »."],
  ["body",2,"urticaire","/yʁtikɛʁ/","nf","Éruption de papules rosées fugaces et intensément démangeantes, semblables à la brûlure de l’ortie, le plus souvent de mécanisme allergique.","Du latin savant urticaria, formé sur urtica « ortie »."],
  ["body",3,"escarre","/ɛskaʁ/","nf","Croûte noirâtre de tissu mortifié résultant de la nécrose d’une zone cutanée comprimée trop longtemps contre un plan dur chez un malade alité.","Du grec ancien eskhara, « foyer, brasier », puis « croûte formée par une brûlure »."],
  ["body",3,"expectorer","/ɛkspɛktɔʁe/","v","Rejeter par la bouche, au prix d’un effort de toux, les sécrétions accumulées dans les voies respiratoires.","Du latin expectorare, « chasser de la poitrine », de ex « hors de » et pectus, pectoris « poitrine »."],
  ["body",3,"ictère","/iktɛʁ/","nm","Coloration jaune de la peau, des muqueuses et des conjonctives provoquée par l’accumulation de bilirubine, ce que la langue courante nomme jaunisse.","Du grec ancien ikteros, « jaunisse », nom d’un oiseau jaune dont la vue passait pour guérir le mal."],
  ["body",3,"panaris","/panaʁi/","nm","Infection aiguë d’un doigt, siégeant le plus souvent à la pulpe ou au pourtour de l’ongle, née d’un germe introduit par une écharde ou une piqûre.","Du latin panaricium, altération du grec ancien parônukhia, « mal auprès de l’ongle »."],
  ["body",3,"phosphène","/fɔsfɛn/","nm","Sensation lumineuse perçue en l’absence de toute lumière réelle, née d’une pression sur le globe oculaire ou d’une excitation directe de la rétine.","Du grec ancien phôs, phôtos « lumière » et phainein « faire apparaître »."],
  ["body",3,"phtisie","/ftizi/","nf","Ancien nom de la tuberculose pulmonaire, retenant du mal l’amaigrissement et le dépérissement progressifs qui emportaient le malade.","Du grec ancien phthisis, « consomption, dépérissement », de phthiein « dépérir »."],
  ["body",3,"pylore","/pilɔʁ/","nm","Orifice inférieur de l’estomac, muni d’un sphincter musculaire qui règle le passage du chyme vers le duodénum.","Du grec ancien pulôros, « portier », de pulê « porte » et ouros « gardien »."],
  ["body",4,"cacochyme","/kakɔʃim/","adj","Dont les humeurs sont viciées, d’où d’une santé chétive et délabrée — le vieillard cacochyme et grognon de la comédie classique.","Du grec ancien kakokhumos, « aux humeurs mauvaises », de kakos « mauvais » et khumos « suc, humeur »."],
  ["body",4,"clystère","/klistɛʁ/","nm","Lavement administré dans le rectum au moyen d’une canule, remède souverain de la médecine classique et cible privilégiée de la satire moliéresque.","Du grec ancien klustêr, « seringue à lavement », de kluzein « laver »."],
  ["body",4,"hémoptysie","/emɔptizi/","nf","Rejet par la bouche, au cours d’un effort de toux, de sang rouge et spumeux provenant des voies respiratoires sous-glottiques.","Du grec ancien haima « sang » et ptusis « crachat », de ptuein « cracher »."],
  ["body",4,"lipothymie","/lipɔtimi/","nf","Malaise avec sueurs, bourdonnements et vue qui se voile, donnant la sensation d’un évanouissement imminent mais sans perte complète de connaissance, à la différence de la syncope.","Du grec ancien leipothumia, de leipein « manquer » et thumos « souffle vital »."],
  ["body",4,"mydriase","/midʁjaz/","nf","Dilatation anormale et persistante de la pupille, d’origine lésionnelle, toxique, ou provoquée par un collyre pour examiner le fond d’œil.","Du grec ancien mudriasis, « dilatation de la pupille »."],
  ["body",4,"pyrosis","/piʁozis/","nm","Sensation de brûlure remontant de l’épigastre vers la gorge, accompagnée de renvois acides, signe cardinal du reflux gastro-œsophagien.","Du grec ancien purôsis, « embrasement », de pur « feu »."],
  ["body",4,"vulnéraire","/vylneʁɛʁ/","adj","Propre à guérir les plaies, en parlant d’une plante ou d’une préparation de l’ancienne matière médicale.","Du latin vulnerarius, dérivé de vulnus, vulneris « blessure »."],
  ["body",5,"épiploon","/epiplɔɔ̃/","nm","Vaste repli graisseux du péritoine pendant en tablier devant les anses intestinales, qui vient colmater les foyers infectieux de l’abdomen.","Du grec ancien epiploon, « ce qui flotte au-dessus », de epipleîn « naviguer sur »."],
  ["body",5,"koïlonychie","/kɔilɔniʃi/","nf","Déformation des ongles qui s’aplatissent puis se creusent en cuillère, signe classique d’une carence martiale prolongée.","Du grec ancien koilos « creux » et onux, onukhos « ongle »."],
  ["body",5,"myodésopsie","/mjɔdezɔpsi/","nf","Perception de filaments et de points sombres dérivant dans le champ visuel, ombres portées de condensations du corps vitré que les patients appellent des « mouches volantes ».","Du grec ancien muia « mouche », eidos « forme » et opsis « vue »."],
  ["body",5,"opisthotonos","/ɔpistɔtɔnɔs/","nm","Contracture tétanique généralisée arquant le corps en arrière au point qu’il ne repose plus que sur la nuque et les talons.","Du grec ancien opisthen « en arrière » et tonos « tension »."],
  ["body",5,"pandiculation","/pɑ̃dikylasjɔ̃/","nf","Mouvement réflexe d’étirement des membres et du tronc, tête renversée, qui accompagne le bâillement au sortir du sommeil.","Du latin pandiculari, « s’étirer », de pandere « déployer, étendre »."],
  ["body",5,"strangurie","/stʁɑ̃ɡyʁi/","nf","Émission d’urine goutte à goutte, lente et cuisante, en dépit d’un besoin pressant.","Du grec ancien stranx, straggos « goutte pressée » et ouron « urine »."],
  ["body",5,"ténesme","/tenɛsm/","nm","Tension douloureuse du sphincter anal ou vésical imposant une envie impérieuse d’évacuer qui reste sans effet.","Du grec ancien teinesmos, de teinein « tendre, faire effort »."],

  // ── Arts & Métiers (suite) ──
  ["arts",1,"arabesque","/aʁabɛsk/","nf","Ornement de rinceaux et d’entrelacs végétaux courant en lignes souples, et par analogie toute figure déliée que trace un corps ou une mélodie.","De l’italien arabesco, « à la manière arabe »."],
  ["arts",1,"camaïeu","/kamajø/","nm","Peinture exécutée dans les seules valeurs d’une même couleur, du plus clair au plus sombre, sans autre contraste que le ton sur ton.","De l’ancien français camaheu, « pierre fine gravée en couches », doublet de camée."],
  ["arts",1,"estampe","/ɛstɑ̃p/","nf","Image imprimée par report d’une planche gravée, tirée sur papier humidifié à un nombre limité d’exemplaires numérotés.","De l’italien stampa, « impression, empreinte », de stampare, « imprimer »."],
  ["arts",1,"fusain","/fyzɛ̃/","nm","Bâtonnet de charbon de bois tiré de l’arbuste du même nom, au trait velouté et facile à estomper, et par extension le dessin qu’on en obtient.","Du latin fusus, « fuseau », le bois de l’arbuste servant à en tailler."],
  ["arts",1,"gouache","/ɡwaʃ/","nf","Peinture à l’eau rendue opaque et mate par une charge blanche liée à la gomme, couvrante là où l’aquarelle laisse transparaître le papier.","De l’italien guazzo, « flaque d’eau », puis « détrempe », du latin aquatio."],
  ["arts",1,"hachure","/aʃyʁ/","nf","Trait fin répété en séries parallèles ou croisées pour modeler l’ombre et le volume d’un dessin, d’une gravure ou d’une carte.","Dérivé de hacher, de hache, du francique hapja, « couperet »."],
  ["arts",1,"pastiche","/pastiʃ/","nm","Œuvre qui imite délibérément la manière d’un maître ou d’une école, par exercice, hommage ou jeu, sans l’intention de tromper qu’aurait le faux.","De l’italien pasticcio, « pâté, mélange de choses disparates »."],
  ["arts",1,"trompe-l’œil","/tʁɔ̃plœj/","nm","Peinture illusionniste qui, par la rigueur de la perspective et le rendu des matières, fait prendre un mur plat pour du relief ou une ouverture.","Composé du verbe tromper et du nom œil, du latin oculus."],
  ["arts",2,"acanthe","/akɑ̃t/","nf","Plante méditerranéenne aux feuilles largement découpées dont le dessin nervé fournit le motif canonique du chapiteau corinthien.","Du grec akantha, « épine »."],
  ["arts",2,"cariatide","/kaʁjatid/","nf","Statue de femme drapée qui, tenant lieu de colonne, porte l’entablement sur sa tête, comme au portique de l’Érechthéion.","Du grec karuatis, « femme de Karyai », bourg de Laconie."],
  ["arts",2,"cire perdue","/siʁpɛʁdy/","phr","Procédé de fonte où le modèle en cire, enfermé dans un moule réfractaire, est fondu et évacué pour céder sa place au métal en fusion.","Locution formée de cire, du latin cera, et de perdu: le modèle est détruit à la coulée."],
  ["arts",2,"eau-forte","/ofɔʁt/","nf","Acide nitrique qu’on laisse mordre une plaque de cuivre vernie et tracée à la pointe, et, par métonymie, l’estampe qui en sort.","Composé de eau et de fort, ancien nom de l’acide nitrique qui attaque les métaux."],
  ["arts",2,"estompe","/ɛstɔ̃p/","nf","Petit rouleau de peau ou de papier serré avec lequel on fond un tracé de fusain ou de sanguine pour en adoucir les passages.","Du néerlandais stomp, « émoussé, tronqué »."],
  ["arts",2,"marqueterie","/maʁkətʁi/","nf","Décor obtenu en assemblant à fleur de surface des placages de bois, d’écaille, de nacre ou de métal découpés selon un même tracé.","Dérivé de marqueter, « couvrir de marques, de taches »."],
  ["arts",2,"polyptyque","/pɔliptik/","nm","Retable formé de plusieurs panneaux peints articulés par des charnières, que l’on ouvre ou referme selon les temps de la liturgie.","Du grec poluptukhos, « à plusieurs plis, à plusieurs volets »."],
  ["arts",2,"sanguine","/sɑ̃ɡin/","nf","Crayon d’hématite d’un rouge brun, prisé pour le rendu des chairs, et le dessin exécuté avec lui, souvent relevé de craie blanche.","Du latin sanguineus, « couleur de sang »."],
  ["arts",3,"aquatinte","/akwatɛ̃t/","nf","Gravure à l’eau-forte où un grain de résine fondue sur la plaque ménage des plages de morsure, imitant les valeurs continues du lavis.","De l’italien acquatinta, « eau teintée »."],
  ["arts",3,"chantourner","/ʃɑ̃tuʁne/","v","Découper une pièce de bois, de pierre ou de métal suivant un profil sinueux, en la sciant sur son chant.","Composé de chant, « face étroite d’une pièce », et de tourner."],
  ["arts",3,"cimaise","/simɛz/","nf","Moulure au profil ondé couronnant une corniche, et par extension la ligne d’accrochage des tableaux à hauteur d’œil dans une salle d’exposition.","Du latin cymatium, du grec kumation, « petite vague »."],
  ["arts",3,"écoinçon","/ekwɛ̃sɔ̃/","nm","Surface triangulaire comprise entre la courbe d’un arc et l’encadrement rectangulaire qui l’inscrit, souvent occupée par un décor sculpté.","Dérivé de coin, du latin cuneus, « coin, angle »."],
  ["arts",3,"lavis","/lavi/","nm","Mise en valeurs d’un dessin par de l’encre ou de l’aquarelle diluée, étendue au pinceau en couches transparentes superposées.","Dérivé de laver, du latin lavare, au sens d’étendre une couleur délayée."],
  ["arts",3,"poncif","/pɔ̃sif/","nm","Carton dont le tracé, piqué de trous fins, se reporte en tamponnant de la poudre, d’où le sens dérivé de formule ressassée sans invention.","Dérivé de poncer, du latin pumex, « pierre ponce »."],
  ["arts",3,"prédelle","/pʁedɛl/","nf","Bande basse d’un retable, divisée en petits compartiments peints où se racontent les épisodes secondaires du panneau principal.","De l’italien predella, « marchepied, degré »."],
  ["arts",3,"rehaut","/ʁəo/","nm","Touche claire posée en dernier pour accrocher la lumière sur une arête, une chevelure ou un pli, tel le blanc de céruse sur papier teinté.","Déverbal de rehausser, de haut, du latin altus."],
  ["arts",4,"appoggiature","/apɔdʒjatyʁ/","nf","Note étrangère à l’accord qui, appuyée sur le temps fort, emprunte sa durée à la note principale avant de s’y résoudre.","De l’italien appoggiatura, « appui », de appoggiare, « appuyer »."],
  ["arts",4,"brunissoir","/bʁyniswaʁ/","nm","Outil à pointe d’agate ou d’acier poli dont le frottement lustre l’or posé à la feuille ou referme le grain d’un métal.","Dérivé de brunir, « rendre luisant », du germanique brun."],
  ["arts",4,"intrados","/ɛ̃tʁado/","nm","Surface intérieure concave d’un arc ou d’une voûte, celle que voit l’usager, par opposition à l’extrados qui en forme le dos.","Composé du latin intra, « en dedans », et de dos, du latin dorsum."],
  ["arts",4,"métope","/metɔp/","nf","Panneau, souvent sculpté en bas-relief, qui remplit l’intervalle entre deux triglyphes d’une frise dorique.","Du grec metopê, de meta, « entre », et opê, « ouverture de poutre »."],
  ["arts",4,"modénature","/mɔdenatyʁ/","nf","Ensemble des profils, saillies et proportions des moulures d’un édifice, tenu pour la signature plastique de l’ordre employé.","De l’italien modanatura, « moulure », de modano, « gabarit »."],
  ["arts",4,"sgraffite","/sɡʁafit/","nm","Décor mural obtenu en grattant l’enduit clair encore frais pour découvrir en creux la couche colorée posée dessous.","De l’italien sgraffito, « gratté », de sgraffiare, « égratigner »."],
  ["arts",4,"tranchefile","/tʁɑ̃ʃfil/","nf","Bourrelet de fil brodé sur une âme, fixé en tête et en queue du dos d’un livre relié, qui tient les cahiers et masque leur couture.","Composé de tranche et de file, le cordon courant sur la tranche du dos."],
  ["arts",5,"bucrane","/bykʁan/","nm","Motif ornemental figurant un crâne de bœuf décharné, relié par des guirlandes, qui rythme les frises des temples antiques et de leurs imitations.","Du grec boukranion, de bous, « bœuf », et kranion, « crâne »."],
  ["arts",5,"chryséléphantin","/kʁizelefɑ̃tɛ̃/","adj","Fait d’or et d’ivoire, en parlant des grandes statues grecques dont les chairs étaient d’ivoire et les vêtures de plaques d’or montées sur une âme de bois.","Du grec khrusos, « or », et elephas, « ivoire »."],
  ["arts",5,"duite","/dɥit/","nf","Passage d’un fil de trame d’une lisière à l’autre, unité de compte de la densité d’un tissage et d’une tapisserie de haute lice.","Du latin ducta, participe de ducere, « conduire »."],
  ["arts",5,"épannelage","/epanlaʒ/","nm","Dégrossissage d’un bloc en une suite de plans, ou panneaux, qui cernent la forme à venir avant toute taille de détail.","Dérivé de épanneler, « tailler par plans », de panneau."],
  ["arts",5,"gradine","/ɡʁadin/","nf","Ciseau de sculpteur à tranchant denté qui dégrossit la pierre en y laissant des sillons parallèles, entre l’ébauche et le poli.","De l’italien gradina, dérivé de grado, « degré, marche »."],
  ["arts",5,"mixtion","/mikstjɔ̃/","nf","Mordant huileux et siccatif dont on enduit un support pour y faire adhérer la feuille d’or au moment précis où il tire à sec.","Du latin mixtio, « mélange », de miscere, « mêler »."],
  ["arts",5,"quilisma","/kilisma/","nm","Neume grégorien en dents de scie notant une note légère et comme frémissante, qu’on aborde en allongeant celle qui la précède.","Du grec kulisma, « roulement », de kuliein, « rouler »."],

  // ── Société & Droit (suite) ──
  ["society",1,"chancellerie","/ʃɑ̃sɛlʁi/","nf","Service qui rédige, scelle et conserve les actes d’une autorité — souverain, ambassade, ordre — et, en France, l’administration centrale du ministère de la Justice.","Du latin cancellarius, « huissier posté devant les cancelli », les barreaux séparant le tribunal du public."],

// ── model ───────────────────────────────────────────────────────────────────
const toEntries = (raw) => raw.map((row, id) => Object.assign({ id }, ...FIELDS.map((f, i) => ({ [f]: row[i] }))));
const BANKS = { en: toEntries(RAW_EN), fr: toEntries(RAW_FR) };

const STORE = "lexicon:v2";
const state = { lang: "en", level: 1, domains: new Set(DOMAIN_KEYS), current: null };
// Draw without replacement so a session tours the pool instead of repeating.
let seen = new Set();

const T = () => L10N[state.lang];
const entries = () => BANKS[state.lang];
const domainName = (key) => T().domains[key];
const levelOf = (n) => ({ n, roman: ROMAN[n - 1], ...T().levels[n - 1] });
const posName = (code) => T().pos[code] || code;

const load = () => {
  const params = new URLSearchParams(location.search);
  state.linked = params.get("w");
  const fromUrl = params.get("lang");
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(STORE) || "{}"); } catch { /* corrupt entry means defaults */ }
  // The URL wins over the remembered choice, so a shared link opens in the
  // language it was shared in.
  const lang = L10N[fromUrl] ? fromUrl : L10N[saved.lang] ? saved.lang : null;
  if (lang) state.lang = lang;
  else if (typeof navigator !== "undefined" && /^fr\b/i.test(navigator.language || "")) state.lang = "fr";
  if (saved.level >= 1 && saved.level <= 5) state.level = saved.level;
  if (Array.isArray(saved.domains) && saved.domains.length) {
    const known = saved.domains.filter((k) => DOMAIN_KEYS.includes(k));
    if (known.length) state.domains = new Set(known);
  }
  if (saved.theme) document.documentElement.dataset.theme = saved.theme;
};

const save = () => {
  const theme = document.documentElement.dataset.theme;
  try {
    localStorage.setItem(STORE, JSON.stringify({ lang: state.lang, level: state.level, domains: [...state.domains], theme }));
  } catch { /* private mode — settings simply don't persist */ }
};

const pool = () => entries().filter((e) => e.level === state.level && state.domains.has(e.domain));

// ── view ────────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

// Everything the language owns is rebuilt from L10N rather than translated in
// place, so adding a third language stays a data change.
const paintLanguage = () => {
  const t = T();
  document.documentElement.lang = t.htmlLang;
  document.title = `Lexicon — ${t.title}`;
  $("h1").textContent = t.title;
  $("lede").textContent = t.lede;
  $("levelLabel").textContent = t.levelLabel;
  $("domainLabel").textContent = t.domainLabel;
  $("allDomains").textContent = t.all;
  $("noDomains").textContent = t.none;
  $("next").textContent = t.next;
  $("dl").textContent = t.download;
  $("share").textContent = t.share;
  $("sheetTitle").textContent = t.shareTitle;
  $("copyLink").textContent = t.copyLink;
  $("copyImage").textContent = t.copyImage;
  $("sheetNote").textContent = t.shareNote;
  $("hint").innerHTML = t.hint;
  $("footnote").textContent = t.footnote;
  $("theme").setAttribute("aria-label", t.themeLabel);
  $("theme").setAttribute("title", t.themeLabel);
  $("langs").setAttribute("aria-label", t.langLabel);
  $("rootLbl").textContent = t.rootLabel;
  $("stat").textContent = t.stat(entries().length, DOMAIN_KEYS.length, ROMAN.length);

  $("levels").innerHTML = ROMAN.map((roman, i) => {
    const l = t.levels[i];
    return `
    <button class="lvl" type="button" role="radio" data-level="${i + 1}" aria-checked="false" aria-label="${t.levelAria(i + 1, l.name)}">
      <span class="num" aria-hidden="true">${roman}</span><span class="nm">${l.name}</span>
    </button>`;
  }).join("");

  $("chips").innerHTML = DOMAIN_KEYS.map((key) => `
    <button class="chip" type="button" data-domain="${key}" aria-pressed="false">${t.domains[key]}</button>`).join("");

  document.querySelectorAll(".lang").forEach((b) => {
    b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang));
  });

  // Writing an image to the clipboard is not universally supported; offer the
  // button only where it will actually work.
  $("copyImage").hidden = typeof ClipboardItem === "undefined" || !(navigator.clipboard && navigator.clipboard.write);
};

const syncControls = () => {
  document.querySelectorAll(".lvl").forEach((b) => {
    b.setAttribute("aria-checked", String(Number(b.dataset.level) === state.level));
    b.tabIndex = Number(b.dataset.level) === state.level ? 0 : -1;
  });
  document.querySelectorAll(".chip").forEach((b) => {
    b.setAttribute("aria-pressed", String(state.domains.has(b.dataset.domain)));
  });
  $("lvlDesc").textContent = levelOf(state.level).desc;
  $("poolCount").textContent = T().inPlay(pool().length);
};

const stagger = (nodes) => {
  if (reduced) return;
  nodes.forEach((node, i) => node.animate(
    [{ opacity: 0, transform: "translateY(9px)" }, { opacity: 1, transform: "none" }],
    { duration: 480, delay: i * 70, easing: "cubic-bezier(.2,.7,.2,1)", fill: "backwards" },
  ));
};

const render = (entry) => {
  const stage = $("stage");
  state.current = entry;
  $("dl").disabled = !entry;
  $("share").disabled = !entry;
  // The panel is about the word on screen, so a new draw retires it.
  closeSheet();

  if (!entry) {
    const t = T();
    stage.classList.add("empty");
    $("tagDomain").textContent = t.emptyTag;
    $("tagLevel").textContent = levelOf(state.level).name;
    $("word").textContent = t.emptyWord;
    $("phon").hidden = true;
    $("def").textContent = t.emptyDef;
    $("rootLine").hidden = true;
    return;
  }

  stage.classList.remove("empty");
  $("phon").hidden = false;
  $("rootLine").hidden = false;
  $("tagDomain").textContent = domainName(entry.domain);
  $("tagLevel").textContent = `${levelOf(entry.level).roman} · ${levelOf(entry.level).name}`;
  $("word").textContent = entry.word;
  $("ipa").textContent = entry.ipa;
  $("pos").textContent = posName(entry.pos);
  $("def").textContent = entry.def;
  $("root").textContent = entry.root;
  stagger([$("word"), $("phon"), $("def"), $("rootLine")]);
};

const draw = () => {
  const bag = pool();
  if (!bag.length) return render(null);

  let fresh = bag.filter((e) => !seen.has(e.id));
  if (!fresh.length) {
    seen = new Set();
    fresh = bag.filter((e) => !state.current || e.id !== state.current.id);
    if (!fresh.length) fresh = bag;
  }
  const pick = fresh[Math.floor(Math.random() * fresh.length)];
  seen.add(pick.id);
  render(pick);
};

// ── memory card ─────────────────────────────────────────────────────────────
// Always drawn on the light paper palette: the card is meant for print, not screen.
const CARD = { w: 600, h: 380, pad: 42, gut: 56, margin: 40, scale: 2 };
const INK = { paper: "#faf7f1", sheet: "#ffffff", edge: "#ddd6c6", ink: "#1a1917", soft: "#4c4840", muted: "#8b8375", accent: "#9c3b26" };

const wrap = (ctx, text, maxWidth) => {
  const lines = [];
  let line = "";
  for (const word of text.split(" ")) {
    const next = line ? `${line} ${word}` : word;
    if (ctx.measureText(next).width > maxWidth && line) {
      lines.push(line);
      line = word;
    } else {
      line = next;
    }
  }
  if (line) lines.push(line);
  return lines;
};

// Shrink until the block fits its box — long definitions and words like
// "dysdiadochokinesia" must not spill off the card.
const fitLines = (ctx, text, maxWidth, maxLines, font, from, to) => {
  for (let size = from; size >= to; size -= 1) {
    ctx.font = font(size);
    const lines = wrap(ctx, text, maxWidth);
    if (lines.length <= maxLines) return { lines, size };
  }
  ctx.font = font(to);
  return { lines: wrap(ctx, text, maxWidth).slice(0, maxLines), size: to };
};

const panel = (ctx, x, y) => {
  ctx.fillStyle = INK.paper;
  ctx.strokeStyle = INK.edge;
  ctx.lineWidth = 1;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, CARD.w, CARD.h, 14);
  else ctx.rect(x, y, CARD.w, CARD.h);
  ctx.fill();
  ctx.stroke();
};

const kicker = (ctx, text, x, y, align, color) => {
  ctx.font = "500 12px ui-monospace, Menlo, Consolas, monospace";
  ctx.letterSpacing = "0.16em";
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.fillText(text.toUpperCase(), x, y);
  ctx.letterSpacing = "0px";
  ctx.textAlign = "left";
};

const renderCard = (entry) => {
  const sheetW = CARD.margin * 2 + CARD.w * 2 + CARD.gut;
  const sheetH = CARD.margin * 2 + CARD.h;
  const canvas = document.createElement("canvas");
  canvas.width = sheetW * CARD.scale;
  canvas.height = sheetH * CARD.scale;
  const ctx = canvas.getContext("2d");
  ctx.scale(CARD.scale, CARD.scale);
  ctx.textBaseline = "alphabetic";

  ctx.fillStyle = INK.sheet;
  ctx.fillRect(0, 0, sheetW, sheetH);

  const serif = (size, style = "400", ital = "") => `${ital} ${style} ${size}px Newsreader, Georgia, serif`.trim();
  const sans = (size, style = "400") => `${style} ${size}px Inter, system-ui, sans-serif`;

  const left = CARD.margin;
  const right = CARD.margin + CARD.w + CARD.gut;
  const lvl = levelOf(entry.level);

  // cut guide between the two cards
  ctx.strokeStyle = "#d8d2c4";
  ctx.setLineDash([5, 7]);
  ctx.beginPath();
  ctx.moveTo(sheetW / 2, CARD.margin * 0.45);
  ctx.lineTo(sheetW / 2, sheetH - CARD.margin * 0.45);
  ctx.stroke();
  ctx.setLineDash([]);

  // ── front: the prompt ──
  panel(ctx, left, CARD.margin);
  const fx = left + CARD.pad;
  const fTop = CARD.margin + CARD.pad;
  kicker(ctx, domainName(entry.domain), fx, fTop + 4, "left", INK.muted);
  kicker(ctx, `${lvl.roman} · ${lvl.name}`, left + CARD.w - CARD.pad, fTop + 4, "right", INK.accent);

  ctx.strokeStyle = INK.edge;
  ctx.beginPath();
  ctx.moveTo(fx, fTop + 20);
  ctx.lineTo(left + CARD.w - CARD.pad, fTop + 20);
  ctx.stroke();

  // Both faces centre their block in the band between the hairline and the
  // footer line, so a one-word front and a five-line back stay balanced.
  const innerW = CARD.w - CARD.pad * 2;
  const bandTop = fTop + 20;
  const bandBottom = CARD.margin + CARD.h - CARD.pad - 12;

  const word = fitLines(ctx, entry.word, innerW, 2, (s) => serif(s, "400"), 62, 24);
  const IPA_GAP = 34;
  const wordBlock = (word.lines.length - 1) * word.size * 1.1 + word.size * 0.72;
  const wordY = bandTop + (bandBottom - bandTop - (wordBlock + IPA_GAP)) / 2 + word.size * 0.72;

  ctx.fillStyle = INK.ink;
  ctx.textAlign = "center";
  word.lines.forEach((line, i) => ctx.fillText(line, left + CARD.w / 2, wordY + i * word.size * 1.1));

  // Two runs, centred as one line: the transcription in the sans that actually
  // has IPA glyphs, the part of speech in the italic serif.
  const ipaY = wordY + (word.lines.length - 1) * word.size * 1.1 + IPA_GAP;
  const posText = posName(entry.pos);
  const ipaFont = sans(16, "400");
  const posFont = serif(19, "400", "italic");
  ctx.font = ipaFont;
  const wIpa = ctx.measureText(entry.ipa).width;
  ctx.font = posFont;
  const wSep = ctx.measureText("   ·   ").width;
  const wPos = ctx.measureText(posText).width;

  ctx.textAlign = "left";
  ctx.fillStyle = INK.muted;
  let px = left + CARD.w / 2 - (wIpa + wSep + wPos) / 2;
  ctx.font = ipaFont;
  ctx.fillText(entry.ipa, px, ipaY);
  px += wIpa;
  ctx.font = posFont;
  ctx.fillText("   ·   ", px, ipaY);
  ctx.fillText(posText, px + wSep, ipaY);

  kicker(ctx, "poc-lab · lexicon", fx, CARD.margin + CARD.h - CARD.pad + 12, "left", "#b9b1a1");

  // ── back: the answer ──
  panel(ctx, right, CARD.margin);
  const bx = right + CARD.pad;
  kicker(ctx, T().defLabel, bx, fTop + 4, "left", INK.muted);
  kicker(ctx, `${lvl.roman} · ${lvl.name}`, right + CARD.w - CARD.pad, fTop + 4, "right", INK.accent);
  ctx.strokeStyle = INK.edge;
  ctx.beginPath();
  ctx.moveTo(bx, fTop + 20);
  ctx.lineTo(right + CARD.w - CARD.pad, fTop + 20);
  ctx.stroke();

  const def = fitLines(ctx, entry.def, innerW, 5, (s) => serif(s, "400"), 23, 15);
  const root = fitLines(ctx, entry.root, innerW, 4, (s) => sans(s, "400"), 14, 11);
  const ROOT_GAP = 26;
  const defBlock = def.lines.length * def.size * 1.42;
  const rootBlock = 20 + root.lines.length * root.size * 1.5;
  const answerRoom = 30; // the word itself sits on the bottom right
  let y = bandTop + (bandBottom - answerRoom - bandTop - (defBlock + ROOT_GAP + rootBlock)) / 2 + def.size;

  // fitLines leaves its own font active, so re-assert before each block draws.
  ctx.font = serif(def.size, "400");
  ctx.fillStyle = INK.ink;
  def.lines.forEach((line) => { ctx.fillText(line, bx, y); y += def.size * 1.42; });

  y += ROOT_GAP;
  kicker(ctx, T().rootLabel, bx, y, "left", INK.accent);
  y += 20;
  ctx.font = sans(root.size, "400");
  ctx.fillStyle = INK.soft;
  root.lines.forEach((line) => { ctx.fillText(line, bx, y); y += root.size * 1.5; });

  ctx.font = serif(21, "400", "italic");
  ctx.fillStyle = INK.accent;
  ctx.textAlign = "right";
  ctx.fillText(entry.word, right + CARD.w - CARD.pad, CARD.margin + CARD.h - CARD.pad + 14);
  ctx.textAlign = "left";

  return canvas;
};

// Fold accents before slugifying, or "mémoïsation" would come out gutted.
// Ligatures do not decompose under NFD, so they must be spelled out first or
// "synœcisme" would slug to "syn-cisme" and "trompe-l'œil" to "trompe-l-il".
const slugify = (w) =>
  w.replace(/œ/g, "oe").replace(/Œ/g, "OE").replace(/æ/g, "ae").replace(/Æ/g, "AE")
    .normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/gi, "-").replace(/^-|-$/g, "").toLowerCase();

// The card is typeset in the same faces as the page, so wait for them.
const ensureFonts = async () => {
  if (!document.fonts) return;
  await Promise.all(["400 62px Newsreader", "italic 400 19px Newsreader", "400 16px Inter", "500 12px Inter"].map((f) => document.fonts.load(f)));
  await document.fonts.ready;
};

const cardBlob = async (entry) => {
  await ensureFonts();
  return new Promise((resolve) => renderCard(entry).toBlob(resolve, "image/png"));
};

const cardName = (entry) => `lexicon-${state.lang}-${slugify(entry.word)}.png`;

// A shared link reopens the exact word, in the language it was shared in.
const shareUrl = (entry) => {
  const u = new URL(location.href);
  u.search = "";
  u.hash = "";
  u.searchParams.set("lang", state.lang);
  u.searchParams.set("w", slugify(entry.word));
  return u.toString();
};

const shareText = (entry) => {
  const def = entry.def.length > 160 ? `${entry.def.slice(0, 157)}…` : entry.def;
  return `${entry.word} ${entry.ipa} — ${def}`;
};

// Flash a transient label on a button without losing what it said. Restoring
// early must also cancel the pending timer, or it fires later against an
// already-cleared `was` and writes "undefined" into the button.
const unflash = (btn) => {
  clearTimeout(Number(btn.dataset.timer));
  if (btn.dataset.was !== undefined) btn.textContent = btn.dataset.was;
  delete btn.dataset.was;
  delete btn.dataset.timer;
};

const flash = (btn, msg, ms = 1400) => {
  clearTimeout(Number(btn.dataset.timer));
  if (btn.dataset.was === undefined) btn.dataset.was = btn.textContent;
  btn.textContent = msg;
  btn.dataset.timer = String(setTimeout(() => unflash(btn), ms));
};

const download = async () => {
  const entry = state.current;
  if (!entry) return;
  const t = T();
  const btn = $("dl");
  btn.disabled = true;
  flash(btn, t.drawing, 6000);
  try {
    const blob = await cardBlob(entry);
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = cardName(entry);
    a.click();
    URL.revokeObjectURL(url);
    flash(btn, t.saved);
  } catch {
    flash(btn, t.failed, 1800);
  } finally {
    btn.disabled = false;
  }
};

// ── sharing ─────────────────────────────────────────────────────────────────
// On a phone the native sheet hands the actual PNG to whatever app the reader
// picks, which is the only route that shares the card itself. Desktop browsers
// mostly refuse files, so there the panel opens instead and shares a link that
// reopens the word.
const SOCIALS = [
  { key: "x", name: "X", href: (u, t) => `https://x.com/intent/post?text=${encodeURIComponent(t)}&url=${encodeURIComponent(u)}` },
  { key: "bluesky", name: "Bluesky", href: (u, t) => `https://bsky.app/intent/compose?text=${encodeURIComponent(`${t}\n${u}`)}` },
  { key: "linkedin", name: "LinkedIn", href: (u) => `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(u)}` },
  { key: "whatsapp", name: "WhatsApp", href: (u, t) => `https://wa.me/?text=${encodeURIComponent(`${t} ${u}`)}` },
  { key: "telegram", name: "Telegram", href: (u, t) => `https://t.me/share/url?url=${encodeURIComponent(u)}&text=${encodeURIComponent(t)}` },
];

const buildSocials = () => {
  $("socials").innerHTML = SOCIALS.map(
    (s) => `<a class="sheet__b" data-social="${s.key}" target="_blank" rel="noopener noreferrer">${s.name}</a>`,
  ).join("");
};

const closeSheet = () => {
  const sheet = $("sheet");
  if (sheet.hidden) return;
  sheet.hidden = true;
  $("share").setAttribute("aria-expanded", "false");
};

const openSheet = () => {
  const entry = state.current;
  if (!entry) return;
  const url = shareUrl(entry);
  const text = shareText(entry);
  document.querySelectorAll("[data-social]").forEach((a) => {
    const s = SOCIALS.find((x) => x.key === a.dataset.social);
    a.href = s.href(url, text);
    a.setAttribute("aria-label", T().shareOn(s.name));
  });
  $("sheet").hidden = false;
  $("share").setAttribute("aria-expanded", "true");
  $("copyLink").focus();
};

const share = async () => {
  const entry = state.current;
  if (!entry) return;
  const t = T();
  const btn = $("share");
  if (!$("sheet").hidden) return closeSheet();

  // Only build the file when the browser will actually take one.
  if (navigator.canShare) {
    btn.disabled = true;
    flash(btn, t.drawing, 6000);
    try {
      const file = new File([await cardBlob(entry)], cardName(entry), { type: "image/png" });
      if (navigator.canShare({ files: [file] })) {
        const payload = { files: [file], title: `Lexicon — ${entry.word}`, text: shareText(entry) };
        try {
          await navigator.share({ ...payload, url: shareUrl(entry) });
        } catch (err) {
          if (err && err.name === "AbortError") return;
          // Some engines reject files alongside url; the file is the point, so drop the url.
          await navigator.share(payload);
        }
        return;
      }
    } catch (err) {
      if (err && err.name === "AbortError") return;
    } finally {
      btn.disabled = false;
      unflash(btn);
    }
  }
  openSheet();
};

const copyLink = async () => {
  if (!state.current) return;
  try {
    await navigator.clipboard.writeText(shareUrl(state.current));
    flash($("copyLink"), T().copied);
  } catch {
    flash($("copyLink"), T().failed, 1800);
  }
};

const copyImage = async () => {
  if (!state.current) return;
  const btn = $("copyImage");
  try {
    const blob = await cardBlob(state.current);
    await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
    flash(btn, T().copied);
  } catch {
    flash(btn, T().failed, 1800);
  }
};

// ── wiring ──────────────────────────────────────────────────────────────────
const setLevel = (n) => {
  state.level = n;
  seen = new Set();
  syncControls();
  save();
  draw();
};

// Switching language swaps the bank outright, so the drawn word and the
// no-repeat memory both belong to the language you are now in.
const setLang = (lang) => {
  if (!L10N[lang] || lang === state.lang) return;
  state.lang = lang;
  seen = new Set();
  state.current = null;
  paintLanguage();
  syncControls();
  save();
  const p = new URLSearchParams(location.search);
  p.set("lang", lang);
  history.replaceState(null, "", `?${p}`);
  draw();
};

load();
buildSocials();
paintLanguage();

// A shared link opens on its word — and moves the level and domain to match, so
// the controls describe what is actually on screen rather than contradicting it.
const openLinked = () => {
  if (!state.linked) return false;
  const entry = entries().find((e) => slugify(e.word) === state.linked);
  state.linked = null;
  if (!entry) return false;
  state.level = entry.level;
  state.domains.add(entry.domain);
  seen = new Set([entry.id]);
  syncControls();
  save();
  render(entry);
  return true;
};

syncControls();
if (!openLinked()) draw();

$("langs").addEventListener("click", (e) => {
  const btn = e.target.closest(".lang");
  if (btn) setLang(btn.dataset.lang);
});

$("levels").addEventListener("click", (e) => {
  const btn = e.target.closest(".lvl");
  if (btn) setLevel(Number(btn.dataset.level));
});

$("levels").addEventListener("keydown", (e) => {
  const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
  if (!step) return;
  e.preventDefault();
  const next = Math.min(ROMAN.length, Math.max(1, state.level + step));
  setLevel(next);
  document.querySelector(`.lvl[data-level="${next}"]`).focus();
});

$("chips").addEventListener("click", (e) => {
  const btn = e.target.closest(".chip");
  if (!btn) return;
  const key = btn.dataset.domain;
  if (state.domains.has(key)) state.domains.delete(key);
  else state.domains.add(key);
  seen = new Set();
  syncControls();
  save();
  draw();
});

const setAll = (on) => {
  state.domains = new Set(on ? DOMAIN_KEYS : []);
  seen = new Set();
  syncControls();
  save();
  draw();
};
$("allDomains").addEventListener("click", () => setAll(true));
$("noDomains").addEventListener("click", () => setAll(false));

$("next").addEventListener("click", draw);
$("dl").addEventListener("click", download);
$("share").addEventListener("click", share);
$("copyLink").addEventListener("click", copyLink);
$("copyImage").addEventListener("click", copyImage);

// The panel describes the word currently on screen, so drawing a new one closes it.
document.addEventListener("click", (e) => {
  if (!$("sheet").hidden && !e.target.closest("#sheet, #share")) closeSheet();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$("sheet").hidden) { closeSheet(); $("share").focus(); }
});

$("theme").addEventListener("click", () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const now = document.documentElement.dataset.theme || (dark ? "dark" : "light");
  document.documentElement.dataset.theme = now === "dark" ? "light" : "dark";
  save();
});

document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.closest("button, input, textarea, select")) return;
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); draw(); }
  if (e.key.toLowerCase() === "d") { e.preventDefault(); download(); }
  if (e.key.toLowerCase() === "s") { e.preventDefault(); share(); }
  if (e.key.toLowerCase() === "l") { e.preventDefault(); setLang(state.lang === "en" ? "fr" : "en"); }
});
</script>
</body>
</html>
